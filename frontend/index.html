function setSpeedPreference(spd, btn) {
  state.audioSpeed = spd;
  if (btn && btn.parentElement) {
    btn.parentElement.querySelectorAll('.segmented-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
  save();
  toast("Audio speed set to " + spd + "x");
}

function setScriptPreference(sc, btn) {
  state.scriptDisplay = sc;
  if (btn && btn.parentElement) {
    btn.parentElement.querySelectorAll('.segmented-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
  save();
  toast("Script display updated: " + sc);
}

function setBargeInPreference(sens, btn) {
  state.bargeInSensitivity = sens;
  if (btn && btn.parentElement) {
    btn.parentElement.querySelectorAll('.segmented-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
  save();
  toast("Barge-in sensitivity set to " + sens);
}


loadEducationalVocabulary();
loadTeacherVoiceStatus();

(function bootApp() {
  if (typeof window === "undefined" || !window.location) {
    login();
    return;
  }
  const urlParams = new URLSearchParams(window.location.search);
  const rawHash = (window.location.hash || "").replace(/^#\/?/, "");
  let hashRole = null;
  let hashPage = null;

  if (rawHash) {
    if (rawHash.includes("=")) {
      const hp = new URLSearchParams(rawHash);
      hashRole = hp.get("role");
      hashPage = hp.get("page");
    } else if (rawHash.includes("/")) {
      const parts = rawHash.split("/");
      if (parts[0] === "student" || parts[0] === "teacher") {
        hashRole = parts[0];
        hashPage = parts[1];
      } else {
        hashPage = parts[0];
      }
    } else {
      hashPage = rawHash;
    }
  }

  const roleParam = urlParams.get("role") || hashRole;
  const pageParam = urlParams.get("page") || hashPage;
  const isDemo = urlParams.has("demo") || (window.location.search && window.location.search.includes("demo")) || rawHash.includes("demo");

  let savedState = null;
  try {
    const s = localStorage.getItem("vflnState");
    if (s) savedState = JSON.parse(s);
  } catch(e) {}

  if (roleParam || pageParam) {
    state.role = roleParam || (savedState && savedState.role) || "student";
    let p = pageParam || (savedState && savedState.page);
    if (state.role === "teacher") {
      if (!p || p === "home" || p === "overview") p = "dashboard";
      else if (p === "voice") p = "live";
    } else {
      if (!p || p === "dashboard") p = "home";
      // keep voice as voice
    }
    state.page = p;
    if (state.role === "student") {
      state.studentName = (savedState && savedState.studentName) || localStorage.getItem("vflnStudentName") || "Birsa Munda";
      state.roll = (savedState && savedState.roll) || localStorage.getItem("vflnStudentRoll") || "12";
    }
    if (!state.room || !isValidRoomCode(state.room)) {
      state.room = (savedState && savedState.room) || "MUN-2026";
    }
    initBus();
    save();
    shell();
  } else if (isDemo) {
    enterDemoModeDirect();
    if (pageParam && ["live", "flashcards", "practice", "worksheet", "modules", "curriculum", "dashboard"].includes(pageParam)) {
      state.page = pageParam;
      state.translationDirection = "hi-unr";
      shell();
    }
  } else if (savedState && savedState.role && savedState.page) {
    state.role = savedState.role;
    let sp = savedState.page;
    if (state.role === "teacher") {
      if (sp === "home" || sp === "overview") sp = "dashboard";
      else if (sp === "voice") sp = "live";
    } else {
      if (sp === "dashboard") sp = "home";
      else if (sp === "voice") sp = "liveclass";
    }
    state.page = sp;
    state.room = savedState.room || "MUN-2026";
    state.joined = !!savedState.joined;
    if (state.role === "student") {
      state.studentName = savedState.studentName || localStorage.getItem("vflnStudentName") || "Birsa Munda";
      state.roll = savedState.roll || localStorage.getItem("vflnStudentRoll") || "12";
    }
    initBus();
    shell();
  } else {
    login();
  }
})();
