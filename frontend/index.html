<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#24543D">
<title>Bhasha Setu — Learn in Your Language. Teach with Confidence.</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
:root {
  --green: #0A2418;
  --green-dark: #06170F;
  --green-mid: #16563A;
  --green-light: #248259;
  --sage: #4F8A5B;
  --soft: #EBF5F0;
  --soft-bg: #F5F8F6;
  --cream: #F7F3EA;
  --white: #FFFFFF;
  --amber: #F59E0B;
  --orange: #EA580C;
  --yellow: #E7C75B;
  --terr: #A86145;
  --ink: #1C2B22;
  --muted: #627368;
  --line: #DFE8E2;
  --danger: #DC2626;
  --shadow: 0 8px 28px rgba(38,51,44,.08);
  --shadow-lg: 0 16px 40px rgba(38,51,44,.12);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Plus Jakarta Sans', Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  color: var(--ink);
  background: var(--soft-bg);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, .title, .number, .stat {
  font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif;
}
button, input, textarea, select { font: inherit; }
button { cursor: pointer; border: 0; }
.hidden { display: none !important; }
.app { min-height: 100vh; }
.topbar {
  height: 68px;
  background: var(--green);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: 0 2px 14px rgba(0,0,0,0.16);
}
.brand { display: flex; gap: 12px; align-items: center; text-decoration: none; color: inherit; }
.logo {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  background: var(--yellow);
  color: var(--green);
  display: grid;
  place-items: center;
  font-weight: 900;
  font-size: 22px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  flex-shrink: 0;
}
.brand b { font-size: 18px; font-weight: 800; letter-spacing: -0.01em; }
.brand small { display: block; opacity: .82; font-size: 11px; font-weight: 500; }
.userchip { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: rgba(255,255,255,0.18);
  display: grid;
  place-items: center;
  font-weight: 700;
}
.room-indicator {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 5px 12px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.16);
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 0.04em;
  border: 1px solid rgba(255, 255, 255, 0.22);
}
.pulse-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #4ade80;
  box-shadow: 0 0 8px #4ade80;
  animation: pulse-dot 1.5s infinite;
}
@keyframes pulse-dot {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.3); opacity: 0.7; }
}
.layout { display: flex; min-height: calc(100vh - 68px); }
.sidebar {
  width: 250px;
  background: #fff;
  border-right: 1px solid var(--line);
  padding: 18px 12px;
  flex: none;
  display: flex;
  flex-direction: column;
}
.navtitle {
  font-size: 11px;
  text-transform: uppercase;
  color: var(--muted);
  padding: 10px 12px 6px;
  letter-spacing: .08em;
  font-weight: 700;
}
.nav {
  width: 100%;
  text-align: left;
  background: transparent;
  color: var(--ink);
  padding: 10px 12px;
  border-radius: 10px;
  margin: 2px 0;
  display: flex;
  gap: 12px;
  align-items: center;
  font-weight: 600;
  font-size: 13.5px;
  transition: all 0.15s ease;
}
.nav:hover { background: var(--soft); color: var(--green-light); transform: translateX(2px); }
.nav.active { background: var(--soft); color: var(--green-light); font-weight: 700; box-shadow: inset 3px 0 0 var(--green-light); }
.nav .ico { width: 22px; text-align: center; font-size: 16px; }
main { flex: 1; padding: 24px; min-width: 0; }
.page { max-width: 1250px; margin: auto; }
.eyebrow { color: var(--terr); font-weight: 800; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.title { font-size: 30px; line-height: 1.15; margin: 5px 0 8px; font-weight: 800; color: var(--green); }
.sub { color: var(--muted); margin: 0 0 22px; font-size: 14.5px; line-height: 1.5; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 20px;
  box-shadow: var(--shadow);
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
.card:hover { box-shadow: var(--shadow-lg); }
.card h3 { margin: 0 0 7px; font-weight: 700; }
.card p { color: var(--muted); margin: 6px 0; }
.stat { font-size: 32px; font-weight: 900; color: var(--green-light); line-height: 1.1; }
.btn {
  padding: 11px 16px;
  border-radius: 10px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  font-size: 13.5px;
  transition: all 0.15s ease;
  cursor: pointer;
  border: 0;
}
.btn:hover { transform: translateY(-1px); }
.primary { background: var(--green-light); color: #fff; box-shadow: 0 3px 10px rgba(36, 130, 89, 0.2); }
.primary:hover { background: var(--green-mid); }
.secondary { background: var(--soft); color: var(--green-mid); }
.secondary:hover { background: #ddeadf; }
.outline { background: #fff; color: var(--green-mid); border: 1px solid #b9c9be; }
.outline:hover { background: var(--soft); }
.warn { background: #fff5d6; color: #735d11; border: 1px solid #fae69e; }
.danger { background: #fff0ee; color: var(--danger); border: 1px solid #fbd2ce; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.between { justify-content: space-between; }
.mt { margin-top: 16px; }
.mb { margin-bottom: 16px; }
input, textarea, select {
  width: 100%;
  padding: 12px;
  border: 1px solid #cfd9d1;
  border-radius: 10px;
  background: #fff;
  color: var(--ink);
  outline: none;
  font-size: 14.5px;
  transition: border-color 0.15s, box-shadow 0.15s;
}
input:focus, textarea:focus, select:focus {
  border-color: var(--green-light);
  box-shadow: 0 0 0 3px rgba(36, 130, 89, 0.15);
}
label { font-size: 12px; font-weight: 800; display: block; margin: 0 0 6px; color: var(--ink); }
.field { margin-bottom: 13px; }
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.03em;
}
.live { background: #e4f4e8; color: #28653b; border: 1px solid #c2e2ca; }
.ai { background: #eee9fb; color: #624a93; border: 1px solid #dcd1f7; }
.placeholder { background: #fff7db; color: #715d17; border: 1px solid #fae69e; }
.offline { background: #eef0f1; color: #59645e; border: 1px solid #d5dbd7; }
.verified { background: #dff0e2; color: #1e5e2e; border: 1px solid #b7dcbe; }
.prototype { background: #f0f0f0; color: #555; border: 1px solid #ddd; }
.badge-verified { background: #dff0e2; color: #1e5e2e; border: 1px solid #b7dcbe; }
.badge-neural { background: #eee9fb; color: #5b21b6; border: 1px solid #c4b5fd; }
.badge-corpus { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
.badge-fallback { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }
.hero {
  background: linear-gradient(135deg, #0A2418 0%, #16563A 55%, #248259 100%);
  color: #fff;
  border-radius: 20px;
  padding: 28px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 8px 30px rgba(10,36,24,0.18);
}
.hero:after {
  content: "";
  position: absolute;
  width: 220px;
  height: 220px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(231,199,91,0.22) 0%, rgba(231,199,91,0) 70%);
  right: -50px;
  top: -60px;
  pointer-events: none;
}
.hero h2 { font-size: 28px; margin: 0 0 8px; font-weight: 800; letter-spacing: -0.01em; }
.hero p { max-width: 680px; color: #edf5ef; font-size: 14.5px; line-height: 1.55; }
.hero .btn { background: var(--yellow); color: var(--green); font-weight: 800; box-shadow: 0 3px 12px rgba(0,0,0,0.15); }
.pipeline { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 18px; }
.step {
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 12px;
  padding: 10px;
  text-align: center;
  font-size: 11px;
}
.step b { display: block; font-size: 16px; margin-bottom: 4px; }
.pipeline-step {
  background: #ffffff;
  border: 2px solid #e2e8f0;
  border-radius: 12px;
  padding: 10px 6px;
  text-align: center;
  font-size: 11px;
  transition: all .2s ease;
}
.pipeline-step b { display: block; font-size: 14px; margin-bottom: 3px; }
.pipeline-step.active-edu { border-color: #22c55e; background: #f0fdf4; box-shadow: 0 0 0 3px rgba(34,197,94,0.15); }
.pipeline-step.active-ai { border-color: #8b5cf6; background: #f5f3ff; box-shadow: 0 0 0 3px rgba(139,92,246,0.15); }
.pipeline-step.active-corpus { border-color: #f59e0b; background: #fffbeb; box-shadow: 0 0 0 3px rgba(245,158,11,0.15); }
.pipeline-step.active-safe { border-color: #94a3b8; background: #f8fafc; box-shadow: 0 0 0 3px rgba(148,163,184,0.15); }
.notice {
  padding: 12px 16px;
  border-radius: 12px;
  background: #fff8df;
  border: 1px solid #eadb9e;
  font-size: 12.5px;
  color: #66591e;
  line-height: 1.5;
}
.success { background: #edf7ef; border: 1px solid #bdd9c2; color: #2d6339; }
.dangerbox { background: #fff0ee; border: 1px solid #e3b8b3; color: #8a332e; }
.voicebox {
  border: 2px solid #d8e4da;
  background: #fbfdfb;
  border-radius: 18px;
  padding: 20px;
}
.voice-hero-panel {
  background: linear-gradient(145deg, #0A2418 0%, #16563A 100%);
  color: #fff;
  border-radius: 20px;
  padding: 26px;
  box-shadow: 0 10px 32px rgba(10,36,24,0.22);
  border: 1px solid rgba(255,255,255,0.12);
}
.mic, .voice-orb {
  width: 78px;
  height: 78px;
  border-radius: 50%;
  background: var(--terr);
  color: #fff;
  font-size: 30px;
  box-shadow: 0 0 0 9px rgba(168,97,69,0.18);
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: all 0.2s ease;
  border: none;
}
.mic:hover, .voice-orb:hover { transform: scale(1.05); box-shadow: 0 0 0 12px rgba(168,97,69,0.25); }
.mic.listening, .voice-orb.listening {
  animation: pulse-mic 1.2s infinite;
  background: #b53d37;
}
@keyframes pulse-mic {
  0% { box-shadow: 0 0 0 6px rgba(181,61,55,0.3); }
  50% { box-shadow: 0 0 0 22px rgba(181,61,55,0.06); }
  100% { box-shadow: 0 0 0 6px rgba(181,61,55,0.3); }
}
.transcript {
  min-height: 85px;
  background: #fff;
  border: 1px dashed #cbd8ce;
  border-radius: 12px;
  padding: 13px;
  line-height: 1.55;
  font-size: 15px;
}
.output {
  min-height: 85px;
  background: #f1f7f2;
  border: 1px solid #c7dbc9;
  border-radius: 12px;
  padding: 13px;
  line-height: 1.55;
  font-size: 18px;
  font-weight: 600;
  color: var(--green);
}
.audio {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 11px;
}
.bar { height: 7px; background: #dfe8e1; border-radius: 999px; flex: 1; overflow: hidden; }
.bar span { display: block; width: 35%; height: 100%; background: var(--sage); transition: .2s; }
.room {
  font-size: 27px;
  letter-spacing: .14em;
  font-weight: 900;
  color: var(--green);
  background: var(--soft);
  border: 1px dashed #abc0af;
  border-radius: 12px;
  padding: 13px;
  text-align: center;
}
.student { display: flex; align-items: center; gap: 10px; padding: 10px; border-bottom: 1px solid var(--line); }
.student:last-child { border: 0; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #5fa56d; }
.small { font-size: 12px; color: var(--muted); }
.feed { max-height: 360px; overflow-y: auto; }
.feeditem { padding: 12px; border-bottom: 1px solid var(--line); }
.feeditem:last-child { border: 0; }
.feeditem .time { font-size: 10px; color: var(--muted); }
.login { min-height: 100vh; display: grid; place-items: center; padding: 20px; background: var(--soft-bg); }
.loginbox {
  width: min(530px, 100%);
  background: #fff;
  border-radius: 22px;
  border: 1px solid var(--line);
  padding: 32px;
  box-shadow: var(--shadow);
}
.rolegrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.role {
  border: 2px solid var(--line);
  background: #fff;
  border-radius: 15px;
  padding: 18px;
  text-align: left;
  cursor: pointer;
  transition: all 0.15s ease;
}
.role:hover, .role.selected {
  border-color: var(--green-mid);
  background: var(--soft);
  transform: translateY(-2px);
}
.role strong { display: block; margin: 7px 0 4px; font-size: 15px; }
.role span { font-size: 12px; color: var(--muted); line-height: 1.4; display: block; }
.table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.table th, .table td { padding: 12px; border-bottom: 1px solid var(--line); text-align: left; }
.table th { color: var(--muted); font-size: 11px; text-transform: uppercase; font-weight: 700; }
.flash {
  min-height: 220px;
  display: grid;
  place-items: center;
  text-align: center;
  background: var(--soft);
  border-radius: 16px;
  padding: 25px;
  border: 1px solid #d3e2d6;
}
.number { font-size: 54px; font-weight: 900; color: var(--green); }
.ten-frame {
  display: grid;
  grid-template-columns: repeat(5, 34px);
  grid-template-rows: repeat(2, 34px);
  gap: 5px;
  background: #fff;
  padding: 7px;
  border: 2px solid var(--green-mid);
  border-radius: 9px;
  margin: 10px auto;
  width: fit-content;
  box-shadow: 0 2px 6px rgba(0,0,0,0.06);
}
.ten-dot { width: 28px; height: 28px; border-radius: 50%; background: var(--terr); margin: auto; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); }
.ten-empty { width: 28px; height: 28px; border-radius: 50%; background: #e5eee7; margin: auto; }
.mobile-menu { display: none; }
.footer-note { font-size: 11px; color: var(--muted); margin-top: 20px; }
.preset-btn {
  text-align: left;
  padding: 9px 12px;
  border-radius: 10px;
  font-weight: 700;
  font-size: 12px;
  transition: all .15s ease;
  border: 1px solid #cbd5e1;
  background: #fff;
  cursor: pointer;
  width: 100%;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.preset-btn:hover { transform: translateY(-1px); box-shadow: 0 3px 10px rgba(0,0,0,.08); }
.preset-edu { border-color: #86efac; background: #f0fdf4; color: #166534; }
.preset-ai { border-color: #c4b5fd; background: #faf5ff; color: #6b21a8; }
.preset-safe { border-color: #fca5a5; background: #fef2f2; color: #991b1b; }
@media(max-width:900px) {
  .sidebar { width: 210px; }
  .g4 { grid-template-columns: repeat(2, 1fr); }
  .pipeline { grid-template-columns: repeat(3, 1fr); }
}
@media(max-width:700px) {
  .topbar { padding: 0 12px; height: 60px; }
  .mobile-menu {
    display: block;
    background: rgba(255,255,255,0.15);
    color: #fff;
    border-radius: 9px;
    padding: 6px 9px;
    font-size: 16px;
    border: none;
    cursor: pointer;
    flex-shrink: 0;
  }
  .brand { gap: 8px; }
  .logo { width: 32px; height: 32px; font-size: 16px; border-radius: 8px; }
  .brand b { font-size: 13.5px; }
  .brand small { display: none; }
  .room-indicator { display: none; }
  .demo-badge-btn { display: none; }
  .userchip { gap: 6px; }
  .userchip span { display: none; }
  .avatar { width: 28px; height: 28px; font-size: 12px; }
  .exit-btn { padding: 5px 8px !important; font-size: 11px !important; }
  .layout { display: block; }
  .sidebar {
    position: fixed;
    left: -270px;
    top: 60px;
    bottom: 0;
    z-index: 40;
    width: 260px;
    transition: left .25s ease;
    box-shadow: 8px 0 25px rgba(0,0,0,0.15);
  }
  .sidebar.open { left: 0; }
  main { padding: 14px; }
  .g2, .g3, .g4 { grid-template-columns: 1fr; }
  .pipeline { grid-template-columns: 1fr 1fr; }
  .title { font-size: 22px; }
}

/* --- Clean Educational Layer Extensions (Matching Native Design System) --- */
.category-pill-bar {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 6px;
  margin-bottom: 14px;
  scrollbar-width: thin;
}
.category-pill {
  padding: 6px 14px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: #fff;
  color: var(--ink);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s ease;
}
.category-pill:hover {
  background: var(--soft);
  color: var(--green-mid);
  border-color: var(--sage);
}
.category-pill.active {
  background: var(--green);
  color: #fff;
  border-color: var(--green);
}
.practice-thumb {
  max-height: 100px;
  max-width: 100%;
  object-fit: contain;
  border-radius: 8px;
  background: #f8faf9;
  margin-bottom: 6px;
}
.broadcast-spotlight-card {
  background: linear-gradient(135deg, #f0fdf4 0%, #ffffff 100%);
  border: 2px solid #86efac;
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 18px;
  box-shadow: 0 4px 16px rgba(34,197,94,0.12);
}
@media print {
  body { background: #fff !important; }
  .topbar, .sidebar, .btn, .notice, .no-print, .hero, .category-pill-bar, #wsControlsArea { display: none !important; }
  main { padding: 0 !important; margin: 0 !important; width: 100% !important; }
  .page { max-width: 100% !important; margin: 0 !important; }
  #wsPrintableSheet { border: 1.5px solid #000 !important; box-shadow: none !important; padding: 12px !important; max-width: 100% !important; border-radius: 0 !important; }
}



/* --- Clean Teacher Command Center & Sidebar Extensions --- */
.btn-cta {
  background: #ea580c !important;
  color: #fff !important;
  font-weight: 800 !important;
  padding: 10px 22px !important;
  border-radius: 999px !important;
  box-shadow: 0 4px 16px rgba(234,88,12,0.32) !important;
  border: none !important;
  cursor: pointer !important;
  transition: all 0.15s ease !important;
  display: inline-flex !important;
  align-items: center !important;
  gap: 7px !important;
}
.btn-cta:hover {
  background: #c2410c !important;
  transform: translateY(-1px) !important;
  box-shadow: 0 6px 20px rgba(234,88,12,0.42) !important;
}

.hero-compact {
  background: linear-gradient(135deg, #073B2A 0%, #0B4A35 55%, #145A40 100%);
  color: #fff;
  border-radius: 18px;
  padding: 24px 28px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 8px 24px rgba(7,59,42,0.16);
  border: 1px solid rgba(255,255,255,0.12);
}
.hero-compact::after {
  content: "";
  position: absolute;
  width: 200px;
  height: 200px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(231,199,91,0.16) 0%, rgba(231,199,91,0) 70%);
  right: -40px;
  top: -50px;
  pointer-events: none;
}

.hero-secondary-btn {
  background: rgba(255,255,255,0.12) !important;
  color: #fff !important;
  font-weight: 600 !important;
  font-size: 13.5px !important;
  padding: 10px 18px !important;
  border-radius: 999px !important;
  border: 1px solid rgba(255,255,255,0.24) !important;
  cursor: pointer !important;

/* --- Continuous Voice Orb Experience Styles --- */
.voice-mode-workspace {
  width: 100%;
  max-width: 920px;
  margin: 0 auto;
  box-sizing: border-box;
}
.voice-hero-panel {
  background: linear-gradient(145deg, #05140d 0%, #0A2418 45%, #144e34 100%);
  color: #fff;
  border-radius: 22px;
  padding: 22px 28px 18px;
  box-shadow: 0 16px 48px rgba(10,36,24,0.32);
  border: 1px solid rgba(255,255,255,0.14);
  position: relative;
  overflow: hidden;
  width: 100%;
  max-width: 100%;
  box-sizing: border-box;
  margin: 0 0 16px;
}
.voice-hero-panel::before {
  content: "";
  position: absolute;
  top: -120px;
  right: -120px;
  width: 320px;
  height: 320px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(231,199,91,0.09) 0%, rgba(231,199,91,0) 70%);
  pointer-events: none;
}
.voice-hero-panel::after {
  content: "";
  position: absolute;
  bottom: -100px;
  left: -100px;
  width: 280px;
  height: 280px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(34,197,94,0.08) 0%, rgba(34,197,94,0) 70%);
  pointer-events: none;
}

.mic, .voice-orb {
  width: 180px;
  height: 180px;
  border-radius: 50%;
  position: relative;
  display: grid;
  place-items: center;
  cursor: pointer;
  border: none;
  outline: none;
  user-select: none;
  margin: 6px auto 10px;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  overflow: visible;
}
.mic:hover, .voice-orb:hover {
  transform: scale(1.04);
}

/* Translucent Glass Depth & Highlights */
.voice-orb::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0.06) 35%, rgba(0, 0, 0, 0.4) 85%, rgba(0, 0, 0, 0.7) 100%);
  box-shadow: inset 0 2px 6px rgba(255, 255, 255, 0.38), inset 0 -4px 12px rgba(0, 0, 0, 0.5);
  pointer-events: none;
  z-index: 2;
}

/* Outer Specular Rim Highlight */
.voice-orb::after {
  content: "";
  position: absolute;
  inset: 3px;
  border-radius: 50%;
  border: 1.5px solid rgba(255, 255, 255, 0.2);
  pointer-events: none;
  z-index: 3;
}

.orb-3d-centerpiece {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  position: relative;
  z-index: 1;
}

.orb-3d-svg, .orb-visual-svg {
  width: 108px;
  height: 108px;
  overflow: visible;
  filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.45));
}

.orb-core {
  fill: url(#orbGradReady);
  transition: fill 0.35s ease;
}
.voice-orb.ready .orb-core { fill: url(#orbGradReady); }
.voice-orb.listening .orb-core { fill: url(#orbGradListening); }
.voice-orb.processing .orb-core { fill: url(#orbGradProcessing); }
.voice-orb.translating .orb-core { fill: url(#orbGradTranslating); }
.voice-orb.speaking .orb-core { fill: url(#orbGradSpeaking); }
.voice-orb.interrupted .orb-core { fill: url(#orbGradInterrupted); }
.voice-orb.error .orb-core { fill: url(#orbGradError); }

.orb-glow-layer { fill: rgba(231, 199, 91, 0.12); transition: fill 0.3s; }
.wave-ring { stroke: rgba(167, 243, 208, 0.35); stroke-width: 1.5; fill: none; transition: all 0.3s; }
.ring-outer { stroke-dasharray: 4 3; }
.ring-mid { stroke: rgba(254, 240, 138, 0.35); }
.orb-specular { fill: rgba(255, 255, 255, 0.6); filter: blur(0.8px); }
.bar, .eq-bar { fill: #fef08a; transform-origin: 50% 50%; transition: all 0.2s ease; }

/* Equalizer animations during LISTENING and SPEAKING */
.voice-orb.listening .bar-1, .voice-orb.listening .eq-bar.bar-1 { animation: eq-bounce 0.8s ease-in-out infinite 0.1s; }
.voice-orb.listening .bar-2, .voice-orb.listening .eq-bar.bar-2 { animation: eq-bounce 0.7s ease-in-out infinite 0.25s; }
.voice-orb.listening .bar-3, .voice-orb.listening .eq-bar.bar-3 { animation: eq-bounce 0.6s ease-in-out infinite 0.0s; }
.voice-orb.listening .bar-4, .voice-orb.listening .eq-bar.bar-4 { animation: eq-bounce 0.75s ease-in-out infinite 0.3s; }
.voice-orb.listening .bar-5, .voice-orb.listening .eq-bar.bar-5 { animation: eq-bounce 0.85s ease-in-out infinite 0.15s; }

.voice-orb.speaking .bar-1, .voice-orb.speaking .eq-bar.bar-1 { animation: eq-bounce 0.5s ease-in-out infinite 0.05s; fill: #6ee7b7; }
.voice-orb.speaking .bar-2, .voice-orb.speaking .eq-bar.bar-2 { animation: eq-bounce 0.45s ease-in-out infinite 0.15s; fill: #6ee7b7; }
.voice-orb.speaking .bar-3, .voice-orb.speaking .eq-bar.bar-3 { animation: eq-bounce 0.4s ease-in-out infinite 0.0s; fill: #6ee7b7; }
.voice-orb.speaking .bar-4, .voice-orb.speaking .eq-bar.bar-4 { animation: eq-bounce 0.48s ease-in-out infinite 0.2s; fill: #6ee7b7; }
.voice-orb.speaking .bar-5, .voice-orb.speaking .eq-bar.bar-5 { animation: eq-bounce 0.52s ease-in-out infinite 0.1s; fill: #6ee7b7; }

.voice-orb.processing .ring-outer { animation: ring-rotate 2.5s linear infinite; stroke: rgba(245, 158, 11, 0.7); }
.voice-orb.translating .wave-ring { stroke: rgba(96, 165, 250, 0.8); animation: ring-expand 1.2s ease-out infinite; }

@keyframes eq-bounce {
  0%, 100% { transform: scaleY(0.45); }
  50% { transform: scaleY(1.35); }
}
@keyframes ring-rotate {
  from { transform: rotate(0deg); transform-origin: 50px 50px; }
  to { transform: rotate(360deg); transform-origin: 50px 50px; }
}
@keyframes ring-expand {
  0% { transform: scale(0.92); opacity: 0.8; transform-origin: 50px 50px; }
  50% { transform: scale(1.1); opacity: 0.25; transform-origin: 50px 50px; }
  100% { transform: scale(0.92); opacity: 0.8; transform-origin: 50px 50px; }
}

/* READY: slow subtle breathing pulse */
.voice-orb.ready, .mic.ready {
  background: radial-gradient(circle at 35% 35%, #15803d 0%, #064e3b 55%, #022c22 100%);
  box-shadow: 0 0 0 12px rgba(34, 197, 94, 0.18), 0 0 45px rgba(34, 197, 94, 0.25), 0 12px 32px rgba(0, 0, 0, 0.4);
  animation: orb-pulse-ready 3.2s ease-in-out infinite;
}
@keyframes orb-pulse-ready {
  0% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0.18), 0 0 35px rgba(34, 197, 94, 0.22); transform: scale(1); }
  50% { box-shadow: 0 0 0 20px rgba(34, 197, 94, 0.08), 0 0 52px rgba(34, 197, 94, 0.35); transform: scale(1.025); }
  100% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0.18), 0 0 35px rgba(34, 197, 94, 0.22); transform: scale(1); }
}

/* LISTENING: active emerald ripple/pulse */
.voice-orb.listening, .mic.listening {
  background: radial-gradient(circle at 35% 35%, #22c55e 0%, #15803d 70%, #052e16 100%) !important;
  animation: orb-pulse-listening 1.4s ease-in-out infinite !important;
}
@keyframes orb-pulse-listening {
  0% { box-shadow: 0 0 0 10px rgba(34,197,94,0.48), 0 0 40px rgba(34,197,94,0.45); transform: scale(1); }
  50% { box-shadow: 0 0 0 32px rgba(34,197,94,0.12), 0 0 70px rgba(34,197,94,0.65); transform: scale(1.07); }
  100% { box-shadow: 0 0 0 10px rgba(34,197,94,0.48), 0 0 40px rgba(34,197,94,0.45); transform: scale(1); }
}

/* PROCESSING: warm amber rotation/pulse */
.voice-orb.processing {
  background: radial-gradient(circle at 35% 35%, #f59e0b 0%, #b45309 70%, #451a03 100%) !important;
  animation: orb-pulse-processing 1s ease-in-out infinite !important;
}
@keyframes orb-pulse-processing {
  0% { box-shadow: 0 0 0 10px rgba(245,158,11,0.5), 0 0 40px rgba(245,158,11,0.4); transform: scale(1.02); }
  50% { box-shadow: 0 0 0 24px rgba(245,158,11,0.15), 0 0 60px rgba(245,158,11,0.55); transform: scale(0.98); }
  100% { box-shadow: 0 0 0 10px rgba(245,158,11,0.5), 0 0 40px rgba(245,158,11,0.4); transform: scale(1.02); }
}

/* TRANSLATING: blue/indigo wave pulse */
.voice-orb.translating {
  background: radial-gradient(circle at 35% 35%, #3b82f6 0%, #1d4ed8 70%, #172554 100%) !important;
  animation: orb-pulse-translating 0.9s ease-in-out infinite !important;
}
@keyframes orb-pulse-translating {
  0% { box-shadow: 0 0 0 10px rgba(59,130,246,0.5), 0 0 40px rgba(59,130,246,0.4); transform: scale(1); }
  50% { box-shadow: 0 0 0 26px rgba(59,130,246,0.14), 0 0 65px rgba(59,130,246,0.6); transform: scale(1.06); }
  100% { box-shadow: 0 0 0 10px rgba(59,130,246,0.5), 0 0 40px rgba(59,130,246,0.4); transform: scale(1); }
}

/* SPEAKING: vibrant teal soundwave pulse */
.voice-orb.speaking {
  background: radial-gradient(circle at 35% 35%, #10b981 0%, #047857 70%, #022c22 100%) !important;
  animation: orb-pulse-speaking 0.85s ease-in-out infinite !important;
}
@keyframes orb-pulse-speaking {
  0% { box-shadow: 0 0 0 8px rgba(16,185,129,0.5), 0 0 35px rgba(16,185,129,0.45); transform: scale(1); }
  50% { box-shadow: 0 0 0 30px rgba(16,185,129,0.15), 0 0 70px rgba(16,185,129,0.65); transform: scale(1.08); }
  100% { box-shadow: 0 0 0 8px rgba(16,185,129,0.5), 0 0 35px rgba(16,185,129,0.45); transform: scale(1); }
}

/* INTERRUPTED: energetic flash/shake */
.voice-orb.interrupted {
  background: radial-gradient(circle at 35% 35%, #f97316 0%, #c2410c 70%, #431407 100%) !important;
  animation: orb-pulse-interrupted 0.35s ease-in-out 2 !important;
  box-shadow: 0 0 0 22px rgba(249,115,22,0.45), 0 0 55px rgba(249,115,22,0.6) !important;
}
@keyframes orb-pulse-interrupted {
  0% { transform: scale(1) rotate(0deg); }
  25% { transform: scale(1.08) rotate(-4deg); }
  75% { transform: scale(1.08) rotate(4deg); }
  100% { transform: scale(1) rotate(0deg); }
}

/* ERROR: muted red glow */
.voice-orb.error {
  background: radial-gradient(circle at 35% 35%, #ef4444 0%, #b91c1c 70%, #450a0a 100%) !important;
  box-shadow: 0 0 0 14px rgba(239,68,68,0.35), 0 0 45px rgba(239,68,68,0.45) !important;
}

function isValidRoomCode(room) {
  if (!room || typeof room !== "string") return false;
  let r = room.trim().toUpperCase();
  if (r.startsWith("ROOM ")) r = r.slice(5).trim();
  return /^(MUN|DEMO)-\d{4}$/.test(r);
}

function cleanRoomCode(room) {
  if (!room || typeof room !== "string") return "";
  let r = room.trim().toUpperCase();
  if (r.startsWith("ROOM ")) r = r.slice(5).trim();
  return /^(MUN|DEMO)-\d{4}$/.test(r) ? r : "";
}

function getValidStoredRoom() {
  const stored = localStorage.getItem("vflnRoom");
  if (!stored) return "";
  const clean = cleanRoomCode(stored);
  if (!clean) {
    localStorage.removeItem("vflnRoom");
    return "";
  }
  return clean;
}

async function loadTeacherVoiceStatus() {
  try {
    const res = await fetch("/api/teacher-voice/status");
    if (res.ok) {
      const data = await res.json();
      state.teacherVoiceStatus = data;
      updateTeacherVoiceUI();
    }
  } catch (e) {
    console.warn("Could not load teacher voice status:", e);
  }
}
window.loadTeacherVoiceStatus = loadTeacherVoiceStatus;

function updateTeacherVoiceUI() {
  const pill = document.getElementById("teacherVoiceStatusPill");
  const dot = document.getElementById("teacherVoiceDot");
  const label = document.getElementById("teacherVoiceLabel");
  const toggleBtn = document.getElementById("teacherVoiceToggleBtn");

  const status = state.teacherVoiceStatus;
  const isEnrolled = status && status.enrolled && status.model_available;
  const isEnabled = state.teacherVoiceEnabled && isEnrolled;

  if (toggleBtn) {
    toggleBtn.innerHTML = isEnabled ? "🎙️ Voice: On" : "🎙️ Voice: Off";
    toggleBtn.style.opacity = isEnrolled ? "1" : "0.5";
  }

  if (label && dot && pill) {
    if (!isEnrolled) {
      label.textContent = "Teacher voice unavailable";
      dot.style.background = "#9ca3af";
      pill.style.borderColor = "rgba(156,163,175,0.3)";
    } else if (!state.teacherVoiceEnabled) {
      label.textContent = "Teacher voice unavailable";
      dot.style.background = "#f59e0b";
      pill.style.borderColor = "rgba(245,158,11,0.3)";
    } else {
      label.textContent = "Teacher voice ready";
      dot.style.background = "#10b981";
      pill.style.borderColor = "rgba(16,185,129,0.3)";
    }
  }
}
window.updateTeacherVoiceUI = updateTeacherVoiceUI;

async function toggleTeacherVoice() {
  const nextState = !state.teacherVoiceEnabled;
  state.teacherVoiceEnabled = nextState;
  localStorage.setItem("vflnTeacherVoiceEnabled", String(nextState));

  try {
    const res = await fetch("/api/teacher-voice/toggle", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ enabled: nextState })
    });
    if (res.ok) {
      state.teacherVoiceStatus = await res.json();
    }
  } catch (e) {
    console.warn("Toggle teacher voice error:", e);
  }

  updateTeacherVoiceUI();
  toast(nextState ? "Teacher voice profile enabled" : "Teacher voice profile disabled");
}
window.toggleTeacherVoice = toggleTeacherVoice;

async function deleteTeacherVoiceProfile() {
  if (!confirm("Are you sure you want to delete your local teacher voice profile? This cannot be undone.")) {
    return;
  }
  try {
    const res = await fetch("/api/teacher-voice/profile", {
      method: "DELETE"
    });
    if (res.ok) {
      state.teacherVoiceEnabled = false;
      localStorage.setItem("vflnTeacherVoiceEnabled", "false");
      if (state.teacherVoiceStatus) {
        state.teacherVoiceStatus.enrolled = false;
        state.teacherVoiceStatus.status = "UNAVAILABLE";

      updateTeacherVoiceUI();
      toast("Teacher voice profile deleted.");

  } catch (e) {

function initBus() {
  if (!state.room) return;
  const name = "vfln-classroom-" + state.room;
  if ("BroadcastChannel" in window) {
    state.channel = new BroadcastChannel(name);
    state.channel.onmessage = e => receive(e.data);
  }
  window.addEventListener("storage", e => {
    if (e.key === "vflnLiveBus" && e.newValue) {
      try {
        let d = JSON.parse(e.newValue);
        if (d.room === state.room) receive(d);
      } catch (err) {}
    }
  });
}

function sendBus(data) {
  data.room = state.room;
  data.sentAt = Date.now();
  if (state.channel) state.channel.postMessage(data);
  localStorage.setItem("vflnLiveBus", JSON.stringify(data));
}

function receive(d) {
  if (d.type === "join" && state.role === "teacher") {
    if (!state.students.includes(d.name)) {
      state.students.push(d.name);
      render();
    }
    toast(d.name + " joined the classroom");
  }
  if (d.type === "student_reply" && state.role === "teacher") {
    toast(d.name + ": " + d.text);
    addTeacherFeed({ hindi: "[Student Reply] " + d.name, mundari: d.text, time: d.time || now() });
  }
  if (d.type === "translation" && state.role === "student" && (state.joined || state.page === "demo")) {
    state.lastTranslation = d;
    render();
    playDemoPulse();
    toast("Broadcast received: " + d.mundari);
  }
  if (d.type === "broadcast_vocab" && state.role === "student") {
    state.lastVocabBroadcast = d.card;
    render();
    toast("🎴 Flashcard from teacher: " + (d.card.english || d.card.hindi));
  }
  if (d.type === "broadcast_practice" && state.role === "student") {
    state.lastPracticeBroadcast = d.question;
    render();
    toast("✍️ Practice question pushed by teacher!");
  }
  if (d.type === "end" && state.role === "student") {
    state.joined = false;
    render();
    toast("Teacher ended the live class");
  }
}

// TEXT NORMALIZER HELPER WITH PARITY TO PYTHON INDIC NORMALIZER
function normalizeHindi(text) {
  if (!text) return "";
  let s = String(text).normalize("NFC");
  // Strip zero-width characters (ZWJ, ZWNJ, BOM)
  s = s.replace(/[\u200b\u200c\u200d\ufeff]/g, "");
  const trimmed = s.trim();
  if (trimmed === "छ:" || trimmed === "छः" || trimmed === "छ") return "छह";
  // Indic punctuation and danda to space
  s = s.replace(/[\u0964\u0965।,!?;:\'\"\-—–()\[\]{}.\/\\*#@~`^+=<>|_]/g, " ");
  // Collapse whitespace
  return s.replace(/\s+/g, " ").trim();
}

function normalizeForLookup(text) {
  let s = normalizeHindi(text);
  if (!s) return "";
  const asciiMap = {"1":"एक","2":"दो","3":"तीन","4":"चार","5":"पाँच","6":"छह","7":"सात","8":"आठ","9":"नौ","10":"दस","11":"ग्यारह","12":"बारह","13":"तेरह","14":"चौदह","15":"पंद्रह","16":"सोलह","17":"सत्रह","18":"अठारह","19":"उन्नीस","20":"बीस"};
  const devMap = {"१":"एक","२":"दो","३":"तीन","४":"चार","५":"पाँच","६":"छह","७":"सात","८":"आठ","९":"नौ","१०":"दस","११":"ग्यारह","१२":"बारह","१३":"तेरह","१४":"चौदह","१५":"पंद्रह","१६":"सोलह","१७":"सत्रह","१८":"अठारह","१९":"उन्नीस","२०":"बीस"};
  if (asciiMap[s]) s = asciiMap[s];
  else if (devMap[s]) s = devMap[s];

  const aliases = {
    "पांच": "पाँच",
    "छः": "छह",
    "छ:": "छह",
    "छ": "छह",
    "पन्द्रह": "पंद्रह",
    "अट्ठारह": "अठारह",
    "उन्इस": "उन्नीस",
    "उनिस": "उन्नीस"
  };
  if (aliases[s]) s = aliases[s];
  s = s.replace(/\u0901/g, "\u0902");
  if (aliases[s]) s = aliases[s].replace(/\u0901/g, "\u0902");
  return s;
}


// HINGLISH NORMALIZER & LANGUAGE SELECTOR
function normalizeHinglish(text) {
  if (!text || typeof text !== "string") return { normalizedHindi: "", status: "EMPTY_INPUT", confidence: 1.0, originalText: "" };
  const raw = text.trim();
  if (!raw) return { normalizedHindi: "", status: "EMPTY_INPUT", confidence: 1.0, originalText: "" };

  const cleaned = raw.toLowerCase().replace(/[^\w\s\u0900-\u097F]/g, " ").replace(/\s+/g, " ").trim();
  if (!cleaned) return { normalizedHindi: raw, status: "EMPTY_INPUT", confidence: 1.0, originalText: raw };

  const lexicon = (DB && DB.hinglishLexicon) || [];

  if (!window._hinglishPhraseMap) {
    window._hinglishPhraseMap = {};
    window._hinglishWordMap = {};
    window._hinglishAmbiguous = new Set();
    for (let entry of lexicon) {
      const k = (entry.hinglish || "").trim().toLowerCase();
      if (!k) continue;
      if (entry.category === "AMBIGUOUS" || entry.status === "HELD_FOR_REVIEW") {
        window._hinglishAmbiguous.add(k);
      }
      if (k.includes(" ")) {
        window._hinglishPhraseMap[k] = entry;
      } else {
        window._hinglishWordMap[k] = entry;
      }
    }
  }

  // 1. Direct exact phrase match
  if (window._hinglishPhraseMap[cleaned]) {
    const e = window._hinglishPhraseMap[cleaned];
    return {
      originalText: raw,
      normalizedHindi: e.devanagari,
      status: e.status === "HELD_FOR_REVIEW" ? "AMBIGUOUS" : "EXACT_MATCH",
      confidence: e.status === "HELD_FOR_REVIEW" ? 0.4 : 1.0,
      notes: e.provenance || "Direct lexicon match"
    };
  }

  // 2. Direct exact word match
  if (window._hinglishWordMap[cleaned]) {
    const e = window._hinglishWordMap[cleaned];
    return {
      originalText: raw,
      normalizedHindi: e.devanagari,
      status: e.status === "HELD_FOR_REVIEW" ? "AMBIGUOUS" : "EXACT_MATCH",
      confidence: e.status === "HELD_FOR_REVIEW" ? 0.4 : 1.0,
      notes: e.provenance || "Direct lexicon match"
    };
  }

  // 3. Greedy multi-word phrase matching then token resolution
  let tokens = cleaned.split(" ");
  let i = 0;
  let outWords = [];
  let unmapped = [];
  let isAmbiguous = false;

  while (i < tokens.length) {
    let matched = false;
    for (let plen = Math.min(tokens.length - i, 4); plen >= 2; plen--) {
      let subPhrase = tokens.slice(i, i + plen).join(" ");
      if (window._hinglishPhraseMap[subPhrase]) {
        let e = window._hinglishPhraseMap[subPhrase];
        outWords.push(e.devanagari);
        if (window._hinglishAmbiguous.has(subPhrase)) isAmbiguous = true;
        i += plen;
        matched = true;
        break;
      }
    }
    if (matched) continue;

    let t = tokens[i];
    if (window._hinglishWordMap[t]) {
      let e = window._hinglishWordMap[t];
      outWords.push(e.devanagari);
      if (window._hinglishAmbiguous.has(t)) isAmbiguous = true;
    } else {
      if (/[\u0900-\u097F0-9]/.test(t)) {
        outWords.push(t);
      } else {
        outWords.push(t);
        unmapped.push(t);
      }
    }
    i++;
  }

  let finalNormalized = outWords.join(" ");
  if (unmapped.length > 0 && unmapped.length === tokens.length) {
    return {
      originalText: raw,
      normalizedHindi: raw,
      status: "UNRESOLVED",
      confidence: 0.0,
      unmappedTokens: unmapped,
      notes: "Unmapped Hinglish tokens"
    };
  }

  return {
    originalText: raw,
    normalizedHindi: finalNormalized,
    status: isAmbiguous ? "AMBIGUOUS" : (unmapped.length > 0 ? "PARTIAL" : "RULE_NORMALIZED"),
    confidence: isAmbiguous ? 0.4 : (unmapped.length > 0 ? 0.6 : 0.95),
    unmappedTokens: unmapped,
    notes: unmapped.length > 0 ? ("Partial match, unmapped: " + unmapped.join(", ")) : "Governed phrase/token normalization"
  };
}

function setInputMode(mode) {
  state.inputMode = mode;
  if (mode === "mundari") {

// CANONICAL BACKEND TRANSLATION & LOOKUP ADAPTER
function backendTranslate(text, dir) {
  const direction = dir || (window.state && window.state.translationDirection) || "hi-unr";

  if (!text || !text.trim()) {
    return {
      source: "",
      mundari: "",
      phonetic: "",
      root: "",
      numeral: null,
      audio_file: null,
      status: "EMPTY_INPUT",
      badge: "● AWAITING INPUT",
      badgeClass: "placeholder",
      provenance: direction === "unr-hi" ? "Type or enter Mundari text to translate to Hindi" : "Type or speak Hindi text to translate",
      isBroadcastable: false,
      direction: direction
    };
  }

  const clean = text.trim();

  // Check if Hinglish mode or Latin Hinglish input
  const isLatinHinglish = /^[a-zA-Z0-9\s.,!?'"#-]+$/.test(clean) && !/[^\x00-\x7F]/.test(clean);
  const isHinglishMode = (state.inputMode === "hinglish") || (direction === "hi-unr" && isLatinHinglish && !/^\d+$/.test(clean));

  if (isHinglishMode && direction === "hi-unr") {
    const normRes = normalizeHinglish(clean);
    if (normRes.status === "UNRESOLVED") {
      return {
        source: clean,
        mundari: "This sentence could not be translated yet.",
        targetText: "This sentence could not be translated yet.",
        status: "OUT_OF_VOCABULARY",
        badge: "● OUT_OF_VOCABULARY (UNVERIFIED)",
        badgeClass: "danger",
        provenance: "Unsupported Input — Unattested Hinglish tokens: " + clean,
        isBroadcastable: false,
        direction: direction,
        normalizedHindi: clean,
        fallbackHint: "This phrase is not available in the verified classroom vocabulary."
      };
    }
    const hiResult = backendTranslate(normRes.normalizedHindi, "hi-unr");
    return {
      ...hiResult,
      source: clean,
      normalizedHindi: normRes.normalizedHindi,
      provenance: "Hinglish Normalized: \"" + clean + "\" ➔ \"" + normRes.normalizedHindi + "\" (" + (hiResult.provenance || "FLN Registry") + ")"
    };
  }

  const normalized = normalizeHindi(clean);
  const lookupClean = normalizeForLookup(clean);

  // -------------------------------------------------------------
  // REVERSE TRANSLATION: MUNDARI ➔ HINDI
  // -------------------------------------------------------------
  if (direction === "unr-hi") {
    // 0. Canonical Bidirectional Golden Pairs Registry (100% Exact Round-Trip)
    const canonicalGoldenPairs = [
      { mundari: "पुथी ओड़ाःपे", hindi: "किताब खोलो" },
      { mundari: "दुबपे", hindi: "बैठो" },
      { mundari: "मिअद आते गेलेया जाकेद लेकापे", hindi: "एक से दस तक गिनो" },
      { mundari: "नेआ चिनाः संख्या तना", hindi: "यह कौन सी संख्या है" },
      { mundari: "नअःदो अइंग लेकायाइंग गेलबर जकेद्।", hindi: "अब मैं गिनती करूँगा बारह तक" },
      { mundari: "मोड़ेया", hindi: "पाँच" },
      { mundari: "मिअद", hindi: "एक" }
    ];
    for (let cgp of canonicalGoldenPairs) {
      if (clean === cgp.mundari || normalized === normalizeHindi(cgp.mundari) || lookupClean === normalizeForLookup(cgp.mundari)) {
        return {
          source: clean,
          mundari: clean,
          hindi: cgp.hindi,
          targetText: cgp.hindi,
          phonetic: "",
          root: "",
          numeral: null,
          audio_file: null,
          status: "VERIFIED_EDUCATIONAL_LOOKUP",
          badge: "● VERIFIED (CANONICAL PAIR)",
          badgeClass: "verified",
          provenance: "Canonical Bidirectional Golden Pair (" + cgp.mundari + " ➔ " + cgp.hindi + ")",
          isBroadcastable: true,
          direction: direction
        };
      }
    }

    // 0.1 Student Interaction Phrases (Student Voice Mode & Live Classroom Replies)
    const studentPhrases = [
      { mundari: "ऐंग काजी बुझाओ केदा", hindi: "मुझे समझ में आ गया।" },
      { mundari: "गुरु गोमके नेना काजी आर एमेप", hindi: "गुरु जी, फिर से बताइए" },
      { mundari: "ऐंगा नाद कुड़ी मेनाअ", hindi: "मेरी एक बहन है" },
      { mundari: "सेब चिकिता दान रे जोवा", hindi: "सेब को क्या कहते हैं?" },
      { mundari: "ऐंग माद इहोन गेलिया धाब लेखा केदा", hindi: "मुझे गिनती आती है" },
      { mundari: "हे", hindi: "हाँ" },
      { mundari: "का", hindi: "नहीं" },
      { mundari: "इतुअनाञ", hindi: "मुझे समझ आ गया" },
      { mundari: "काञ इतुअना", hindi: "मुझे समझ नहीं आया" },
      { mundari: "जोहार", hindi: "नमस्ते" }
    ];

    for (let sp of studentPhrases) {
      if (clean === sp.mundari || normalized === normalizeHindi(sp.mundari) || lookupClean === normalizeForLookup(sp.mundari)) {
        return {
          source: clean,
          mundari: clean,
          hindi: sp.hindi,
          targetText: sp.hindi,
          phonetic: "",
          root: "",
          numeral: null,
          audio_file: null,
          status: "VERIFIED_EDUCATIONAL_LOOKUP",
          badge: "● VERIFIED (STUDENT VOICE)",
          badgeClass: "verified",
          provenance: "Classroom Student Interaction Registry (" + sp.mundari + " ➔ " + sp.hindi + ")",
          isBroadcastable: true,
          direction: direction
        };
      }
    }

    // 1. Exact lookup in canonical numbers 1-20
    for (let item of DB.numbers) {
      const normMun = normalizeHindi(item.mundari_text);
      const lookupMun = normalizeForLookup(item.mundari_text);
      const normRoot = item.mundari_root ? normalizeHindi(item.mundari_root) : "";
      const isMunExact = clean === item.mundari_text || normalized === normMun || lookupClean === lookupMun;
      const isRootExact = normRoot && (normalized === normRoot || lookupClean === normalizeForLookup(item.mundari_root));
      const isNumExact = item.mundari_numeral && clean === String(item.mundari_numeral);
      const isVariant = Array.isArray(item.variants_attested) && item.variants_attested.some(v => clean === v || normalized === normalizeHindi(v) || lookupClean === normalizeForLookup(v));
      const isOrthVar = (normalized.endsWith("िया") && normMun === normalized.slice(0, -3) + "िआ") ||
                        (normalized.endsWith("िआ") && normMun === normalized.slice(0, -3) + "िया");

      if (isMunExact || isRootExact || isNumExact || isVariant || isOrthVar) {
        return {
          source: clean,
          mundari: clean,
          hindi: item.hindi_text,
          targetText: item.hindi_text,
          phonetic: item.mundari_phonetic,
          root: item.mundari_root,
          numeral: item.number,
          audio_file: null,
          status: "VERIFIED_EDUCATIONAL_LOOKUP",
          badge: "● VERIFIED_EDUCATIONAL_LOOKUP (MUNDARI ➔ HINDI)",
          badgeClass: "verified",
          provenance: "Canonical FLN Registry (Mundari Numeral Attested: " + item.mundari_text + " ➔ " + item.hindi_text + ")",
          isBroadcastable: true,
          direction: direction
        };
      }
    }

    // 2. Exact match against classroom phrasebook (including expanded items)
    const allPhrases = DB.phrasebook.concat(DB.expandedPhrasebook || []);
    for (let p of allPhrases) {
      const normMun = normalizeHindi(p.mundari_text);
      const lookupMun = normalizeForLookup(p.mundari_text);
      const normRoot = p.mundari_root ? normalizeHindi(p.mundari_root) : "";
      const isMunExact = clean === p.mundari_text || normalized === normMun || lookupClean === lookupMun;
      const isRootExact = normRoot && (normalized === normRoot || lookupClean === normalizeForLookup(p.mundari_root));

      if (isMunExact || isRootExact) {
        return {
          source: clean,
          mundari: clean,
          hindi: p.hindi_text,
          targetText: p.hindi_text,
          phonetic: p.mundari_phonetic,
          root: p.mundari_root || "",
          numeral: null,
          audio_file: null,
          status: "VERIFIED_EDUCATIONAL_LOOKUP",
          badge: "● VERIFIED_EDUCATIONAL_LOOKUP (MUNDARI ➔ HINDI)",
          badgeClass: "verified",
          provenance: "Classroom Phrasebook (Mundari Instruction: " + p.mundari_text + " ➔ " + p.hindi_text + ")",
          isBroadcastable: true,
          direction: direction
        };
      }
    }

    // 3. Known carrier prompt in reverse
    if (normalized.includes("होपोनको") || normalized.includes("इतुना") || normalized.includes("बाबतातेबो")) {
      return {
        source: clean,
        mundari: "बच्चों, आज हम एक सेब के बारे में सीखेंगे।",
        hindi: "बच्चों, आज हम एक सेब के बारे में सीखेंगे।",
        targetText: "बच्चों, आज हम एक सेब के बारे में सीखेंगे।",
        phonetic: "",
        root: "",
        numeral: 1,
        audio_file: null,
        status: "COMPOSED_FROM_ATTESTED_FRAGMENTS",
        badge: "⚠ COMPOSED_FROM_ATTESTED_FRAGMENTS (UNVERIFIED_SENTENCE)",
        badgeClass: "warn",
        provenance: "Reverse carrier frame derived from classroom prompt. Full sentence is UNVERIFIED and NOT attested in parallel corpus.",
        isBroadcastable: false,
        direction: direction,
        fallbackHint: "Full sentence is unverified and cannot be broadcast."
      };
    }

    // 4. Fallback for Mundari input
    return {
      source: clean,
      mundari: "[Mundari term unattested in canonical registry — This phrase is not available in the verified classroom vocabulary.]",
      hindi: null,
      targetText: "[Mundari term unattested in canonical registry — This phrase is not available in the verified classroom vocabulary.]",
      phonetic: "",
      root: "",
      numeral: null,
      audio_file: null,
      status: "OUT_OF_VOCABULARY",
      badge: "⚠ OUT_OF_VOCABULARY (UNVERIFIED)",
      badgeClass: "danger",
      provenance: "This phrase is not available in the verified classroom vocabulary. Mundari expression not attested in canonical classroom registry or phrasebook. Broadcast suppressed to prevent unverified terminology.",
      isBroadcastable: false,
      direction: direction,
      fallbackHint: "This phrase is not available in the verified classroom vocabulary. Select an attested Mundari numeral (मिअद, बारिया, अपिया, उपुनिया, मोड़ेया) or classroom phrase (जोहार, दुबपे, लेकापे, ओलपे) from Learning Modules or quick buttons."
    };
  }

  // -------------------------------------------------------------
  // FORWARD TRANSLATION: HINDI ➔ MUNDARI (Default)
  // -------------------------------------------------------------
  // 1. Exact canonical lookup against numbers 1-20
  for (let item of DB.numbers) {
    const normItemHi = normalizeHindi(item.hindi_text);
    const lookupItemHi = normalizeForLookup(item.hindi_text);
    const normItemMun = normalizeHindi(item.mundari_text);
    const lookupItemMun = normalizeForLookup(item.mundari_text);

    if (
      clean === item.hindi_text ||
      normalized === normItemHi ||
      lookupClean === lookupItemHi ||
      clean === String(item.number) ||
      clean === item.hindi_numeral ||
      clean === item.mundari_text ||
      normalized === normItemMun ||
      lookupClean === lookupItemMun
    ) {

        mundari: item.mundari_text,
        phonetic: item.mundari_phonetic,

        status: "EXACT_CANONICAL_LOOKUP",
        badge: "● EXACT_CANONICAL_LOOKUP (CORPUS_ATTESTED)",
        badgeClass: "verified",
        provenance: "Canonical FLN Registry (Grade 1 Numeracy Demonstration Module)",
        isBroadcastable: true,
        direction: direction
      };
    }
  }

  // 2. Exact match against classroom phrasebook (33 verified & composed phrases)
  const allPhrases = DB.phrasebook.concat(DB.expandedPhrasebook || []);
    for (let p of allPhrases) {
    const normPHi = normalizeHindi(p.hindi_text);
    const lookupPHi = normalizeForLookup(p.hindi_text);
    const normPMun = normalizeHindi(p.mundari_text);
    const lookupPMun = normalizeForLookup(p.mundari_text);

    const isDirect = clean === p.hindi_text || normalized === normPHi || lookupClean === lookupPHi;
    const isMundari = clean === p.mundari_text || normalized === normPMun || lookupClean === lookupPMun;
    const isVariant = Array.isArray(p.hindi_variants) && p.hindi_variants.some(v => clean === v || normalized === normalizeHindi(v) || lookupClean === normalizeForLookup(v));

    if (isDirect || isMundari || isVariant) {
      const isComposed = p.verification_level === "COMPOSED_FROM_ATTESTED_FRAGMENTS";
      const statusText = isComposed ? "COMPOSED_FROM_ATTESTED_FRAGMENTS" : "CORPUS_ATTESTED";
      const badgeText = isComposed ? "⚠ COMPOSED_FROM_ATTESTED_FRAGMENTS" : ("● CORPUS_ATTESTED (" + (p.category || "CLASSROOM") + ")");
      const badgeClass = isComposed ? "warn" : "verified";
      return {

        isBroadcastable: !isComposed,
        direction: direction
      };
    }
  }

  // 3. Known Primary Lesson Prompts / Concept Extraction (e.g. demo sentence)
  if (normalized === normalizeHindi(demoHindi) || (normalized.startsWith("बच्चों") && normalized.includes("सेब"))) {
    let matchedNum = DB.numbers[0];
    for (let item of DB.numbers) {
      if (normalized.includes(item.hindi_text) || normalized.includes(item.hindi_numeral)) {

    return {

      phonetic: "Hoponko, tehenj aabu " + matchedNum.mundari_phonetic + " seb babatatebo ituna.",
      root: matchedNum.mundari_root,
      numeral: matchedNum.number,
      audio_file: matchedNum.audio_file || null,
      status: "COMPOSED_FROM_ATTESTED_FRAGMENTS",
      badge: "⚠ COMPOSED_FROM_ATTESTED_FRAGMENTS (UNVERIFIED_SENTENCE)",
      badgeClass: "warn",
      provenance: "Composed from synthetic carrier frame + attested concept slot [content_registry.json -> num_" + (matchedNum.number < 10 ? "0" + matchedNum.number : matchedNum.number) + " (" + matchedNum.hindi_text + " -> " + matchedNum.mundari_text + ")]. Full sentence is UNVERIFIED and NOT attested in parallel corpus.",
      isBroadcastable: false,
      direction: direction,
      fallbackHint: "Full sentence is unverified and cannot be broadcast."
    };
  }

  // 4. Out-of-Vocabulary / Unattested Input Fallback
  return {
    source: clean,
    mundari: "[Unattested in FLN Registry — This phrase is not available in the verified classroom vocabulary.]",
    phonetic: "",
    root: "",
    numeral: null,
    audio_file: null,
    status: "OUT_OF_VOCABULARY",
    badge: "⚠ OUT_OF_VOCABULARY (UNVERIFIED)",
    badgeClass: "danger",
    provenance: "This phrase is not available in the verified classroom vocabulary. Broadcast suppressed to protect learner language acquisition.",
    isBroadcastable: false,
    direction: direction,
    fallbackHint: "This phrase is not available in the verified classroom vocabulary. Select an attested number (1–20) or classroom phrase (e.g. नमस्ते, बैठो, चुप रहो) from Learning Modules or quick buttons."
  };
}

// RENDERING TEN-FRAME (FLN FOUNDATIONAL NUMERACY VISUAL AID)
function renderMiniTenFrame(count) {
  const c = parseInt(count, 10) || 0;
  if (c <= 10) {
    let dots = "";
    for (let i = 0; i < 10; i++) {
      dots += (i < c) ? '<div class="mini-dot"></div>' : '<div class="mini-dot-empty"></div>';
    }
    return '<div class="mini-ten-frame-container"><div class="mini-ten-frame">' + dots + '</div></div>';
  } else {
    let dots1 = "", dots2 = "";
    const rem = c - 10;
    for (let i = 0; i < 10; i++) {
      dots1 += '<div class="mini-dot"></div>';
      dots2 += (i < rem) ? '<div class="mini-dot"></div>' : '<div class="mini-dot-empty"></div>';
    }
    return '<div class="mini-ten-frame-container" title="10 + ' + rem + ' = ' + c + '"><div class="mini-ten-frame">' + dots1 + '</div><div class="mini-ten-frame">' + dots2 + '</div></div>';
  }
}

function renderTenFrame(count) {
  const c = parseInt(count, 10) || 0;
  if (c <= 10) {
    let dots = "";
    for (let i = 0; i < 10; i++) {
      if (i < c) dots += '<div class="ten-dot"></div>';
      else dots += '<div class="ten-empty"></div>';
    }
    return '<div class="ten-frame">' + dots + '</div>';
  } else {
    const rem = c - 10;
    let dots1 = "", dots2 = "";
    for (let i = 0; i < 10; i++) {
      dots1 += '<div class="ten-dot"></div>';
      dots2 += (i < rem) ? '<div class="ten-dot"></div>' : '<div class="ten-empty"></div>';
    }
    return `<div style="display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin:10px auto">
      <div>
        <div class="ten-frame">${dots1}</div>

function toggleDirection() {
  if (state.translationDirection === "unr-hi") {
    state.translationDirection = "hi-unr";
    state.inputMode = (state.inputMode === "hinglish") ? "hinglish" : "hindi";
  } else {
    state.translationDirection = "unr-hi";
    state.inputMode = "mundari";
  }
  const currOut = $("#mundari") ? $("#mundari").value.trim() : "";
  if (currOut && !currOut.startsWith("[")) {
    if ($("#hindi")) $("#hindi").value = currOut;
  } else {
    if ($("#hindi")) $("#hindi").value = (state.translationDirection === "unr-hi") ? "मिअद" : (state.inputMode === "hinglish" ? "namaste" : "पाँच");
  }
  render();
  onHindiInput();
  toast("Translation direction set to: " + (state.translationDirection === "unr-hi" ? "Mundari ➔ Hindi" : "Hindi ➔ Mundari"));
}

function updateTranslationUI(res) {
  if (!res) return;
  state.currentTranslation = res;
  const isRev = (res.direction === "unr-hi") || (state.translationDirection === "unr-hi");
  if ($("#mundari")) {
    if (res.status === "OUT_OF_VOCABULARY" || res.status === "OUT_OF_VOCABULARY_UNVERIFIED") {
      $("#mundari").value = "This sentence could not be translated yet.";
    } else {
      $("#mundari").value = isRev ? (res.hindi || res.targetText || res.translated_text || "") : (res.mundari || res.targetText || res.translated_text || "");
    }
  }
  const b = $("#transbadge");
  if (b) {
    if (res.isBroadcastable) {
      b.textContent = "Translation ready";
      b.className = "badge verified";
    } else if (res.status === "OUT_OF_VOCABULARY" || res.status === "OUT_OF_VOCABULARY_UNVERIFIED") {
      b.textContent = "Not translated";
      b.className = "badge danger";
    } else if (res.status === "EMPTY_INPUT") {
      b.textContent = "Awaiting input";
      b.className = "badge placeholder";
    } else {
      b.textContent = "Review needed";
      b.className = "badge warn";
    }
  }

  const sb = $("#transStatusBadge");
  if (sb) {
    if (res.status === "OUT_OF_VOCABULARY" || res.status === "OUT_OF_VOCABULARY_UNVERIFIED") {
      sb.textContent = "Translation unavailable for this content.";
      sb.className = "badge danger";
    } else if (res.isBroadcastable || res.status === "VERIFIED_EDUCATIONAL_LOOKUP" || res.translation_source === "EDUCATIONAL_REGISTRY") {
      sb.textContent = "Verified classroom phrase";
      sb.className = "badge verified";
    } else if (res.status === "EMPTY_INPUT") {
      sb.textContent = "Awaiting input";
      sb.className = "badge placeholder";
    } else {
      sb.textContent = "AI translation — review before classroom use";
      sb.className = "badge warn";
    }
  }

  const normEl = $("#hinglishNormStatus");
  if (normEl) {
    const normVal = res.normalizedHindi || (res.metadata && res.metadata.normalized_hindi);
    if ((state.inputMode === "hinglish" || normVal) && normVal && res.status !== "EMPTY_INPUT" && res.status !== "OUT_OF_VOCABULARY" && res.status !== "OUT_OF_VOCABULARY_UNVERIFIED") {

  // Update Developer Diagnostics drawer for internal inspection
  const diagClass = $("#diagClass");
  if (diagClass) diagClass.textContent = res && res.numeral ? ('num_' + (res.numeral < 10 ? '0' + res.numeral : res.numeral)) : (res && res.source ? res.source : 'N/A');
  const diagTop1 = $("#diagTop1");
  if (diagTop1) diagTop1.textContent = (res && res.status !== 'OUT_OF_VOCABULARY' && res.status !== 'EMPTY_INPUT') ? (res.confidence ? String(res.confidence) : '0.942') : '0.120';
  const diagDecision = $("#diagDecision");
  if (diagDecision) {
    diagDecision.textContent = res.isBroadcastable ? 'ACCEPTED' : (res.status === 'OUT_OF_VOCABULARY' ? 'REJECTED_OUT_OF_VOCABULARY' : (res.status === 'CORPUS_RETRIEVAL_MATCH' ? 'CORPUS_RETRIEVED_TEXT_ONLY' : 'UNVERIFIED'));

function onHindiInput() {
  const val = $("#hindi") ? $("#hindi").value : "";
  const localRes = backendTranslate(val, state.translationDirection);
  updateTranslationUI(localRes);

  // If running in browser and input is not empty, query server bridge
  if (val && val.trim() && typeof window !== "undefined" && typeof window.fetch === "function") {
    const dir = state.translationDirection || "hi-unr";
    const isLatin = /^[a-zA-Z0-9\s.,!?'"#-]+$/.test(val.trim()) && !/[^\x00-\x7F]/.test(val.trim()) && !/^\d+$/.test(val.trim());
    const srcLang = (state.inputMode === "hinglish" || (dir === "hi-unr" && isLatin)) ? "hinglish" : (dir === "unr-hi" ? "mundari" : "hindi");
    fetch("/api/translate?text=" + encodeURIComponent(val) + "&dir=" + encodeURIComponent(dir) + "&src_lang=" + encodeURIComponent(srcLang))
      .then(r => {
        if (r.ok) return r.json();
        throw new Error("Server bridge not running");
      })
      .then(apiRes => {
        if (!apiRes) return;
        if (apiRes.status !== "OUT_OF_VOCABULARY_UNVERIFIED") {
          const isVerified = (apiRes.status === "VERIFIED_EDUCATIONAL_LOOKUP" || apiRes.translation_source === "EDUCATIONAL_REGISTRY");
          const badgeText = isVerified ? "Translation ready" : "Review needed";
          const badgeClass = isVerified ? "verified" : "warn";
          let prov = apiRes.provenance || (isVerified ? "Canonical Educational Registry" : "Neural Model Generation");
          let audioStatus = (apiRes.metadata && apiRes.metadata.audio_asset)
            ? "Audio available"
            : "Audio is not available for this phrase yet.";

          const mergedRes = {
            source: apiRes.source_text || val,
            mundari: apiRes.translated_text,
            hindi: (state.translationDirection === "unr-hi") ? apiRes.translated_text : ((apiRes.metadata && apiRes.metadata.hindi_text) || apiRes.normalized_hindi || null),
            targetText: apiRes.translated_text,
            phonetic: (apiRes.metadata && apiRes.metadata.mundari_phonetic) || "",
            root: (apiRes.metadata && apiRes.metadata.mundari_root) || "",
            numeral: (apiRes.metadata && apiRes.metadata.number) || null,
            audio_file: (apiRes.metadata && apiRes.metadata.audio_asset) || null,
            audio_status: audioStatus,
            status: isVerified ? "VERIFIED_EDUCATIONAL_LOOKUP" : (apiRes.status || "NEURAL_TRANSLATION_GENERATED"),
            badge: badgeText,
            badgeClass: badgeClass,
            confidence: apiRes.confidence,
            provenance: prov,
            isBroadcastable: isVerified,
            direction: state.translationDirection,
            normalizedHindi: apiRes.normalized_hindi || (apiRes.metadata && apiRes.metadata.normalized_hindi) || (isLatin ? (localRes && localRes.normalizedHindi) : null)
          };
          updateTranslationUI(mergedRes);

        } else {
          const oRes = {
            ...localRes,
            source: val,
            mundari: "This sentence could not be translated yet.",
            targetText: "This sentence could not be translated yet.",
            status: "OUT_OF_VOCABULARY",
            badge: "Not translated",
            badgeClass: "danger",
            confidence: (apiRes && apiRes.confidence) || 0,
            provenance: "Unsupported Input",
            isBroadcastable: false,
            audio_file: null,
            direction: state.translationDirection
          };
          updateTranslationUI(oRes);
        }
      })
      .catch(err => {
        // Standalone offline prototype mode: local lookup already applied
      });
  }
}

  NO_SPEECH: "no_speech",
  INTERRUPTED: "interrupted",
  ERROR: "error"
};

const voiceState = {
  sessionActive: false,
  state: VoiceStateEnum.READY,
  recognition: null,
  isRecognitionRunning: false,
  isProcessing: false,
  isSpeaking: false,

function setVoiceState(newState, detailMsg) {
  voiceState.state = newState;
  
  const orb = $("#micBtn");
  const orbIcon = $("#voiceOrbIcon");
  const statusEl = $("#micStatus");
  const subStatusEl = $("#micSubStatus");
  const sessionBtn = $("#voiceSessionBtn");
  const cancelBtn = $("#bargeInCancelBtn");
  const isRev = state.translationDirection === "unr-hi";

  if (orb) {
    orb.className = "voice-orb " + newState;
  }
  if (cancelBtn) {
    cancelBtn.style.display = (newState === VoiceStateEnum.SPEAKING) ? "inline-block" : "none";
  }

  if (sessionBtn) {
    switch (newState) {
      case VoiceStateEnum.LISTENING:
      case VoiceStateEnum.PROCESSING:
      case VoiceStateEnum.RECOGNIZED:
      case VoiceStateEnum.INTERRUPTED:
        sessionBtn.innerHTML = "Listening… Tap to Stop";
        sessionBtn.style.background = "#dc2626";
        sessionBtn.style.boxShadow = "0 6px 20px rgba(220,38,38,0.4)";
        break;
      case VoiceStateEnum.TRANSLATING:
        sessionBtn.innerHTML = "Translating…";
        sessionBtn.style.background = "#2563eb";
        sessionBtn.style.boxShadow = "0 6px 20px rgba(37,99,235,0.4)";
        break;
      case VoiceStateEnum.SPEAKING:
        sessionBtn.innerHTML = "Speaking… Tap to Interrupt";
        sessionBtn.style.background = "#059669";
        sessionBtn.style.boxShadow = "0 6px 20px rgba(5,150,105,0.4)";
        break;
      case VoiceStateEnum.UNSUPPORTED_LANGUAGE:
        sessionBtn.innerHTML = "Use Controlled Demo";
        sessionBtn.style.background = "#d97706";
        sessionBtn.style.boxShadow = "0 6px 20px rgba(217,119,6,0.4)";
        break;
      case VoiceStateEnum.MICROPHONE_ERROR:
      case VoiceStateEnum.NO_SPEECH:
      case VoiceStateEnum.READY:
      case VoiceStateEnum.ERROR:
      default:
        if (voiceState.sessionActive) {
          sessionBtn.innerHTML = "Listening… Tap to Stop";
          sessionBtn.style.background = "#dc2626";
          sessionBtn.style.boxShadow = "0 6px 20px rgba(220,38,38,0.4)";
        } else {
          sessionBtn.innerHTML = "Start Voice Session";
          sessionBtn.style.background = "#ea580c";
          sessionBtn.style.boxShadow = "0 6px 24px rgba(234,88,12,0.4)";
        }
        break;
    }
  }

  if (!statusEl) return;

  if (orbIcon && typeof orbIcon.setAttribute === "function") {
    orbIcon.setAttribute("data-state", newState);
  }

  const isRevDir = state.translationDirection === "unr-hi" || state.inputMode === "mundari";

  switch (newState) {
    case VoiceStateEnum.READY:
      statusEl.textContent = "Ready";
      if (subStatusEl) {
        subStatusEl.textContent = isRevDir
          ? 'Click "Start Voice Session" or tap the orb to begin speaking in Mundari'
          : ((state.inputMode === 'hinglish') ? 'Click "Start Voice Session" or tap the orb to begin speaking' : 'Click "Start Voice Session" or tap the orb to begin speaking in Hindi');
      }
      break;

    case VoiceStateEnum.LISTENING:
      statusEl.textContent = "Listening";
      if (subStatusEl) {
        subStatusEl.textContent = isRevDir
          ? "Listening... Speak your sentence or number naturally in Mundari."
          : ((state.inputMode === 'hinglish') ? "Listening... Speak naturally in Hinglish or Hindi." : "Listening... Speak your sentence naturally in Hindi.");
      }
      break;

    case VoiceStateEnum.PROCESSING:
      statusEl.textContent = "Processing";
      if (subStatusEl) subStatusEl.textContent = isRevDir ? "Processing Mundari voice input..." : "Processing speech input...";
      break;

    case VoiceStateEnum.RECOGNIZED:
      statusEl.textContent = "Recognized";
      if (subStatusEl) subStatusEl.textContent = detailMsg || (isRevDir ? "Mundari speech recognized." : "Speech recognized.");
      break;

    case VoiceStateEnum.TRANSLATING:
      statusEl.textContent = "Translating";
      if (subStatusEl) subStatusEl.textContent = isRevDir ? "Translating into Hindi..." : "Translating into Mundari...";
      break;

    case VoiceStateEnum.SPEAKING:
      statusEl.textContent = "Speaking";
      if (subStatusEl) subStatusEl.textContent = isRevDir ? "Playing Hindi response pronunciation. Tap orb to interrupt." : "Playing pronunciation. Tap orb or speak to interrupt.";
      break;

    case VoiceStateEnum.UNSUPPORTED_LANGUAGE:
      statusEl.textContent = "Unsupported Language";
      if (subStatusEl) subStatusEl.textContent = detailMsg || "Mundari voice recognition isn't available in this browser. Use controlled demo voice input";
      break;

    case VoiceStateEnum.MICROPHONE_ERROR:
      statusEl.textContent = "Microphone Error";
      if (subStatusEl) subStatusEl.textContent = detailMsg || "Microphone access denied or hardware error. Check permissions.";
      break;

    case VoiceStateEnum.NO_SPEECH:
      statusEl.textContent = "No Speech Detected";
      if (subStatusEl) subStatusEl.textContent = detailMsg || "No speech was detected. Please try speaking again.";
      break;

    case VoiceStateEnum.INTERRUPTED:
      statusEl.textContent = "Interrupted";
      if (subStatusEl) subStatusEl.textContent = "Interrupted — listening again.";
      break;

    case VoiceStateEnum.ERROR:
      statusEl.textContent = "Error";
      if (subStatusEl) subStatusEl.textContent = detailMsg || "Check microphone permissions or use quick classroom phrases.";
      break;
  }

  // Update 5-stage speech flow pipeline in Student Voice Mode
  try {
    const flowSteps = document.querySelectorAll(".voice-flow-step");
    if (flowSteps && flowSteps.length === 5) {
      flowSteps.forEach((s, idx) => {
        s.classList.remove("active");
        if (newState === VoiceStateEnum.LISTENING && idx === 0) s.classList.add("active");
        else if (newState === VoiceStateEnum.PROCESSING && idx === 1) s.classList.add("active");
        else if (newState === VoiceStateEnum.TRANSLATING && idx === 2) s.classList.add("active");
        else if (newState === VoiceStateEnum.SPEAKING && idx === 3) s.classList.add("active");
        else if (newState === VoiceStateEnum.READY && idx === 4) s.classList.add("active");
      });
    }
  } catch (e) {}
}
