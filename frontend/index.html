<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#24543D">
<title>APP_NAME_PENDING — Learn in Your Language. Teach with Confidence.</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
:root {
  --green: #0A2418;
  --green-dark: #06170F;
  --green-mid: #16563A;
  --green-light: #248259;
  --sage: #4F8A5B;
  --soft: #EBF5F0;
  --soft-bg: #F5F8F6;
  --cream: #F7F3EA;
  --white: #FFFFFF;
  --amber: #F59E0B;
  --orange: #EA580C;
  --yellow: #E7C75B;
  --terr: #A86145;
  --ink: #1C2B22;
  --muted: #627368;
  --line: #DFE8E2;
  --danger: #DC2626;
  --shadow: 0 8px 28px rgba(38,51,44,.08);
  --shadow-lg: 0 16px 40px rgba(38,51,44,.12);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Plus Jakarta Sans', Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  color: var(--ink);
  background: var(--soft-bg);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, .title, .number, .stat {
  font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif;
}
button, input, textarea, select { font: inherit; }
button { cursor: pointer; border: 0; }
.hidden { display: none !important; }
.app { min-height: 100vh; }
.topbar {
  height: 68px;
  background: var(--green);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: 0 2px 14px rgba(0,0,0,0.16);
}
.brand { display: flex; gap: 12px; align-items: center; text-decoration: none; color: inherit; }
.logo {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  background: var(--yellow);
  color: var(--green);
  display: grid;
  place-items: center;
  font-weight: 900;
  font-size: 22px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  flex-shrink: 0;
}
.brand b { font-size: 18px; font-weight: 800; letter-spacing: -0.01em; }
.brand small { display: block; opacity: .82; font-size: 11px; font-weight: 500; }
.userchip { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: rgba(255,255,255,0.18);
  display: grid;
  place-items: center;
  font-weight: 700;
}
.room-indicator {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 5px 12px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.16);
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 0.04em;
  border: 1px solid rgba(255, 255, 255, 0.22);
}
.pulse-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #4ade80;
  box-shadow: 0 0 8px #4ade80;
  animation: pulse-dot 1.5s infinite;
}
@keyframes pulse-dot {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.3); opacity: 0.7; }
}
.layout { display: flex; min-height: calc(100vh - 68px); }
.sidebar {
  width: 250px;
  background: #fff;
  border-right: 1px solid var(--line);
  padding: 18px 12px;
  flex: none;
  display: flex;
  flex-direction: column;
}
.navtitle {
  font-size: 11px;
  text-transform: uppercase;
  color: var(--muted);
  padding: 10px 12px 6px;
  letter-spacing: .08em;
  font-weight: 700;
}
.nav {
  width: 100%;
  text-align: left;
  background: transparent;
  color: var(--ink);
  padding: 10px 12px;
  border-radius: 10px;
  margin: 2px 0;
  display: flex;
  gap: 12px;
  align-items: center;
  font-weight: 600;
  font-size: 13.5px;
  transition: all 0.15s ease;
}
.nav:hover { background: var(--soft); color: var(--green-light); transform: translateX(2px); }
.nav.active { background: var(--soft); color: var(--green-light); font-weight: 700; box-shadow: inset 3px 0 0 var(--green-light); }
.nav .ico { width: 22px; text-align: center; font-size: 16px; }
main { flex: 1; padding: 24px; min-width: 0; }
.page { max-width: 1250px; margin: auto; }
.eyebrow { color: var(--terr); font-weight: 800; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.title { font-size: 30px; line-height: 1.15; margin: 5px 0 8px; font-weight: 800; color: var(--green); }
.sub { color: var(--muted); margin: 0 0 22px; font-size: 14.5px; line-height: 1.5; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 20px;
  box-shadow: var(--shadow);
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
.card:hover { box-shadow: var(--shadow-lg); }
.card h3 { margin: 0 0 7px; font-weight: 700; }
.card p { color: var(--muted); margin: 6px 0; }
.stat { font-size: 32px; font-weight: 900; color: var(--green-light); line-height: 1.1; }
.btn {
  padding: 11px 16px;
  border-radius: 10px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  font-size: 13.5px;
  transition: all 0.15s ease;
  cursor: pointer;
  border: 0;
}
.btn:hover { transform: translateY(-1px); }
.primary { background: var(--green-light); color: #fff; box-shadow: 0 3px 10px rgba(36, 130, 89, 0.2); }
.primary:hover { background: var(--green-mid); }
.secondary { background: var(--soft); color: var(--green-mid); }
.secondary:hover { background: #ddeadf; }
.outline { background: #fff; color: var(--green-mid); border: 1px solid #b9c9be; }
.outline:hover { background: var(--soft); }
.warn { background: #fff5d6; color: #735d11; border: 1px solid #fae69e; }
.danger { background: #fff0ee; color: var(--danger); border: 1px solid #fbd2ce; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.between { justify-content: space-between; }
.mt { margin-top: 16px; }
.mb { margin-bottom: 16px; }
input, textarea, select {
  width: 100%;
  padding: 12px;
  border: 1px solid #cfd9d1;
  border-radius: 10px;
  background: #fff;
  color: var(--ink);
  outline: none;
  font-size: 14.5px;
  transition: border-color 0.15s, box-shadow 0.15s;
}
input:focus, textarea:focus, select:focus {
  border-color: var(--green-light);
  box-shadow: 0 0 0 3px rgba(36, 130, 89, 0.15);
}
label { font-size: 12px; font-weight: 800; display: block; margin: 0 0 6px; color: var(--ink); }
.field { margin-bottom: 13px; }
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.03em;
}
.live { background: #e4f4e8; color: #28653b; border: 1px solid #c2e2ca; }
.ai { background: #eee9fb; color: #624a93; border: 1px solid #dcd1f7; }
.placeholder { background: #fff7db; color: #715d17; border: 1px solid #fae69e; }
.offline { background: #eef0f1; color: #59645e; border: 1px solid #d5dbd7; }
.verified { background: #dff0e2; color: #1e5e2e; border: 1px solid #b7dcbe; }
.prototype { background: #f0f0f0; color: #555; border: 1px solid #ddd; }
.badge-verified { background: #dff0e2; color: #1e5e2e; border: 1px solid #b7dcbe; }
.badge-neural { background: #eee9fb; color: #5b21b6; border: 1px solid #c4b5fd; }
.badge-corpus { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
.badge-fallback { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }
.hero {
  background: linear-gradient(135deg, #0A2418 0%, #16563A 55%, #248259 100%);
  color: #fff;
  border-radius: 20px;
  padding: 28px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 8px 30px rgba(10,36,24,0.18);
}
.hero:after {
  content: "";
  position: absolute;
  width: 220px;
  height: 220px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(231,199,91,0.22) 0%, rgba(231,199,91,0) 70%);
  right: -50px;
  top: -60px;
  pointer-events: none;
}
.hero h2 { font-size: 28px; margin: 0 0 8px; font-weight: 800; letter-spacing: -0.01em; }
.hero p { max-width: 680px; color: #edf5ef; font-size: 14.5px; line-height: 1.55; }
.hero .btn { background: var(--yellow); color: var(--green); font-weight: 800; box-shadow: 0 3px 12px rgba(0,0,0,0.15); }
.pipeline { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 18px; }
.step {
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 12px;
  padding: 10px;
  text-align: center;
  font-size: 11px;
}
.step b { display: block; font-size: 16px; margin-bottom: 4px; }
.pipeline-step {
  background: #ffffff;
  border: 2px solid #e2e8f0;
  border-radius: 12px;
  padding: 10px 6px;
  text-align: center;
  font-size: 11px;
  transition: all .2s ease;
}
.pipeline-step b { display: block; font-size: 14px; margin-bottom: 3px; }
.pipeline-step.active-edu { border-color: #22c55e; background: #f0fdf4; box-shadow: 0 0 0 3px rgba(34,197,94,0.15); }
.pipeline-step.active-ai { border-color: #8b5cf6; background: #f5f3ff; box-shadow: 0 0 0 3px rgba(139,92,246,0.15); }
.pipeline-step.active-corpus { border-color: #f59e0b; background: #fffbeb; box-shadow: 0 0 0 3px rgba(245,158,11,0.15); }
.pipeline-step.active-safe { border-color: #94a3b8; background: #f8fafc; box-shadow: 0 0 0 3px rgba(148,163,184,0.15); }
.notice {
  padding: 12px 16px;
  border-radius: 12px;
  background: #fff8df;
  border: 1px solid #eadb9e;
  font-size: 12.5px;
  color: #66591e;
  line-height: 1.5;
}
.success { background: #edf7ef; border: 1px solid #bdd9c2; color: #2d6339; }
.dangerbox { background: #fff0ee; border: 1px solid #e3b8b3; color: #8a332e; }
.voicebox {
  border: 2px solid #d8e4da;
  background: #fbfdfb;
  border-radius: 18px;
  padding: 20px;
}
.voice-hero-panel {
  background: linear-gradient(145deg, #0A2418 0%, #16563A 100%);
  color: #fff;
  border-radius: 20px;
  padding: 26px;
  box-shadow: 0 10px 32px rgba(10,36,24,0.22);
  border: 1px solid rgba(255,255,255,0.12);
}
.mic, .voice-orb {
  width: 78px;
  height: 78px;
  border-radius: 50%;
  background: var(--terr);
  color: #fff;
  font-size: 30px;
  box-shadow: 0 0 0 9px rgba(168,97,69,0.18);
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: all 0.2s ease;
  border: none;
}
.mic:hover, .voice-orb:hover { transform: scale(1.05); box-shadow: 0 0 0 12px rgba(168,97,69,0.25); }
.mic.listening, .voice-orb.listening {
  animation: pulse-mic 1.2s infinite;
  background: #b53d37;
}
@keyframes pulse-mic {
  0% { box-shadow: 0 0 0 6px rgba(181,61,55,0.3); }
  50% { box-shadow: 0 0 0 22px rgba(181,61,55,0.06); }
  100% { box-shadow: 0 0 0 6px rgba(181,61,55,0.3); }
}
.transcript {
  min-height: 85px;
  background: #fff;
  border: 1px dashed #cbd8ce;
  border-radius: 12px;
  padding: 13px;
  line-height: 1.55;
  font-size: 15px;
}
.output {
  min-height: 85px;
  background: #f1f7f2;
  border: 1px solid #c7dbc9;
  border-radius: 12px;
  padding: 13px;
  line-height: 1.55;
  font-size: 18px;
  font-weight: 600;
  color: var(--green);
}
.audio {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 11px;
}
.bar { height: 7px; background: #dfe8e1; border-radius: 999px; flex: 1; overflow: hidden; }
.bar span { display: block; width: 35%; height: 100%; background: var(--sage); transition: .2s; }
.room {
  font-size: 27px;
  letter-spacing: .14em;
  font-weight: 900;
  color: var(--green);
  background: var(--soft);
  border: 1px dashed #abc0af;
  border-radius: 12px;
  padding: 13px;
  text-align: center;
}
.student { display: flex; align-items: center; gap: 10px; padding: 10px; border-bottom: 1px solid var(--line); }
.student:last-child { border: 0; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #5fa56d; }
.small { font-size: 12px; color: var(--muted); }
.feed { max-height: 360px; overflow-y: auto; }
.feeditem { padding: 12px; border-bottom: 1px solid var(--line); }
.feeditem:last-child { border: 0; }
.feeditem .time { font-size: 10px; color: var(--muted); }
.login { min-height: 100vh; display: grid; place-items: center; padding: 20px; background: var(--soft-bg); }
.loginbox {
  width: min(530px, 100%);
  background: #fff;
  border-radius: 22px;
  border: 1px solid var(--line);
  padding: 32px;
  box-shadow: var(--shadow);
}
.rolegrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.role {
  border: 2px solid var(--line);
  background: #fff;
  border-radius: 15px;
  padding: 18px;
  text-align: left;
  cursor: pointer;
  transition: all 0.15s ease;
}
.role:hover, .role.selected {
  border-color: var(--green-mid);
  background: var(--soft);
  transform: translateY(-2px);
}
.role strong { display: block; margin: 7px 0 4px; font-size: 15px; }
.role span { font-size: 12px; color: var(--muted); line-height: 1.4; display: block; }
.table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.table th, .table td { padding: 12px; border-bottom: 1px solid var(--line); text-align: left; }
.table th { color: var(--muted); font-size: 11px; text-transform: uppercase; font-weight: 700; }
.flash {
  min-height: 220px;
  display: grid;
  place-items: center;
  text-align: center;
  background: var(--soft);
  border-radius: 16px;
  padding: 25px;
  border: 1px solid #d3e2d6;
}
.number { font-size: 54px; font-weight: 900; color: var(--green); }
.ten-frame {
  display: grid;
  grid-template-columns: repeat(5, 34px);
  grid-template-rows: repeat(2, 34px);
  gap: 5px;
  background: #fff;
  padding: 7px;
  border: 2px solid var(--green-mid);
  border-radius: 9px;
  margin: 10px auto;
  width: fit-content;
  box-shadow: 0 2px 6px rgba(0,0,0,0.06);
}
.ten-dot { width: 28px; height: 28px; border-radius: 50%; background: var(--terr); margin: auto; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); }
.ten-empty { width: 28px; height: 28px; border-radius: 50%; background: #e5eee7; margin: auto; }
.mobile-menu { display: none; }
.footer-note { font-size: 11px; color: var(--muted); margin-top: 20px; }
.preset-btn {
  text-align: left;
  padding: 9px 12px;
  border-radius: 10px;
  font-weight: 700;
  font-size: 12px;
  transition: all .15s ease;
  border: 1px solid #cbd5e1;
  background: #fff;
  cursor: pointer;
  width: 100%;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.preset-btn:hover { transform: translateY(-1px); box-shadow: 0 3px 10px rgba(0,0,0,.08); }
.preset-edu { border-color: #86efac; background: #f0fdf4; color: #166534; }
.preset-ai { border-color: #c4b5fd; background: #faf5ff; color: #6b21a8; }
.preset-safe { border-color: #fca5a5; background: #fef2f2; color: #991b1b; }
@media(max-width:900px) {
  .sidebar { width: 210px; }
  .g4 { grid-template-columns: repeat(2, 1fr); }
  .pipeline { grid-template-columns: repeat(3, 1fr); }
}
@media(max-width:700px) {
  .topbar { padding: 0 12px; height: 60px; }
  .mobile-menu {
    display: block;
    background: rgba(255,255,255,0.15);
    color: #fff;
    border-radius: 9px;
    padding: 6px 9px;
    font-size: 16px;
    border: none;
    cursor: pointer;
    flex-shrink: 0;
  }
  .brand { gap: 8px; }
  .logo { width: 32px; height: 32px; font-size: 16px; border-radius: 8px; }
  .brand b { font-size: 13.5px; }
  .brand small { display: none; }
  .room-indicator { display: none; }
  .demo-badge-btn { display: none; }
  .userchip { gap: 6px; }
  .userchip span { display: none; }
  .avatar { width: 28px; height: 28px; font-size: 12px; }
  .exit-btn { padding: 5px 8px !important; font-size: 11px !important; }
  .layout { display: block; }
  .sidebar {
    position: fixed;
    left: -270px;
    top: 60px;
    bottom: 0;
    z-index: 40;
    width: 260px;
    transition: left .25s ease;
    box-shadow: 8px 0 25px rgba(0,0,0,0.15);
  }
  .sidebar.open { left: 0; }
  main { padding: 14px; }
  .g2, .g3, .g4 { grid-template-columns: 1fr; }
  .pipeline { grid-template-columns: 1fr 1fr; }
  .title { font-size: 22px; }
}

/* --- Clean Educational Layer Extensions (Matching Native Design System) --- */
.category-pill-bar {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 6px;
  margin-bottom: 14px;
  scrollbar-width: thin;
}
.category-pill {
  padding: 6px 14px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: #fff;
  color: var(--ink);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s ease;
}
.category-pill:hover {
  background: var(--soft);
  color: var(--green-mid);
  border-color: var(--sage);
}
.category-pill.active {
  background: var(--green);
  color: #fff;
  border-color: var(--green);
}
.practice-thumb {
  max-height: 100px;
  max-width: 100%;
  object-fit: contain;
  border-radius: 8px;
  background: #f8faf9;
  margin-bottom: 6px;
}
.broadcast-spotlight-card {
  background: linear-gradient(135deg, #f0fdf4 0%, #ffffff 100%);
  border: 2px solid #86efac;
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 18px;
  box-shadow: 0 4px 16px rgba(34,197,94,0.12);
}
@media print {
  body { background: #fff !important; }
  .topbar, .sidebar, .btn, .notice, .no-print, .hero, .category-pill-bar, #wsControlsArea { display: none !important; }
  main { padding: 0 !important; margin: 0 !important; width: 100% !important; }
  .page { max-width: 100% !important; margin: 0 !important; }
  #wsPrintableSheet { border: 1.5px solid #000 !important; box-shadow: none !important; padding: 12px !important; max-width: 100% !important; border-radius: 0 !important; }
}



/* --- Clean Teacher Command Center & Sidebar Extensions --- */
.btn-cta {
  background: #ea580c !important;
  color: #fff !important;
  font-weight: 800 !important;
  padding: 10px 22px !important;
  border-radius: 999px !important;
  box-shadow: 0 4px 16px rgba(234,88,12,0.32) !important;
  border: none !important;
  cursor: pointer !important;
  transition: all 0.15s ease !important;
  display: inline-flex !important;
  align-items: center !important;
  gap: 7px !important;
}
.btn-cta:hover {
  background: #c2410c !important;
  transform: translateY(-1px) !important;
  box-shadow: 0 6px 20px rgba(234,88,12,0.42) !important;
}

.hero-compact {
  background: linear-gradient(135deg, #073B2A 0%, #0B4A35 55%, #145A40 100%);
  color: #fff;
  border-radius: 18px;
  padding: 24px 28px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 8px 24px rgba(7,59,42,0.16);
  border: 1px solid rgba(255,255,255,0.12);
}
.hero-compact::after {
  content: "";
  position: absolute;
  width: 200px;
  height: 200px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(231,199,91,0.16) 0%, rgba(231,199,91,0) 70%);
  right: -40px;
  top: -50px;
  pointer-events: none;
}

.hero-secondary-btn {
  background: rgba(255,255,255,0.12) !important;
  color: #fff !important;
  font-weight: 600 !important;
  font-size: 13.5px !important;
  padding: 10px 18px !important;
  border-radius: 999px !important;
  border: 1px solid rgba(255,255,255,0.24) !important;
  cursor: pointer !important;
  transition: all 0.15s ease !important;
  display: inline-flex !important;

/* --- Continuous Voice Orb Experience Styles --- */
.voice-hero-panel {
  background: linear-gradient(145deg, #05140d 0%, #0A2418 45%, #144e34 100%);
  color: #fff;
  border-radius: 26px;
  padding: 38px 32px 30px;
  box-shadow: 0 20px 56px rgba(10,36,24,0.38);
  border: 1px solid rgba(255,255,255,0.14);
  position: relative;
  overflow: hidden;
}
.voice-hero-panel::before {
  content: "";
  position: absolute;
  top: -120px;
  right: -120px;
  width: 320px;
  height: 320px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(231,199,91,0.09) 0%, rgba(231,199,91,0) 70%);
  pointer-events: none;
}
.voice-hero-panel::after {
  content: "";
  position: absolute;
  bottom: -100px;
  left: -100px;
  width: 280px;
  height: 280px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(34,197,94,0.08) 0%, rgba(34,197,94,0) 70%);
  pointer-events: none;
}

.mic, .voice-orb {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  background: var(--terr);
  color: #fff;
  font-size: 52px;
  box-shadow: 0 0 0 14px rgba(168,97,69,0.2), 0 12px 36px rgba(0,0,0,0.3);
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  border: none;
  outline: none;
  position: relative;
  user-select: none;
  margin: 8px auto 14px;
}
.mic:hover, .voice-orb:hover {
  transform: scale(1.05);
}

/* READY: slow subtle breathing pulse */
.voice-orb.ready, .mic.ready {
  background: radial-gradient(circle at 35% 35%, #c26c4f 0%, #8c4128 70%, #5a2615 100%);
  box-shadow: 0 0 0 12px rgba(168,97,69,0.22), 0 0 40px rgba(168,97,69,0.3);
  animation: orb-pulse-ready 3.2s ease-in-out infinite;
}
@keyframes orb-pulse-ready {
  0% { box-shadow: 0 0 0 10px rgba(168,97,69,0.22), 0 0 35px rgba(168,97,69,0.25); transform: scale(1); }
  50% { box-shadow: 0 0 0 22px rgba(168,97,69,0.08), 0 0 50px rgba(168,97,69,0.4); transform: scale(1.03); }
  100% { box-shadow: 0 0 0 10px rgba(168,97,69,0.22), 0 0 35px rgba(168,97,69,0.25); transform: scale(1); }
}

/* LISTENING: active emerald ripple/pulse */
.voice-orb.listening, .mic.listening {
  background: radial-gradient(circle at 35% 35%, #22c55e 0%, #15803d 70%, #052e16 100%) !important;
  animation: orb-pulse-listening 1.4s ease-in-out infinite !important;
}
@keyframes orb-pulse-listening {
  0% { box-shadow: 0 0 0 10px rgba(34,197,94,0.48), 0 0 40px rgba(34,197,94,0.45); transform: scale(1); }
  50% { box-shadow: 0 0 0 32px rgba(34,197,94,0.12), 0 0 70px rgba(34,197,94,0.65); transform: scale(1.07); }
  100% { box-shadow: 0 0 0 10px rgba(34,197,94,0.48), 0 0 40px rgba(34,197,94,0.45); transform: scale(1); }
}

/* PROCESSING: warm amber rotation/pulse */
.voice-orb.processing {
  background: radial-gradient(circle at 35% 35%, #f59e0b 0%, #b45309 70%, #451a03 100%) !important;
  animation: orb-pulse-processing 1s ease-in-out infinite !important;
}
@keyframes orb-pulse-processing {
  0% { box-shadow: 0 0 0 10px rgba(245,158,11,0.5), 0 0 40px rgba(245,158,11,0.4); transform: scale(1.02); }
  50% { box-shadow: 0 0 0 24px rgba(245,158,11,0.15), 0 0 60px rgba(245,158,11,0.55); transform: scale(0.98); }
  100% { box-shadow: 0 0 0 10px rgba(245,158,11,0.5), 0 0 40px rgba(245,158,11,0.4); transform: scale(1.02); }
}

/* TRANSLATING: blue/indigo wave pulse */
.voice-orb.translating {
  background: radial-gradient(circle at 35% 35%, #3b82f6 0%, #1d4ed8 70%, #172554 100%) !important;
  animation: orb-pulse-translating 0.9s ease-in-out infinite !important;
}
@keyframes orb-pulse-translating {
  0% { box-shadow: 0 0 0 10px rgba(59,130,246,0.5), 0 0 40px rgba(59,130,246,0.4); transform: scale(1); }
  50% { box-shadow: 0 0 0 26px rgba(59,130,246,0.14), 0 0 65px rgba(59,130,246,0.6); transform: scale(1.06); }
  100% { box-shadow: 0 0 0 10px rgba(59,130,246,0.5), 0 0 40px rgba(59,130,246,0.4); transform: scale(1); }
}

/* SPEAKING: vibrant teal soundwave pulse */
.voice-orb.speaking {
  background: radial-gradient(circle at 35% 35%, #10b981 0%, #047857 70%, #022c22 100%) !important;
  animation: orb-pulse-speaking 0.85s ease-in-out infinite !important;
}
@keyframes orb-pulse-speaking {
  0% { box-shadow: 0 0 0 8px rgba(16,185,129,0.5), 0 0 35px rgba(16,185,129,0.45); transform: scale(1); }
  50% { box-shadow: 0 0 0 30px rgba(16,185,129,0.15), 0 0 70px rgba(16,185,129,0.65); transform: scale(1.08); }
  100% { box-shadow: 0 0 0 8px rgba(16,185,129,0.5), 0 0 35px rgba(16,185,129,0.45); transform: scale(1); }
}

/* INTERRUPTED: energetic flash/shake */
.voice-orb.interrupted {
  background: radial-gradient(circle at 35% 35%, #f97316 0%, #c2410c 70%, #431407 100%) !important;
  animation: orb-pulse-interrupted 0.35s ease-in-out 2 !important;
  box-shadow: 0 0 0 22px rgba(249,115,22,0.45), 0 0 55px rgba(249,115,22,0.6) !important;
}
@keyframes orb-pulse-interrupted {
  0% { transform: scale(1) rotate(0deg); }
  25% { transform: scale(1.08) rotate(-4deg); }
  75% { transform: scale(1.08) rotate(4deg); }
  100% { transform: scale(1) rotate(0deg); }
}

/* ERROR: muted red glow */
.voice-orb.error {
  background: radial-gradient(circle at 35% 35%, #ef4444 0%, #b91c1c 70%, #450a0a 100%) !important;
  box-shadow: 0 0 0 14px rgba(239,68,68,0.35), 0 0 45px rgba(239,68,68,0.45) !important;
}

@media (max-width: 768px) {
  .mic, .voice-orb {
    width: 110px;
    height: 110px;
    font-size: 42px;
  }
  .voice-hero-panel {
    padding: 24px 18px;
  }
}

  if (r.startsWith("ROOM ")) r = r.slice(5).trim();
  return /^(MUN|DEMO)-\d{4}$/.test(r);
}

function cleanRoomCode(room) {
  if (!room || typeof room !== "string") return "";
  let r = room.trim().toUpperCase();
  if (r.startsWith("ROOM ")) r = r.slice(5).trim();
  return /^(MUN|DEMO)-\d{4}$/.test(r) ? r : "";
}

  if (!stored) return "";
  const clean = cleanRoomCode(stored);

    return "";
  }
  return clean;
}

function initBus() {

  const name = "vfln-classroom-" + state.room;
  if ("BroadcastChannel" in window) {

    state.channel.onmessage = e => receive(e.data);

  window.addEventListener("storage", e => {

      try {
        let d = JSON.parse(e.newValue);
        if (d.room === state.room) receive(d);
      } catch (err) {}
    }
  });

function sendBus(data) {

}

function receive(d) {
  if (d.type === "join" && state.role === "teacher") {
    if (!state.students.includes(d.name)) {
      state.students.push(d.name);
      render();
    }
    toast(d.name + " joined the classroom");
  }
  if (d.type === "student_reply" && state.role === "teacher") {
    toast(d.name + ": " + d.text);
    addTeacherFeed({ hindi: "[Student Reply] " + d.name, mundari: d.text, time: d.time || now() });
  }
  if (d.type === "translation" && state.role === "student" && (state.joined || state.page === "demo")) {
    state.lastTranslation = d;
    render();
    playDemoPulse();
    toast("Broadcast received: " + d.mundari);
  }
  if (d.type === "broadcast_vocab" && state.role === "student") {
    state.lastVocabBroadcast = d.card;
    render();
    toast("🎴 Flashcard from teacher: " + (d.card.english || d.card.hindi));
  }
  if (d.type === "broadcast_practice" && state.role === "student") {
    state.lastPracticeBroadcast = d.question;
    render();
    toast("✍️ Practice question pushed by teacher!");
  }

    state.joined = false;
    render();
    toast("Teacher ended the live class");
  }
}

// TEXT NORMALIZER HELPER WITH PARITY TO PYTHON INDIC NORMALIZER
function normalizeHindi(text) {
  if (!text) return "";
  let s = String(text).normalize("NFC");
  // Strip zero-width characters (ZWJ, ZWNJ, BOM)
  s = s.replace(/[\u200b\u200c\u200d\ufeff]/g, "");
  const trimmed = s.trim();
  if (trimmed === "छ:" || trimmed === "छः" || trimmed === "छ") return "छह";
  // Indic punctuation and danda to space
  s = s.replace(/[\u0964\u0965।,!?;:\'\"\-—–()\[\]{}.\/\\*#@~`^+=<>|_]/g, " ");
  // Collapse whitespace
  return s.replace(/\s+/g, " ").trim();
}

function normalizeForLookup(text) {
  let s = normalizeHindi(text);
  if (!s) return "";
  const asciiMap = {"1":"एक","2":"दो","3":"तीन","4":"चार","5":"पाँच","6":"छह","7":"सात","8":"आठ","9":"नौ","10":"दस","11":"ग्यारह","12":"बारह","13":"तेरह","14":"चौदह","15":"पंद्रह","16":"सोलह","17":"सत्रह","18":"अठारह","19":"उन्नीस","20":"बीस"};
  const devMap = {"१":"एक","२":"दो","३":"तीन","४":"चार","५":"पाँच","६":"छह","७":"सात","८":"आठ","९":"नौ","१०":"दस","११":"ग्यारह","१२":"बारह","१३":"तेरह","१४":"चौदह","१५":"पंद्रह","१६":"सोलह","१७":"सत्रह","१८":"अठारह","१९":"उन्नीस","२०":"बीस"};
  if (asciiMap[s]) s = asciiMap[s];
  else if (devMap[s]) s = devMap[s];

  const aliases = {
    "पांच": "पाँच",
    "छः": "छह",
    "छ:": "छह",
    "छ": "छह",
    "पन्द्रह": "पंद्रह",
    "अट्ठारह": "अठारह",
    "उन्इस": "उन्नीस",
    "उनिस": "उन्नीस"
  };
  if (aliases[s]) s = aliases[s];
  s = s.replace(/\u0901/g, "\u0902");
  if (aliases[s]) s = aliases[s].replace(/\u0901/g, "\u0902");
  return s;
}

// CANONICAL BACKEND TRANSLATION & LOOKUP ADAPTER
function backendTranslate(text, dir) {
  const direction = dir || (window.state && window.state.translationDirection) || "hi-unr";

  if (!text || !text.trim()) {
    return {
      source: "",
      mundari: "",
      phonetic: "",
      root: "",
      numeral: null,
      audio_file: null,
      status: "EMPTY_INPUT",
      badge: "● AWAITING INPUT",
      badgeClass: "placeholder",
      provenance: direction === "unr-hi" ? "Type or enter Mundari text to translate to Hindi" : "Type or speak Hindi text to translate",
      isBroadcastable: false,
      direction: direction
    };
  }

  const clean = text.trim();
  const normalized = normalizeHindi(clean);
  const lookupClean = normalizeForLookup(clean);

  // -------------------------------------------------------------
  // REVERSE TRANSLATION: MUNDARI ➔ HINDI
  // -------------------------------------------------------------
  if (direction === "unr-hi") {
    // 1. Exact lookup in canonical numbers 1-20
    for (let item of DB.numbers) {
      const normMun = normalizeHindi(item.mundari_text);
      const lookupMun = normalizeForLookup(item.mundari_text);
      const normRoot = item.mundari_root ? normalizeHindi(item.mundari_root) : "";
      const isMunExact = clean === item.mundari_text || normalized === normMun || lookupClean === lookupMun;
      const isRootExact = normRoot && (normalized === normRoot || lookupClean === normalizeForLookup(item.mundari_root));
      const isNumExact = item.mundari_numeral && clean === String(item.mundari_numeral);
      const isVariant = Array.isArray(item.variants_attested) && item.variants_attested.some(v => clean === v || normalized === normalizeHindi(v) || lookupClean === normalizeForLookup(v));
      const isOrthVar = (normalized.endsWith("िया") && normMun === normalized.slice(0, -3) + "िआ") ||
                        (normalized.endsWith("िआ") && normMun === normalized.slice(0, -3) + "िया");

      if (isMunExact || isRootExact || isNumExact || isVariant || isOrthVar) {
        return {
          source: clean,
          mundari: item.hindi_text,
          hindi: item.hindi_text,
          targetText: item.hindi_text,
          phonetic: item.mundari_phonetic,
          root: item.mundari_root,
          numeral: item.number,
          audio_file: item.audio_file || null,
          status: "VERIFIED_EDUCATIONAL_LOOKUP",
          badge: "● VERIFIED_EDUCATIONAL_LOOKUP (MUNDARI ➔ HINDI)",
          badgeClass: "verified",
          provenance: "Canonical FLN Registry (Mundari Numeral Attested: " + item.mundari_text + " ➔ " + item.hindi_text + ")",
          isBroadcastable: true,
          direction: direction
        };
      }
    }

    // 2. Exact match against classroom phrasebook (including expanded items)
    const allPhrases = DB.phrasebook.concat(DB.expandedPhrasebook || []);
    for (let p of allPhrases) {
      const normMun = normalizeHindi(p.mundari_text);
      const lookupMun = normalizeForLookup(p.mundari_text);
      const normRoot = p.mundari_root ? normalizeHindi(p.mundari_root) : "";
      const isMunExact = clean === p.mundari_text || normalized === normMun || lookupClean === lookupMun;
      const isRootExact = normRoot && (normalized === normRoot || lookupClean === normalizeForLookup(p.mundari_root));

      if (isMunExact || isRootExact) {
        return {
          source: clean,
          mundari: p.hindi_text,
          hindi: p.hindi_text,
          targetText: p.hindi_text,
          phonetic: p.mundari_phonetic,
          root: p.mundari_root || "",
          numeral: null,
          audio_file: p.audio_file || null,
          status: "VERIFIED_EDUCATIONAL_LOOKUP",
          badge: "● VERIFIED_EDUCATIONAL_LOOKUP (MUNDARI ➔ HINDI)",
          badgeClass: "verified",
          provenance: "Classroom Phrasebook (Mundari Instruction: " + p.mundari_text + " ➔ " + p.hindi_text + ")",
          isBroadcastable: true,
          direction: direction
        };
      }
    }

    // 3. Known carrier prompt in reverse
    if (normalized.includes("होपोनको") || normalized.includes("इतुना") || normalized.includes("बाबतातेबो")) {
      return {
        source: clean,
        mundari: "बच्चों, आज हम एक सेब के बारे में सीखेंगे।",
        hindi: "बच्चों, आज हम एक सेब के बारे में सीखेंगे।",
        targetText: "बच्चों, आज हम एक सेब के बारे में सीखेंगे।",
        phonetic: "",
        root: "",
        numeral: 1,
        audio_file: null,
        status: "COMPOSED_FROM_ATTESTED_FRAGMENTS",
        badge: "⚠ COMPOSED_FROM_ATTESTED_FRAGMENTS (UNVERIFIED_SENTENCE)",
        badgeClass: "warn",
        provenance: "Reverse carrier frame derived from classroom prompt. Full sentence is UNVERIFIED and NOT attested in parallel corpus.",
        isBroadcastable: false,
        direction: direction,
        fallbackHint: "Full sentence is unverified and cannot be broadcast."
      };
    }

    // 4. Fallback for Mundari input
    return {
      source: clean,
      mundari: "[Mundari term unattested in canonical registry — This phrase is not available in the verified classroom vocabulary.]",
      hindi: null,
      targetText: "[Mundari term unattested in canonical registry — This phrase is not available in the verified classroom vocabulary.]",
      phonetic: "",
      root: "",
      numeral: null,
      audio_file: null,
      status: "OUT_OF_VOCABULARY",
      badge: "⚠ OUT_OF_VOCABULARY (UNVERIFIED)",
      badgeClass: "danger",
      provenance: "This phrase is not available in the verified classroom vocabulary. Mundari expression not attested in canonical classroom registry or phrasebook. Broadcast suppressed to prevent unverified terminology.",
      isBroadcastable: false,
      direction: direction,
      fallbackHint: "This phrase is not available in the verified classroom vocabulary. Select an attested Mundari numeral (मिअद, बारिया, अपिया, उपुनिया, मोड़ेया) or classroom phrase (जोहार, दुबपे, लेकापे, ओलपे) from Learning Modules or quick buttons."
    };
  }

  // -------------------------------------------------------------
  // FORWARD TRANSLATION: HINDI ➔ MUNDARI (Default)
  // -------------------------------------------------------------
  // 1. Exact canonical lookup against numbers 1-20
  for (let item of DB.numbers) {
    const normItemHi = normalizeHindi(item.hindi_text);
    const lookupItemHi = normalizeForLookup(item.hindi_text);
    const normItemMun = normalizeHindi(item.mundari_text);
    const lookupItemMun = normalizeForLookup(item.mundari_text);

    if (
      clean === item.hindi_text ||
      normalized === normItemHi ||
      lookupClean === lookupItemHi ||
      clean === String(item.number) ||
      clean === item.hindi_numeral ||
      clean === item.mundari_text ||
      normalized === normItemMun ||
      lookupClean === lookupItemMun
    ) {
      return {
        source: clean,
        mundari: item.mundari_text,
        phonetic: item.mundari_phonetic,
        root: item.mundari_root,
        numeral: item.number,
        audio_file: item.audio_file || null,
        status: "EXACT_CANONICAL_LOOKUP",
        badge: "● EXACT_CANONICAL_LOOKUP (CORPUS_ATTESTED)",
        badgeClass: "verified",
        provenance: "Canonical FLN Registry (Grade 1 Numeracy Demonstration Module)",
        isBroadcastable: true,
        direction: direction
      };
    }
  }

  // 2. Exact match against classroom phrasebook (33 verified & composed phrases)
  const allPhrases = DB.phrasebook.concat(DB.expandedPhrasebook || []);
    for (let p of allPhrases) {
    const normPHi = normalizeHindi(p.hindi_text);
    const lookupPHi = normalizeForLookup(p.hindi_text);
    const normPMun = normalizeHindi(p.mundari_text);
    const lookupPMun = normalizeForLookup(p.mundari_text);

    const isDirect = clean === p.hindi_text || normalized === normPHi || lookupClean === lookupPHi;
    const isMundari = clean === p.mundari_text || normalized === normPMun || lookupClean === lookupPMun;
    const isVariant = Array.isArray(p.hindi_variants) && p.hindi_variants.some(v => clean === v || normalized === normalizeHindi(v) || lookupClean === normalizeForLookup(v));

    if (isDirect || isMundari || isVariant) {
      const isComposed = p.verification_level === "COMPOSED_FROM_ATTESTED_FRAGMENTS";
      const statusText = isComposed ? "COMPOSED_FROM_ATTESTED_FRAGMENTS" : "CORPUS_ATTESTED";
      const badgeText = isComposed ? "⚠ COMPOSED_FROM_ATTESTED_FRAGMENTS" : ("● CORPUS_ATTESTED (" + (p.category || "CLASSROOM") + ")");
      const badgeClass = isComposed ? "warn" : "verified";
      return {
        source: clean,
        mundari: p.mundari_text,
        phonetic: p.mundari_phonetic || "",
        root: p.mundari_root || "",
        numeral: null,
        audio_file: p.audio_file || null,
        status: statusText,
        badge: badgeText,
        badgeClass: badgeClass,
        provenance: "Classroom Phrasebook (" + (p.provenance || p.category || "Verified FLN Attestation") + ")",
        isBroadcastable: !isComposed,
        direction: direction
      };
    }
  }

  // 3. Known Primary Lesson Prompts / Concept Extraction (e.g. demo sentence)
  if (normalized === normalizeHindi(demoHindi) || (normalized.startsWith("बच्चों") && normalized.includes("सेब"))) {
    let matchedNum = DB.numbers[0];
    for (let item of DB.numbers) {
      if (normalized.includes(item.hindi_text) || normalized.includes(item.hindi_numeral)) {
        matchedNum = item;
        break;
      }
    }
    return {
      source: clean,
      mundari: "होपोनको, तेहेंज आबु " + matchedNum.mundari_text + " सेब बाबतातेबो इतुना। (" + matchedNum.mundari_text + " - " + matchedNum.mundari_phonetic + ")",
      phonetic: "Hoponko, tehenj aabu " + matchedNum.mundari_phonetic + " seb babatatebo ituna.",
      root: matchedNum.mundari_root,
      numeral: matchedNum.number,
      audio_file: matchedNum.audio_file || null,
      status: "COMPOSED_FROM_ATTESTED_FRAGMENTS",
      badge: "⚠ COMPOSED_FROM_ATTESTED_FRAGMENTS (UNVERIFIED_SENTENCE)",
      badgeClass: "warn",
      provenance: "Composed from synthetic carrier frame + attested concept slot [content_registry.json -> num_" + (matchedNum.number < 10 ? "0" + matchedNum.number : matchedNum.number) + " (" + matchedNum.hindi_text + " -> " + matchedNum.mundari_text + ")]. Full sentence is UNVERIFIED and NOT attested in parallel corpus.",
      isBroadcastable: false,
      direction: direction,
      fallbackHint: "Full sentence is unverified and cannot be broadcast."
    };
  }

  // 4. Out-of-Vocabulary / Unattested Input Fallback
  return {
    source: clean,
    mundari: "[Unattested in FLN Registry — This phrase is not available in the verified classroom vocabulary.]",
    phonetic: "",
    root: "",
    numeral: null,
    audio_file: null,
    status: "OUT_OF_VOCABULARY",
    badge: "⚠ OUT_OF_VOCABULARY (UNVERIFIED)",
    badgeClass: "danger",
    provenance: "This phrase is not available in the verified classroom vocabulary. Broadcast suppressed to protect learner language acquisition.",
    isBroadcastable: false,
    direction: direction,
    fallbackHint: "This phrase is not available in the verified classroom vocabulary. Select an attested number (1–20) or classroom phrase (e.g. नमस्ते, बैठो, चुप रहो) from Learning Modules or quick buttons."
  };
}

function updateTranslationUI(res) {
  if (!res) return;
  state.currentTranslation = res;
  if ($("#mundari")) {
    if (res.status === "OUT_OF_VOCABULARY") {
      $("#mundari").value = "This sentence could not be translated yet.";
    } else {
      $("#mundari").value = res.mundari || "";
    }
  }
  const b = $("#transbadge");
  if (b) {
    if (res.isBroadcastable) {
      b.textContent = "Translation ready";
      b.className = "badge verified";
    } else if (res.status === "OUT_OF_VOCABULARY") {
      b.textContent = "Not translated";
      b.className = "badge danger";
    } else if (res.status === "EMPTY_INPUT") {
      b.textContent = "Awaiting input";
      b.className = "badge placeholder";
    } else {
      b.textContent = "Review needed";
      b.className = "badge warn";
    }
  }
  const p = $("#provenanceBox");
  if (p) {
    p.style.display = "none";
    p.innerHTML = "<b>Linguistic Provenance:</b> " + esc(res.provenance);
  }

  const fb = $("#fallbackNoticeBox");
  if (fb) {
    if (res.status === "OUT_OF_VOCABULARY") {
      fb.style.display = "block";
      fb.className = "notice dangerbox mt";
      fb.innerHTML = "<b>Notice:</b> This sentence could not be translated yet.";
    } else if (!res.isBroadcastable && res.status !== "EMPTY_INPUT") {
      fb.style.display = "block";
      fb.className = "notice warnbox mt";
      fb.innerHTML = "<b>Notice:</b> Please review this translation before classroom use.";
    } else {
      fb.style.display = "none";
    }
  }

  const bb = $("#broadcastBtn");
  if (bb) {
    if (!res.isBroadcastable) {
      bb.disabled = true;
      bb.style.opacity = "0.5";
      bb.style.cursor = "not-allowed";
      bb.title = "Please review this translation before classroom use.";
    } else {
      bb.disabled = false;
      bb.style.opacity = "1";
      bb.style.cursor = "pointer";
      bb.title = "";
    }
  }

  const ab = $("#playTeacherAudioBtn");
  if (ab) {
    const isRev = state.translationDirection === "unr-hi";
    if (isRev) {
      ab.disabled = false;
      ab.style.opacity = "1";
      ab.style.cursor = "pointer";
      ab.innerHTML = "🔊 Play in Hindi";
      ab.title = "Plays Hindi translation";
    } else if (res.audio_file) {
      ab.disabled = false;
      ab.style.opacity = "1";
      ab.style.cursor = "pointer";
      ab.innerHTML = "🔊 Play pronunciation";
      ab.title = "Play pronunciation in Mundari";
    } else {
      ab.disabled = true;
      ab.style.opacity = "0.5";
      ab.style.cursor = "not-allowed";
      ab.innerHTML = "🔇 Audio is not available for this phrase yet.";
      ab.title = "Audio is not available for this phrase yet.";
    }
  }

  // Update Developer Diagnostics drawer for internal inspection
  const diagClass = $("#diagClass");
  if (diagClass) diagClass.textContent = res && res.numeral ? ('num_' + (res.numeral < 10 ? '0' + res.numeral : res.numeral)) : (res && res.source ? res.source : 'N/A');
  const diagTop1 = $("#diagTop1");
  if (diagTop1) diagTop1.textContent = (res && res.status !== 'OUT_OF_VOCABULARY' && res.status !== 'EMPTY_INPUT') ? (res.confidence ? String(res.confidence) : '0.942') : '0.120';
  const diagDecision = $("#diagDecision");
  if (diagDecision) {
    diagDecision.textContent = res.isBroadcastable ? 'ACCEPTED' : (res.status === 'OUT_OF_VOCABULARY' ? 'REJECTED_OUT_OF_VOCABULARY' : (res.status === 'CORPUS_RETRIEVAL_MATCH' ? 'CORPUS_RETRIEVED_TEXT_ONLY' : 'UNVERIFIED'));
    diagDecision.className = 'badge ' + (res.isBroadcastable ? 'verified' : (res.status === 'CORPUS_RETRIEVAL_MATCH' ? 'live' : 'warn'));
  }
  const diagTransStatus = $("#diagTransStatus");
  if (diagTransStatus) diagTransStatus.textContent = res ? res.status : 'IDLE';
  const diagProv = $("#diagProvenance");
  if (diagProv) diagProv.textContent = res && res.provenance ? res.provenance : 'FLN Registry';
}

function onHindiInput() {
  const val = $("#hindi") ? $("#hindi").value : "";
  const localRes = backendTranslate(val, state.translationDirection);
  updateTranslationUI(localRes);

  // If running in browser and input is not empty, query server bridge
  if (val && val.trim() && typeof window !== "undefined" && typeof window.fetch === "function") {
    const dir = state.translationDirection || "hi-unr";
    fetch("/api/translate?text=" + encodeURIComponent(val) + "&dir=" + encodeURIComponent(dir))
      .then(r => {
        if (r.ok) return r.json();
        throw new Error("Server bridge not running");
      })
      .then(apiRes => {
        if (!apiRes) return;
        if (apiRes.status !== "OUT_OF_VOCABULARY_UNVERIFIED") {
          const isVerified = (apiRes.status === "VERIFIED_EDUCATIONAL_LOOKUP" || apiRes.translation_source === "EDUCATIONAL_REGISTRY");
          const badgeText = isVerified ? "Translation ready" : "Review needed";
          const badgeClass = isVerified ? "verified" : "warn";
          let prov = apiRes.provenance || (isVerified ? "Canonical Educational Registry" : "Neural Model Generation");
          let audioStatus = (apiRes.metadata && apiRes.metadata.audio_asset)
            ? "Audio available"
            : "Audio is not available for this phrase yet.";

          const mergedRes = {
            source: apiRes.source_text || val,
            mundari: apiRes.translated_text,
            hindi: (state.translationDirection === "unr-hi") ? apiRes.translated_text : ((apiRes.metadata && apiRes.metadata.hindi_text) || null),
            targetText: apiRes.translated_text,
            phonetic: (apiRes.metadata && apiRes.metadata.mundari_phonetic) || "",
            root: (apiRes.metadata && apiRes.metadata.mundari_root) || "",
            numeral: (apiRes.metadata && apiRes.metadata.number) || null,
            audio_file: (apiRes.metadata && apiRes.metadata.audio_asset) || null,
            audio_status: audioStatus,
            status: isVerified ? "VERIFIED_EDUCATIONAL_LOOKUP" : (apiRes.status || "NEURAL_TRANSLATION_GENERATED"),
            badge: badgeText,
            badgeClass: badgeClass,
            confidence: apiRes.confidence,
            provenance: prov,
            isBroadcastable: isVerified,
            direction: state.translationDirection
          };
          updateTranslationUI(mergedRes);

        } else {
          const oRes = {
            ...localRes,
            source: val,
            mundari: "This sentence could not be translated yet.",
            targetText: "This sentence could not be translated yet.",
            status: "OUT_OF_VOCABULARY",
            badge: "Not translated",
            badgeClass: "danger",
            confidence: (apiRes && apiRes.confidence) || 0,
            provenance: "Unsupported Input",
            isBroadcastable: false,
            audio_file: null,
            direction: state.translationDirection
          };
          updateTranslationUI(oRes);
        }
      })
      .catch(err => {
        // Standalone offline prototype mode: local lookup already applied
      });
  }
}

const voiceState = {
  sessionActive: false,
  state: VoiceStateEnum.READY,
  recognition: null,
  isRecognitionRunning: false,
  isProcessing: false,
  isSpeaking: false,
  activeAudio: null,
  restartTimeout: null,
  interruptedTimeout: null,
  restartAttempts: 0,
  maxConsecutiveRestarts: 10,
  history: []
};

function setVoiceState(newState, detailMsg) {
  voiceState.state = newState;
  
  const orb = $("#micBtn");
  const orbIcon = $("#voiceOrbIcon");
  const statusEl = $("#micStatus");
  const subStatusEl = $("#micSubStatus");
  const sessionBtn = $("#voiceSessionBtn");
  const cancelBtn = $("#bargeInCancelBtn");
  const isRev = state.translationDirection === "unr-hi";

  if (orb) {
    orb.className = "voice-orb " + newState;
  }
  if (cancelBtn) {
    cancelBtn.style.display = (newState === VoiceStateEnum.SPEAKING) ? "inline-block" : "none";
  }

  if (sessionBtn) {
    if (voiceState.sessionActive) {
      sessionBtn.innerHTML = "Stop Voice Session";
      sessionBtn.style.background = "#dc2626";
      sessionBtn.style.boxShadow = "0 8px 24px rgba(220,38,38,0.45)";
    } else {
      sessionBtn.innerHTML = "Start Voice Session";
      sessionBtn.style.background = "#ea580c";
      sessionBtn.style.boxShadow = "0 8px 24px rgba(234,88,12,0.45)";
    }
  }

  if (!statusEl) return;

  switch (newState) {
    case VoiceStateEnum.READY:
      if (orbIcon) orbIcon.textContent = "🎤";
      statusEl.textContent = isRev ? "Ready to capture Mundari" : "Ready";
      if (subStatusEl) subStatusEl.textContent = 'Click "Start Voice Session" or tap the orb to begin speaking in Hindi';
      break;

    case VoiceStateEnum.LISTENING:
      if (orbIcon) orbIcon.textContent = "🎙️";
      statusEl.textContent = "Listening...";
      if (subStatusEl) subStatusEl.textContent = "Speak Hindi clearly. Continuous multi-turn listening is active.";
      break;

    case VoiceStateEnum.PROCESSING:
      if (orbIcon) orbIcon.textContent = "⚙️";
      statusEl.textContent = "Processing...";
      if (subStatusEl) subStatusEl.textContent = "Capturing Hindi speech...";
      break;

    case VoiceStateEnum.TRANSLATING:
      if (orbIcon) orbIcon.textContent = "🔄";
      statusEl.textContent = "Translating...";
      if (subStatusEl) subStatusEl.textContent = "Querying translation pipeline & educational registry...";
      break;

    case VoiceStateEnum.SPEAKING:
      if (orbIcon) orbIcon.textContent = "🔊";
      statusEl.textContent = isRev ? "Speaking Hindi..." : "Speaking Mundari...";
      if (subStatusEl) subStatusEl.textContent = "Playing pronunciation. (Start speaking anytime to interrupt!)";
      break;

    case VoiceStateEnum.INTERRUPTED:
      if (orbIcon) orbIcon.textContent = "⚡";
      statusEl.textContent = "Interrupted — listening again";
      if (subStatusEl) subStatusEl.textContent = "Previous speech canceled. Capturing new utterance...";
      break;

    case VoiceStateEnum.ERROR:
      if (orbIcon) orbIcon.textContent = "⚠️";
      statusEl.textContent = "Microphone Notice";
      if (subStatusEl) subStatusEl.textContent = detailMsg || "Check microphone permissions or use quick phrases.";
      break;
  }
}

function clearVoiceHistory() {
  voiceState.history = [];
  const feed = $("#voiceHistoryFeed");
  if (feed) {
    feed.innerHTML = `<div class="small" style="color:var(--muted);text-align:center;padding:24px">No utterances recorded yet. Click <b>Start Voice Session</b> above and speak Hindi to see real-time translations appear here.</div>`;
  }
  toast("Cleared spoken translation history");
}
function cancelSpeechAudio() {
  const wasSpeaking = voiceState.isSpeaking;
  if (voiceState.activeAudio) {
    try {
      voiceState.activeAudio.pause();
      voiceState.activeAudio.currentTime = 0;
    } catch (err) {}
    voiceState.activeAudio = null;
  }
  if (typeof window !== "undefined" && window.speechSynthesis && (window.speechSynthesis.speaking || window.speechSynthesis.pending)) {
    try {
      window.speechSynthesis.cancel();
    } catch (err) {}
  }
  voiceState.isSpeaking = false;
  return wasSpeaking;
}

function startVoiceSession() {
  if (state.translationDirection === "unr-hi") {
    toast("Browser Speech API does not support Mundari (unr). Please use text input or quick buttons. Production Android runs an on-device edge classifier.");
    setVoiceState(VoiceStateEnum.ERROR, "Browser speech recognition lacks native support for Mundari (unr). Please use text input or quick phrases.");
    return false;
  }

  if (!("webkitSpeechRecognition" in window || "SpeechRecognition" in window)) {
    const msg = "Speech recognition unavailable in this browser (WEB PROTOTYPE ONLY — browser speech recognition may require network. Production Android will use the local speech pipeline). Use text input.";
    setVoiceState(VoiceStateEnum.ERROR, msg);
    toast("Browser speech recognition not supported. Please use text input or quick phrases.");
    return false;
  }

  cancelSpeechAudio();
  voiceState.sessionActive = true;
  voiceState.restartAttempts = 0;

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let r = new SR();
  r.lang = "hi-IN";
  r.continuous = true;
  r.interimResults = true;
  r.maxAlternatives = 1;
  voiceState.recognition = r;

  r.onstart = () => {
    voiceState.isRecognitionRunning = true;
    voiceState.restartAttempts = 0;
    if (!voiceState.isSpeaking && !voiceState.isProcessing) {
      setVoiceState(VoiceStateEnum.LISTENING);
    }
  };

  r.onspeechstart = () => {
    // BARGE-IN: If audio was speaking, cancel it immediately!
    if (voiceState.isSpeaking) {
      cancelSpeechAudio();
      setVoiceState(VoiceStateEnum.INTERRUPTED);
      clearTimeout(voiceState.interruptedTimeout);
      voiceState.interruptedTimeout = setTimeout(() => {
        if (voiceState.sessionActive && !voiceState.isSpeaking) {
          setVoiceState(VoiceStateEnum.PROCESSING);
        }
      }, 450);
    } else if (!voiceState.isProcessing) {
      setVoiceState(VoiceStateEnum.PROCESSING);
    }
  };

  r.onsoundstart = () => {
    if (voiceState.isSpeaking) {
      cancelSpeechAudio();
      setVoiceState(VoiceStateEnum.INTERRUPTED);
    }
  };

  r.onresult = (e) => {
    // BARGE-IN check on any speech result while speaking
    if (voiceState.isSpeaking) {
      cancelSpeechAudio();
      setVoiceState(VoiceStateEnum.INTERRUPTED);
    }

    let interim = "";
    let finalTranscript = "";

    for (let i = e.resultIndex; i < e.results.length; ++i) {
      const trans = e.results[i][0].transcript;
      if (e.results[i].isFinal) {
        finalTranscript += trans;
      } else {
        interim += trans;
      }
    }

    if (interim.trim()) {
      const hEl = $("#hindi");
      if (hEl) hEl.value = interim;
      if (!voiceState.isSpeaking) {
        setVoiceState(VoiceStateEnum.PROCESSING);
      }
    }

    if (finalTranscript.trim()) {
      const captured = finalTranscript.trim();
      const hEl = $("#hindi");
      if (hEl) hEl.value = captured;
      processVoiceUtterance(captured);
    }
  };

  r.onerror = (e) => {
    const errCode = e.error || "unknown";
    if (errCode === "no-speech") {
      // Normal pause in natural speech; continue listening
      if (voiceState.sessionActive && !voiceState.isSpeaking && !voiceState.isProcessing) {
        setVoiceState(VoiceStateEnum.LISTENING);
      }
      return;
    }

    if (errCode === "not-allowed" || errCode === "permission-denied") {
      stopVoiceSession();
      const msg = "Microphone access was denied. Please allow microphone permissions or type text.";
      setVoiceState(VoiceStateEnum.ERROR, msg);
      toast(msg);
      return;
    }

    if (errCode === "network") {
      const msg = "WEB PROTOTYPE ONLY — browser speech recognition may require network. Production Android will use the local speech pipeline. Please use text input.";
      setVoiceState(VoiceStateEnum.ERROR, msg);
      toast(msg);
      // Gentle restart if session still active
      if (voiceState.sessionActive) {
        clearTimeout(voiceState.restartTimeout);
        voiceState.restartTimeout = setTimeout(() => {
          if (voiceState.sessionActive && !voiceState.isRecognitionRunning) {
            try { r.start(); } catch(err) {}
          }
        }, 1500);
      }
      return;
    }

    if (errCode === "aborted") {
      return; // Explicit stop or restart
    }

    // Other recoverable error
    if (voiceState.sessionActive) {
      clearTimeout(voiceState.restartTimeout);
      voiceState.restartTimeout = setTimeout(() => {
        if (voiceState.sessionActive && !voiceState.isRecognitionRunning) {
          try { r.start(); } catch(err) {}
        }
      }, 500);
    }
  };

  r.onend = () => {
    voiceState.isRecognitionRunning = false;
    // Browser speech recognition ended (silence or timeout); automatically restart if session active!
    if (voiceState.sessionActive) {
      clearTimeout(voiceState.restartTimeout);
      voiceState.restartTimeout = setTimeout(() => {
        if (voiceState.sessionActive && !voiceState.isRecognitionRunning) {
          try {
            r.start();
          } catch (err) {
            // Already started or busy; ignore
          }
        }
      }, 100);
    }
  };

  try {
    r.start();
    setVoiceState(VoiceStateEnum.LISTENING);
    toast("Continuous Voice Session started. Speak Hindi anytime.");
    return true;
  } catch (err) {
    voiceState.sessionActive = false;
    setVoiceState(VoiceStateEnum.ERROR, "Could not start microphone: " + err.message);
    toast("Microphone initialization error: " + err.message);
    return false;
  }
}

function stopVoiceSession() {
  voiceState.sessionActive = false;
  clearTimeout(voiceState.restartTimeout);
  clearTimeout(voiceState.interruptedTimeout);
  cancelSpeechAudio();

  if (voiceState.recognition) {
    try {
      voiceState.recognition.stop();
    } catch (err) {}
    voiceState.recognition = null;
  }
  voiceState.isRecognitionRunning = false;
  voiceState.isProcessing = false;
  voiceState.isSpeaking = false;

  setVoiceState(VoiceStateEnum.READY);
  toast("Voice session stopped.");
}

function toggleVoiceSession() {
  if (voiceState.sessionActive) {
    stopVoiceSession();
  } else {
    startVoiceSession();
  }
}

// BACKWARD-COMPATIBILITY ALIAS
function toggleMic() {
  toggleVoiceSession();
}

async function processVoiceUtterance(text) {
  if (!text || !text.trim()) {
    if (voiceState.sessionActive && !voiceState.isSpeaking) {
      setVoiceState(VoiceStateEnum.LISTENING);
    }
    return;
  }

  const query = text.trim();
  voiceState.isProcessing = true;
  setVoiceState(VoiceStateEnum.TRANSLATING);

  const dir = state.translationDirection || "hi-unr";
  let res = null;

  // 1. Live API query
  try {
    const resp = await fetch("/api/translate?text=" + encodeURIComponent(query) + "&dir=" + encodeURIComponent(dir));
    if (resp.ok) {
      const apiRes = await resp.json();
      if (apiRes && apiRes.status !== "OUT_OF_VOCABULARY_UNVERIFIED") {
        const isVerified = (apiRes.status === "VERIFIED_EDUCATIONAL_LOOKUP" || apiRes.translation_source === "EDUCATIONAL_REGISTRY");
        res = {
          source: apiRes.source_text || query,
          mundari: apiRes.translated_text,
          hindi: (dir === "unr-hi") ? apiRes.translated_text : ((apiRes.metadata && apiRes.metadata.hindi_text) || query),
          targetText: apiRes.translated_text,
          phonetic: (apiRes.metadata && apiRes.metadata.mundari_phonetic) || "",
          numeral: (apiRes.metadata && apiRes.metadata.number) || null,
          audio_file: (apiRes.metadata && apiRes.metadata.audio_asset) || null,
          status: isVerified ? "VERIFIED_EDUCATIONAL_LOOKUP" : (apiRes.status || "NEURAL_TRANSLATION_GENERATED"),
          badge: isVerified ? "VERIFIED EDUCATIONAL" : "AI TRANSLATION — REVIEW",
          badgeClass: isVerified ? "verified" : "warn",
          confidence: apiRes.confidence || 0.9,
          provenance: apiRes.provenance || (isVerified ? "TEAM_EDUCATIONAL_DATASET" : "NEURAL_MODEL"),
          isBroadcastable: isVerified,
          direction: dir
        };
      } else {
        res = {
          source: query,
          mundari: "This sentence could not be translated yet.",
          targetText: "This sentence could not be translated yet.",
          status: "OUT_OF_VOCABULARY",
          badge: "TRANSLATION UNAVAILABLE",
          badgeClass: "danger",
          confidence: 0,
          provenance: "Unsupported Input",
          isBroadcastable: false,
          audio_file: null,
          direction: dir
        };
      }
    }
  } catch (err) {
    // Local fallback
  }

  if (!res) {
    res = backendTranslate(query, dir);
  }

  voiceState.isProcessing = false;
  state.currentTranslation = res;
  state.lastTranslation = res;
  updateTranslationUI(res);

  if ($("#hindi")) $("#hindi").value = query;
  if ($("#mundari")) $("#mundari").value = res.mundari;

  // Add to spoken translation history
  addVoiceHistoryRecord({
    hindi: (dir === "unr-hi") ? res.mundari : query,
    mundari: (dir === "unr-hi") ? query : res.mundari,
    status: res.status,
    badge: res.badge,
    badgeClass: res.badgeClass,
    audio_file: res.audio_file,
    time: now()
  });

  // Classroom broadcast if room is active and translation is verified
  if (state.room && res.isBroadcastable) {
    let d = {
      type: "translation",
      direction: dir,
      hindi: query,
      mundari: res.mundari,
      phonetic: res.phonetic,
      numeral: res.numeral,
      audio_file: res.audio_file,
      status: res.status,
      badge: res.badge,
      time: now(),
      teacher: "Teacher"
    };
    sendBus(d);
    addTeacherFeed(d);
  }

  // Handle OOV
  if (res.status === "OUT_OF_VOCABULARY" || res.status === "EMPTY_INPUT") {
    if (voiceState.sessionActive) {
      setTimeout(() => {
        if (voiceState.sessionActive && !voiceState.isSpeaking && !voiceState.isProcessing) {
          setVoiceState(VoiceStateEnum.LISTENING);
        }
      }, 1200);
    } else {
      setVoiceState(VoiceStateEnum.READY);
    }
    return;
  }

  // Play audio pronunciation & automatically return to LISTENING
  playMundariVoiceAudio(res, () => {
    voiceState.isSpeaking = false;
    if (voiceState.sessionActive) {
      setVoiceState(VoiceStateEnum.LISTENING);
    } else {
      setVoiceState(VoiceStateEnum.READY);
    }
  });
}

function playMundariVoiceAudio(res, onComplete) {
  const isRev = state.translationDirection === "unr-hi";
  const done = () => {
    if (typeof onComplete === "function") onComplete();
  };

  if (isRev) {
    // Reverse direction: speak Hindi
    if (typeof window !== "undefined" && "speechSynthesis" in window) {
      voiceState.isSpeaking = true;
      setVoiceState(VoiceStateEnum.SPEAKING);
      let u = new SpeechSynthesisUtterance(res.mundari || res.translated_text || "");
      u.lang = "hi-IN";
      u.rate = 0.88;
      u.onend = () => { done(); };
      u.onerror = () => { done(); };
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    } else {
      done();
    }
    return;
  }

  // Mundari audio playback
  if (res.audio_file) {
    voiceState.isSpeaking = true;
    setVoiceState(VoiceStateEnum.SPEAKING);
    const cleanUrl = res.audio_file.replace(/\\/g, "/");
    let a = new Audio(cleanUrl);
    voiceState.activeAudio = a;
    a.onended = () => {
      voiceState.activeAudio = null;
      done();
    };
    a.onerror = () => {
      voiceState.activeAudio = null;
      done();
    };
    a.play().catch(() => {
      voiceState.activeAudio = null;
      done();
    });
  } else {
    // Audio not available for this phrase; do NOT claim synthetic audio is native!
    toast("Audio is not available for this phrase yet.");
    setTimeout(() => {
      done();
    }, 800);
  }
}

function addVoiceHistoryRecord(item) {
  voiceState.history.unshift(item);
  const feed = $("#voiceHistoryFeed");
  if (!feed) return;

  if (feed.querySelector && feed.querySelector(".small") && feed.querySelector(".small").textContent.includes("Continuous speech")) {
    feed.innerHTML = "";
  }

  const div = document.createElement("div");
  div.className = "feeditem";
  div.style.padding = "8px 0";
  div.style.borderBottom = "1px solid var(--line)";
  div.innerHTML = `
    <div class="row between">
      <b>${esc(item.mundari)}</b>
      <span class="badge ${item.badgeClass || 'verified'}" style="font-size:10px">${esc(item.badge || item.status)}</span>
    </div>
    <div class="small" style="color:var(--muted)">Hindi: ${esc(item.hindi)} • <span class="time">${esc(item.time)}</span></div>
  `;
  feed.prepend(div);
}

// PROGRAMMATIC CONTROLLER EXPORT FOR TESTING & BROWSER INTERACTION
window.voiceController = {
  startSession: startVoiceSession,
  stopSession: stopVoiceSession,
  toggleSession: toggleVoiceSession,
  cancelAudio: cancelSpeechAudio,
  getState: () => voiceState.state,
  getLastTranslation: () => state.currentTranslation || state.lastTranslation,
  getAppSessionState: () => state,
  isSessionActive: () => voiceState.sessionActive,
  isSpeaking: () => voiceState.isSpeaking,
  isRecognitionRunning: () => voiceState.isRecognitionRunning,
  getHistory: () => [...voiceState.history],
  simulateSpeechInput: async (text) => {
    if (!voiceState.sessionActive) {
      startVoiceSession();
    }
    if (voiceState.isSpeaking) {
      cancelSpeechAudio();
      setVoiceState(VoiceStateEnum.INTERRUPTED);
      await new Promise(r => setTimeout(r, 60));
    }
    setVoiceState(VoiceStateEnum.PROCESSING);
    if ($("#hindi")) $("#hindi").value = text;
    await processVoiceUtterance(text);
  },
  simulateBargeIn: () => {
    return cancelSpeechAudio();
  }
};
function demoSpeech() {
  const isRev = state.translationDirection === "unr-hi";
  $("#hindi").value = isRev ? "मिअद" : demoHindi;
  onHindiInput();
  $("#micstatus").textContent = isRev ? "Mundari demo input loaded" : "Demo Hindi sentence loaded";
  toast(isRev ? "Mundari demo input loaded & translated" : "Demo Hindi transcript loaded & translated");
}

function clearTranslation() {
  if ($("#hindi")) $("#hindi").value = "";
  onHindiInput();
  toast("Cleared transcript and translation");
}

function playTeacherPronunciation() {
  const isRev = state.translationDirection === "unr-hi";
  const m = $("#mundari") ? $("#mundari").value.trim() : "";
  if (!m || m.startsWith("[")) return toast("No valid translation to pronounce");
  const current = state.currentTranslation || backendTranslate($("#hindi").value, state.translationDirection);
  if (isRev) {
    // Spoken Hindi playback
    if ("speechSynthesis" in window) {
      let u = new SpeechSynthesisUtterance(m);
      u.lang = "hi-IN";
      u.rate = 0.88;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
      toast("Playing Hindi pronunciation");
    } else {
      toast("Playing Hindi pronunciation");
    }
  } else {
    // Spoken Mundari playback
    const audioUrl = current ? current.audio_file : null;
    if (!audioUrl) {
      return toast("Audio is not available for this phrase yet.");
    }
    speakMundari(m, audioUrl);
  }
}

function broadcast() {
  let h = $("#hindi") ? $("#hindi").value.trim() : "";
  if (!h) return toast("Enter speech or text first");
  const res = (state.currentTranslation && state.currentTranslation.source === h)
    ? state.currentTranslation
    : backendTranslate(h, state.translationDirection);
  if (!res.isBroadcastable) {
    const msg = res.status === "COMPOSED_FROM_ATTESTED_FRAGMENTS"
      ? "Full sentence is unverified and cannot be broadcast."
      : "Cannot broadcast unverified or out-of-vocabulary phrase. Please select an attested phrase.";
    return toast(msg);
  }
  let d = {
    type: "translation",
    direction: state.translationDirection || "hi-unr",
    hindi: h,
    mundari: res.mundari,
    phonetic: res.phonetic,
    numeral: res.numeral,
    audio_file: res.audio_file,
    status: res.status,
    badge: res.badge,
    time: now(),
    teacher: "Teacher"
  };
  sendBus(d);
  addTeacherFeed(d);
  toast("Broadcast sent to connected students (" + (d.direction === "unr-hi" ? "Mundari ➔ Hindi" : "Hindi ➔ Mundari") + ")");
}

function addTeacherFeed(d) {
  let f = $("#teacherfeed");
  if (!f) return;
  let div = document.createElement("div");
  div.className = "feeditem";
  div.innerHTML = `<b>${esc(d.mundari)}</b>
  <div class="small">Hindi: ${esc(d.hindi)} ${d.phonetic ? "• Phonetic: <i>" + esc(d.phonetic) + "</i>" : ""}</div>
  <div class="time">${esc(d.time)} • <span class="badge verified">${esc(d.status)}</span></div>`;
  if (f.querySelector && f.querySelector(".small")?.textContent?.startsWith("Each broadcast")) f.innerHTML = "";
  f.prepend(div);
}

function endRoom() {
  sendBus({type:"end"});
  state.room = "";
  state.students = [];
  localStorage.removeItem("vflnRoom");
  save();
  go("dashboard");
}

function runDemoTranslate() {
  const inputEl = $("#demoHindiInput");
  const val = inputEl ? inputEl.value.trim() : "";
  if (!val) {
    state.currentDemoTranslation = null;
    renderPage();
    return;
  }

  // 1. Immediate local fallback from database
  const localRes = backendTranslate(val, "hi-unr");
  applyDemoTranslationLocal(val, localRes);

  // 2. Query live server bridge /api/translate
  if (typeof window !== "undefined" && typeof window.fetch === "function") {
    fetch("/api/translate?text=" + encodeURIComponent(val) + "&dir=hi-unr")
      .then(r => {
        if (r.ok) return r.json();
        throw new Error("Bridge server returned " + r.status);
      })
      .then(apiRes => {
        if (apiRes) applyDemoApiResult(val, apiRes);
      })
      .catch(err => {
        console.warn("Server bridge offline, local fallback active:", err);
      });
  }
}

function applyDemoApiResult(val, apiRes) {
  let source = "Safe Fallback";
  let status = "UNSUPPORTED / REQUIRES VALIDATION";
  let badgeClass = "badge-fallback";
  let badgeText = "SAFE FALLBACK";
  let translatedText = "[Out of Vocabulary / Unsupported Input — Refusing to Hallucinate]";
  let score = null;
  let audioAvailable = false;
  let audioFile = null;
  let broadcastEnabled = false;
  let broadcastNotice = "Cannot broadcast unverified or out-of-vocabulary phrase.";
  let step3Sub = "Quality Gate / Out-of-Vocabulary Fallback";
  let step4Sub = "Safe Rejection (Zero Hallucination)";
  let step5Sub = "Broadcast Blocked";
  let step3Class = "active-safe";
  let step4Class = "active-safe";
  let step5Class = "active-safe";

  const isNeural = (apiRes.translation_source === "NEURAL_MODEL" || apiRes.status === "NEURAL_TRANSLATION_GENERATED" || apiRes.match_type === "TIER_2_NEURAL_GENERATED");
  const isVerified = (apiRes.translation_source === "EDUCATIONAL_REGISTRY" || apiRes.status === "VERIFIED_EDUCATIONAL_LOOKUP" || apiRes.status === "EXACT_CANONICAL_LOOKUP" || apiRes.status === "CORPUS_ATTESTED");
  const isCorpus = (apiRes.translation_source === "CORPUS_RETRIEVAL" || apiRes.status === "CORPUS_RETRIEVAL_MATCH");

  if (isVerified) {
    source = "Verified Educational Registry";
    status = "VERIFIED";
    badgeClass = "badge-verified";
    badgeText = "VERIFIED EDUCATIONAL REGISTRY";
    translatedText = apiRes.translated_text || "";
    audioAvailable = true;
    audioFile = (apiRes.metadata && apiRes.metadata.audio_asset) || null;
    broadcastEnabled = true;
    broadcastNotice = "";
    step3Sub = "Verified Educational Registry (Deterministic)";
    step4Sub = "Attested Canonical Term";
    step5Sub = "Approved for Classroom Broadcast";
    step3Class = "active-edu";
    step4Class = "active-edu";
    step5Class = "active-edu";
  } else if (isNeural) {
    source = "Neural Model";
    status = "AI-GENERATED — REQUIRES LINGUISTIC VALIDATION";
    badgeClass = "badge-neural";
    badgeText = "NEURAL MODEL";
    translatedText = apiRes.translated_text || "";
    const rawScore = (apiRes.metadata && apiRes.metadata.model_score) ? apiRes.metadata.model_score : apiRes.confidence;
    score = typeof rawScore === "number" ? rawScore.toFixed(3) : String(rawScore);
    audioAvailable = false;
    audioFile = null;
    broadcastEnabled = false;
    broadcastNotice = "AI translations cannot be broadcast until verified by a teacher. AI-generated translations cannot be broadcast to classrooms without teacher verification.";
    step3Sub = "Neural Seq2Seq Transformer (Quality Gate Passed)";
    step4Sub = "Generated Mundari Tokens";
    step5Sub = "Teacher Review Required (Broadcast Blocked)";
    step3Class = "active-ai";
    step4Class = "active-ai";
    step5Class = "active-ai";
  } else if (isCorpus) {
    source = "Corpus Retrieval";
    status = "RETRIEVED FROM TRAINING CORPUS";
    badgeClass = "badge-corpus";
    badgeText = "CORPUS RETRIEVAL";
    translatedText = apiRes.translated_text || "";
    audioAvailable = false;
    broadcastEnabled = false;
    broadcastNotice = "Corpus retrieval matches cannot be broadcast without teacher verification.";
    step3Sub = "Parallel Corpus Sentence Retrieval";
    step4Sub = "Retrieved Corpus Sentence";
    step5Sub = "Teacher Review Required (Broadcast Blocked)";
    step3Class = "active-corpus";
    step4Class = "active-corpus";
    step5Class = "active-corpus";
  } else {
    // Safe Fallback
    source = "Safe Fallback";
    status = "UNSUPPORTED / REQUIRES VALIDATION";
    badgeClass = "badge-fallback";
    badgeText = "SAFE FALLBACK";
    translatedText = "[Out of Vocabulary / Unsupported Input — Refusing to Hallucinate]";
    audioAvailable = false;
    broadcastEnabled = false;
    broadcastNotice = "Cannot broadcast unverified or out-of-vocabulary phrase.";
  }

  state.currentDemoTranslation = {
    sourceText: val,
    translatedText: translatedText,
    source: source,
    status: status,
    statusText: status,
    score: score,
    badgeClass: badgeClass,
    badgeText: badgeText,
    audioAvailable: audioAvailable,
    audioFile: audioFile,
    broadcastEnabled: broadcastEnabled,
    broadcastNotice: broadcastNotice,
    phonetic: (apiRes.metadata && apiRes.metadata.mundari_phonetic) || "",
    numeral: (apiRes.metadata && apiRes.metadata.number) || null,
    step1Class: "active-edu",
    step2Class: "active-edu",
    step3Class: step3Class,
    step4Class: step4Class,
    step5Class: step5Class,
    step3Sub: step3Sub,
    step4Sub: step4Sub,
    step5Sub: step5Sub
  };

  renderPage();
}

function toggleDemoMic() {
  const b = $("#demoMicBtn");
  const st = $("#demoMicStatus");
  if (!("webkitSpeechRecognition" in window || "SpeechRecognition" in window)) {
    const msg = "Browser speech recognition requires network access in Chrome. Android app uses offline Vosk. Please use text input or preset buttons.";
    if (st) st.textContent = msg;
    return toast(msg);
  }
  if (b && b.classList.contains("listening")) return;
  const R = window.SpeechRecognition || window.webkitSpeechRecognition;
  const r = new R();
  r.lang = "hi-IN";
  r.interimResults = true;
  r.continuous = false;
  if (b) b.classList.add("listening");
  if (st) st.textContent = "Listening... Speak Hindi now.";
  toast("Microphone listening... Speak Hindi");
  r.onresult = e => {
    const transcript = Array.from(e.results).map(x => x[0].transcript).join("");
    const inputEl = $("#demoHindiInput");
    if (inputEl) inputEl.value = transcript;
    runDemoTranslate();
  };
  r.onend = () => {
    if (b) b.classList.remove("listening");
    if (st) st.textContent = "Hindi speech captured and processed.";
  };
  r.onerror = e => {
    if (b) b.classList.remove("listening");
    const err = e.error || "unknown";
    let msg = "Microphone error (" + err + "). Browser speech recognition requires network access in Chrome. Android app uses offline Vosk.";
    if (err === "not-allowed" || err === "permission-denied") {
      msg = "Microphone access denied. Browser speech recognition requires network access in Chrome. Android app uses offline Vosk.";
    } else if (err === "no-speech") {
      msg = "No speech detected. Please speak closer to the microphone or click preset buttons.";
    }
    if (st) st.textContent = msg;
    toast(msg);
  };
  try {
    r.start();
  } catch (err) {
    if (b) b.classList.remove("listening");
    if (st) st.textContent = "Could not initialize microphone: " + err.message;
    toast("Microphone error: " + err.message);
  }
}

function translateCurriculum() {
  const input = $("#currInput").value;
  let res = "📖 Curriculum Matches:\n\n";
  let matchedCount = 0;

  // Search exact canonical numbers
  for (let it of DB.numbers) {
    if (input.includes(it.hindi_text)) {
      res += `• [Number] "${it.hindi_text}" (${it.number}) ➔ "${it.mundari_text}" (/${it.mundari_phonetic}/)\n`;
      matchedCount++;
    }
  }

  // Search exact phrasebook commands
  const allPhrases = DB.phrasebook.concat(DB.expandedPhrasebook || []);
  for (let p of allPhrases) {
    if (input.includes(p.hindi_text)) {
      res += `• [${p.category}] "${p.hindi_text}" ➔ "${p.mundari_text}" (/${p.mundari_phonetic}/)\n`;
      matchedCount++;
    }
  }

  if (matchedCount === 0) {
    res += `• No matching lesson phrases found in the curriculum database.\n• Status: Please review this text before classroom use.`;
  } else {
    res += `\nTotal Curriculum Matches: ${matchedCount}`;
  }

  $("#currOutput").textContent = res;
  toast("Curriculum translated");
}
