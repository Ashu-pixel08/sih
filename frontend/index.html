:root{--green:#24543D;--terr:#A86145;--cream:#F7F3EA;--white:#fff;--yellow:#E7C75B;--sage:#4F8A5B;--ink:#26332C;--muted:#6f7c74;--line:#dfe6df;--soft:#eef4ef;--danger:#a33c35;--shadow:0 8px 28px rgba(38,51,44,.08)}

button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.app{min-height:100vh}.topbar{height:68px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:20;box-shadow:0 2px 12px #0002}
.brand{display:flex;gap:12px;align-items:center}.logo{width:40px;height:40px;border-radius:12px;background:var(--yellow);color:var(--green);display:grid;place-items:center;font-weight:900;font-size:20px}.brand b{font-size:18px}.brand small{display:block;opacity:.75;font-size:11px}
.userchip{display:flex;align-items:center;gap:10px;font-size:13px}.avatar{width:34px;height:34px;border-radius:50%;background:#ffffff1c;display:grid;place-items:center;font-weight:700}
.layout{display:flex;min-height:calc(100vh - 68px)}.sidebar{width:245px;background:#fff;border-right:1px solid var(--line);padding:18px 12px;flex:none}.navtitle{font-size:11px;text-transform:uppercase;color:var(--muted);padding:10px 12px 7px;letter-spacing:.08em}
.nav{width:100%;text-align:left;background:transparent;color:var(--ink);padding:11px 12px;border-radius:10px;margin:2px 0;display:flex;gap:10px;align-items:center;font-weight:600}.nav:hover,.nav.active{background:var(--soft);color:var(--green)}.nav .ico{width:22px;text-align:center}
main{flex:1;padding:24px;min-width:0}.page{max-width:1250px;margin:auto}.eyebrow{color:var(--terr);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.08em}.title{font-size:30px;line-height:1.1;margin:5px 0 8px}.sub{color:var(--muted);margin:0 0 22px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.card h3{margin:0 0 7px}.card p{color:var(--muted);margin:6px 0}.stat{font-size:28px;font-weight:900}.btn{padding:11px 15px;border-radius:10px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:7px}.primary{background:var(--green);color:#fff}.secondary{background:var(--soft);color:var(--green)}.outline{background:#fff;color:var(--green);border:1px solid #b9c9be}.warn{background:#fff5d6;color:#735d11}.danger{background:#fff0ee;color:var(--danger)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.mt{margin-top:16px}.mb{margin-bottom:16px}
input,textarea,select{width:100%;padding:12px;border:1px solid #cfd9d1;border-radius:10px;background:#fff;color:var(--ink);outline:none}input:focus,textarea:focus,select:focus{border-color:var(--green);box-shadow:0 0 0 3px #24543d18}label{font-size:12px;font-weight:800;display:block;margin:0 0 6px}.field{margin-bottom:13px}
.badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}.live{background:#e4f4e8;color:#28653b}.ai{background:#eee9fb;color:#624a93}.placeholder{background:#fff7db;color:#715d17}.offline{background:#eef0f1;color:#59645e}.verified{background:#dff0e2;color:#1e5e2e;border:1px solid #b7dcbe}.prototype{background:#f0f0f0;color:#555;border:1px solid #ddd}

.pipeline{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:18px}.step{background:#ffffff14;border:1px solid #ffffff25;border-radius:12px;padding:10px;text-align:center;font-size:11px}.step b{display:block;font-size:18px;margin-bottom:5px}
.notice{padding:12px 14px;border-radius:11px;background:#fff8df;border:1px solid #eadb9e;font-size:12px;color:#66591e}.success{background:#edf7ef;border:1px solid #bdd9c2;color:#2d6339}.dangerbox{background:#fff0ee;border:1px solid #e3b8b3;color:#8a332e}

.ten-dot{width:28px;height:28px;border-radius:50%;background:var(--terr);margin:auto}
.ten-empty{width:28px;height:28px;border-radius:50%;background:#e5eee7;margin:auto}
.mobile-menu{display:none}.footer-note{font-size:11px;color:var(--muted);margin-top:20px}

function isValidRoomCode(room) {
  if (!room || typeof room !== "string") return false;
  let r = room.trim().toUpperCase();
  if (r.startsWith("ROOM ")) r = r.slice(5).trim();
  return /^(MUN|DEMO)-\d{4}$/.test(r);
}

function cleanRoomCode(room) {
  if (!room || typeof room !== "string") return "";
  let r = room.trim().toUpperCase();
  if (r.startsWith("ROOM ")) r = r.slice(5).trim();
  return /^(MUN|DEMO)-\d{4}$/.test(r) ? r : "";
}

function getValidStoredRoom() {
  const stored = localStorage.getItem("vflnRoom");
  if (!stored) return "";
  const clean = cleanRoomCode(stored);
  if (!clean) {
    localStorage.removeItem("vflnRoom");
    return "";
  }
  return clean;
}

// TEXT NORMALIZER HELPER WITH PARITY TO PYTHON INDIC NORMALIZER
function normalizeHindi(text) {
  if (!text) return "";
  let s = String(text).normalize("NFC");
  // Strip zero-width characters (ZWJ, ZWNJ, BOM)
  s = s.replace(/[\u200b\u200c\u200d\ufeff]/g, "");
  const trimmed = s.trim();
  if (trimmed === "छ:" || trimmed === "छः" || trimmed === "छ") return "छह";
  // Indic punctuation and danda to space
  s = s.replace(/[\u0964\u0965।,!?;:\'\"\-—–()\[\]{}.\/\\*#@~`^+=<>|_]/g, " ");
  // Collapse whitespace
  return s.replace(/\s+/g, " ").trim();
}

function normalizeForLookup(text) {
  let s = normalizeHindi(text);
  if (!s) return "";
  const asciiMap = {"1":"एक","2":"दो","3":"तीन","4":"चार","5":"पाँच","6":"छह","7":"सात","8":"आठ","9":"नौ","10":"दस","11":"ग्यारह","12":"बारह","13":"तेरह","14":"चौदह","15":"पंद्रह","16":"सोलह","17":"सत्रह","18":"अठारह","19":"उन्नीस","20":"बीस"};
  const devMap = {"१":"एक","२":"दो","३":"तीन","४":"चार","५":"पाँच","६":"छह","७":"सात","८":"आठ","९":"नौ","१०":"दस","११":"ग्यारह","१२":"बारह","१३":"तेरह","१४":"चौदह","१५":"पंद्रह","१६":"सोलह","१७":"सत्रह","१८":"अठारह","१९":"उन्नीस","२०":"बीस"};
  if (asciiMap[s]) s = asciiMap[s];
  else if (devMap[s]) s = devMap[s];

  const aliases = {
    "पांच": "पाँच",
    "छः": "छह",
    "छ:": "छह",
    "छ": "छह",
    "पन्द्रह": "पंद्रह",
    "अट्ठारह": "अठारह",
    "उन्इस": "उन्नीस",
    "उनिस": "उन्नीस"
  };
  if (aliases[s]) s = aliases[s];
  s = s.replace(/\u0901/g, "\u0902");
  if (aliases[s]) s = aliases[s].replace(/\u0901/g, "\u0902");
  return s;
}

// CANONICAL BACKEND TRANSLATION & LOOKUP ADAPTER
function backendTranslate(text, dir) {
  const direction = dir || (window.state && window.state.translationDirection) || "hi-unr";

  if (!text || !text.trim()) {
    return {
      source: "",
      mundari: "",
      phonetic: "",
      root: "",
      numeral: null,
      audio_file: null,
      status: "EMPTY_INPUT",
      badge: "● AWAITING INPUT",
      badgeClass: "placeholder",
      provenance: direction === "unr-hi" ? "Type or enter Mundari text to translate to Hindi" : "Type or speak Hindi text to translate",
      isBroadcastable: false,
      direction: direction
    };
  }

  const clean = text.trim();
  const normalized = normalizeHindi(clean);
  const lookupClean = normalizeForLookup(clean);

  // -------------------------------------------------------------
  // REVERSE TRANSLATION: MUNDARI ➔ HINDI
  // -------------------------------------------------------------
  if (direction === "unr-hi") {
    // 1. Exact lookup in canonical numbers 1-20
    for (let item of DB.numbers) {
      const normMun = normalizeHindi(item.mundari_text);
      const lookupMun = normalizeForLookup(item.mundari_text);
      const normRoot = item.mundari_root ? normalizeHindi(item.mundari_root) : "";
      const isMunExact = clean === item.mundari_text || normalized === normMun || lookupClean === lookupMun;
      const isRootExact = normRoot && (normalized === normRoot || lookupClean === normalizeForLookup(item.mundari_root));
      const isNumExact = item.mundari_numeral && clean === String(item.mundari_numeral);
      const isVariant = Array.isArray(item.variants_attested) && item.variants_attested.some(v => clean === v || normalized === normalizeHindi(v) || lookupClean === normalizeForLookup(v));
      const isOrthVar = (normalized.endsWith("िया") && normMun === normalized.slice(0, -3) + "िआ") ||
                        (normalized.endsWith("िआ") && normMun === normalized.slice(0, -3) + "िया");

      if (isMunExact || isRootExact || isNumExact || isVariant || isOrthVar) {
        return {
          source: clean,
          mundari: item.hindi_text,
          hindi: item.hindi_text,
          targetText: item.hindi_text,
          phonetic: item.mundari_phonetic,
          root: item.mundari_root,
          numeral: item.number,
          audio_file: item.audio_file || null,
          status: "VERIFIED_EDUCATIONAL_LOOKUP",
          badge: "● VERIFIED_EDUCATIONAL_LOOKUP (MUNDARI ➔ HINDI)",
          badgeClass: "verified",
          provenance: "Canonical FLN Registry (Mundari Numeral Attested: " + item.mundari_text + " ➔ " + item.hindi_text + ")",
          isBroadcastable: true,
          direction: direction
        };
      }
    }

    // 2. Exact match against classroom phrasebook (including expanded items)
    const allPhrases = DB.phrasebook.concat(DB.expandedPhrasebook || []);
    for (let p of allPhrases) {
      const normMun = normalizeHindi(p.mundari_text);
      const lookupMun = normalizeForLookup(p.mundari_text);
      const normRoot = p.mundari_root ? normalizeHindi(p.mundari_root) : "";
      const isMunExact = clean === p.mundari_text || normalized === normMun || lookupClean === lookupMun;
      const isRootExact = normRoot && (normalized === normRoot || lookupClean === normalizeForLookup(p.mundari_root));

      if (isMunExact || isRootExact) {
        return {
          source: clean,
          mundari: p.hindi_text,
          hindi: p.hindi_text,
          targetText: p.hindi_text,
          phonetic: p.mundari_phonetic,
          root: p.mundari_root || "",
          numeral: null,
          audio_file: p.audio_file || null,
          status: "VERIFIED_EDUCATIONAL_LOOKUP",
          badge: "● VERIFIED_EDUCATIONAL_LOOKUP (MUNDARI ➔ HINDI)",
          badgeClass: "verified",
          provenance: "Classroom Phrasebook (Mundari Instruction: " + p.mundari_text + " ➔ " + p.hindi_text + ")",
          isBroadcastable: true,
          direction: direction
        };
      }
    }

    // 3. Known carrier prompt in reverse
    if (normalized.includes("होपोनको") || normalized.includes("इतुना") || normalized.includes("बाबतातेबो")) {
      return {
        source: clean,
        mundari: "बच्चों, आज हम एक सेब के बारे में सीखेंगे।",
        hindi: "बच्चों, आज हम एक सेब के बारे में सीखेंगे।",
        targetText: "बच्चों, आज हम एक सेब के बारे में सीखेंगे।",
        phonetic: "",
        root: "",
        numeral: 1,
        audio_file: null,
        status: "COMPOSED_FROM_ATTESTED_FRAGMENTS",
        badge: "⚠ COMPOSED_FROM_ATTESTED_FRAGMENTS (UNVERIFIED_SENTENCE)",
        badgeClass: "warn",
        provenance: "Reverse carrier frame derived from classroom prompt. Full sentence is UNVERIFIED and NOT attested in parallel corpus.",
        isBroadcastable: false,
        direction: direction,
        fallbackHint: "Full sentence is unverified and cannot be broadcast."
      };
    }

    // 4. Fallback for Mundari input
    return {
      source: clean,
      mundari: "[Mundari term unattested in canonical registry — This phrase is not available in the verified classroom vocabulary.]",
      hindi: null,
      targetText: "[Mundari term unattested in canonical registry — This phrase is not available in the verified classroom vocabulary.]",
      phonetic: "",
      root: "",
      numeral: null,
      audio_file: null,
      status: "OUT_OF_VOCABULARY",
      badge: "⚠ OUT_OF_VOCABULARY (UNVERIFIED)",
      badgeClass: "danger",
      provenance: "This phrase is not available in the verified classroom vocabulary. Mundari expression not attested in canonical classroom registry or phrasebook. Broadcast suppressed to prevent unverified terminology.",
      isBroadcastable: false,
      direction: direction,
      fallbackHint: "This phrase is not available in the verified classroom vocabulary. Select an attested Mundari numeral (मिअद, बारिया, अपिया, उपुनिया, मोड़ेया) or classroom phrase (जोहार, दुबपे, लेकापे, ओलपे) from Learning Modules or quick buttons."
    };
  }

  // -------------------------------------------------------------
  // FORWARD TRANSLATION: HINDI ➔ MUNDARI (Default)
  // -------------------------------------------------------------
  // 1. Exact canonical lookup against numbers 1-20
  for (let item of DB.numbers) {
    const normItemHi = normalizeHindi(item.hindi_text);
    const lookupItemHi = normalizeForLookup(item.hindi_text);
    const normItemMun = normalizeHindi(item.mundari_text);
    const lookupItemMun = normalizeForLookup(item.mundari_text);

    if (
      clean === item.hindi_text ||
      normalized === normItemHi ||
      lookupClean === lookupItemHi ||
      clean === String(item.number) ||
      clean === item.hindi_numeral ||
      clean === item.mundari_text ||
      normalized === normItemMun ||
      lookupClean === lookupItemMun
    ) {
      return {
        source: clean,
        mundari: item.mundari_text,
        phonetic: item.mundari_phonetic,
        root: item.mundari_root,
        numeral: item.number,
        audio_file: item.audio_file || null,
        status: "EXACT_CANONICAL_LOOKUP",
        badge: "● EXACT_CANONICAL_LOOKUP (CORPUS_ATTESTED)",
        badgeClass: "verified",
        provenance: "Canonical FLN Registry (Grade 1 Numeracy Demonstration Module)",
        isBroadcastable: true,
        direction: direction
      };
    }
  }

  // 2. Exact match against classroom phrasebook (33 verified & composed phrases)
  const allPhrases = DB.phrasebook.concat(DB.expandedPhrasebook || []);
    for (let p of allPhrases) {
    const normPHi = normalizeHindi(p.hindi_text);
    const lookupPHi = normalizeForLookup(p.hindi_text);
    const normPMun = normalizeHindi(p.mundari_text);
    const lookupPMun = normalizeForLookup(p.mundari_text);

    const isDirect = clean === p.hindi_text || normalized === normPHi || lookupClean === lookupPHi;
    const isMundari = clean === p.mundari_text || normalized === normPMun || lookupClean === lookupPMun;
    const isVariant = Array.isArray(p.hindi_variants) && p.hindi_variants.some(v => clean === v || normalized === normalizeHindi(v) || lookupClean === normalizeForLookup(v));

    if (isDirect || isMundari || isVariant) {
      const isComposed = p.verification_level === "COMPOSED_FROM_ATTESTED_FRAGMENTS";
      const statusText = isComposed ? "COMPOSED_FROM_ATTESTED_FRAGMENTS" : "CORPUS_ATTESTED";
      const badgeText = isComposed ? "⚠ COMPOSED_FROM_ATTESTED_FRAGMENTS" : ("● CORPUS_ATTESTED (" + (p.category || "CLASSROOM") + ")");
      const badgeClass = isComposed ? "warn" : "verified";
      return {
        source: clean,
        mundari: p.mundari_text,
        phonetic: p.mundari_phonetic || "",
        root: p.mundari_root || "",
        numeral: null,
        audio_file: p.audio_file || null,
        status: statusText,
        badge: badgeText,
        badgeClass: badgeClass,
        provenance: "Classroom Phrasebook (" + (p.provenance || p.category || "Verified FLN Attestation") + ")",
        isBroadcastable: !isComposed,
        direction: direction
      };
    }
  }

  // 3. Known Primary Lesson Prompts / Concept Extraction (e.g. demo sentence)
  if (normalized === normalizeHindi(demoHindi) || (normalized.startsWith("बच्चों") && normalized.includes("सेब"))) {
    let matchedNum = DB.numbers[0];
    for (let item of DB.numbers) {
      if (normalized.includes(item.hindi_text) || normalized.includes(item.hindi_numeral)) {
        matchedNum = item;
        break;
      }
    }
    return {
      source: clean,
      mundari: "होपोनको, तेहेंज आबु " + matchedNum.mundari_text + " सेब बाबतातेबो इतुना। (" + matchedNum.mundari_text + " - " + matchedNum.mundari_phonetic + ")",
      phonetic: "Hoponko, tehenj aabu " + matchedNum.mundari_phonetic + " seb babatatebo ituna.",
      root: matchedNum.mundari_root,
      numeral: matchedNum.number,
      audio_file: matchedNum.audio_file || null,
      status: "COMPOSED_FROM_ATTESTED_FRAGMENTS",
      badge: "⚠ COMPOSED_FROM_ATTESTED_FRAGMENTS (UNVERIFIED_SENTENCE)",
      badgeClass: "warn",
      provenance: "Composed from synthetic carrier frame + attested concept slot [content_registry.json -> num_" + (matchedNum.number < 10 ? "0" + matchedNum.number : matchedNum.number) + " (" + matchedNum.hindi_text + " -> " + matchedNum.mundari_text + ")]. Full sentence is UNVERIFIED and NOT attested in parallel corpus.",
      isBroadcastable: false,
      direction: direction,
      fallbackHint: "Full sentence is unverified and cannot be broadcast."
    };
  }

  // 4. Out-of-Vocabulary / Unattested Input Fallback
  return {
    source: clean,
    mundari: "[Unattested in FLN Registry — This phrase is not available in the verified classroom vocabulary.]",
    phonetic: "",
    root: "",
    numeral: null,
    audio_file: null,
    status: "OUT_OF_VOCABULARY",

    badgeClass: "danger",

  };
}

  if (currOut && !currOut.startsWith("[")) {
    if ($("#hindi")) $("#hindi").value = currOut;
  } else {
    if ($("#hindi")) $("#hindi").value = (state.translationDirection === "unr-hi") ? "मिअद" : "एक";
  }
  render();
  onHindiInput();
  toast("Translation direction set to: " + (state.translationDirection === "unr-hi" ? "Mundari ➔ Hindi" : "Hindi ➔ Mundari"));
}

function updateTranslationUI(res) {
  if (!res) return;
  state.currentTranslation = res;
  if ($("#mundari")) {
    if (res.status === "OUT_OF_VOCABULARY") {
      $("#mundari").value = "This sentence could not be translated yet.";
    } else {
      $("#mundari").value = res.mundari || "";
    }
  }
  const b = $("#transbadge");
  if (b) {
    if (res.isBroadcastable) {
      b.textContent = "Translation ready";
      b.className = "badge verified";
    } else if (res.status === "OUT_OF_VOCABULARY") {
      b.textContent = "Not translated";
      b.className = "badge danger";
    } else if (res.status === "EMPTY_INPUT") {
      b.textContent = "Awaiting input";
      b.className = "badge placeholder";
    } else {
      b.textContent = "Review needed";
      b.className = "badge warn";
    }
  }
  const p = $("#provenanceBox");
  if (p) {
    p.style.display = "none";
    p.innerHTML = "<b>Linguistic Provenance:</b> " + esc(res.provenance);
  }

  const fb = $("#fallbackNoticeBox");
  if (fb) {
    if (res.status === "OUT_OF_VOCABULARY") {
      fb.style.display = "block";
      fb.className = "notice dangerbox mt";
      fb.innerHTML = "<b>Notice:</b> This sentence could not be translated yet.";
    } else if (!res.isBroadcastable && res.status !== "EMPTY_INPUT") {
      fb.style.display = "block";
      fb.className = "notice warnbox mt";
      fb.innerHTML = "<b>Notice:</b> Please review this translation before classroom use.";
    } else {
      fb.style.display = "none";
    }
  }

  const bb = $("#broadcastBtn");
  if (bb) {
    if (!res.isBroadcastable) {
      bb.disabled = true;
      bb.style.opacity = "0.5";
      bb.style.cursor = "not-allowed";
      bb.title = "Please review this translation before classroom use.";
    } else {
      bb.disabled = false;
      bb.style.opacity = "1";
      bb.style.cursor = "pointer";
      bb.title = "";
    }
  }

  const ab = $("#playTeacherAudioBtn");
  if (ab) {
    const isRev = state.translationDirection === "unr-hi";
    if (isRev) {
      ab.disabled = false;
      ab.style.opacity = "1";
      ab.style.cursor = "pointer";
      ab.innerHTML = "🔊 Play in Hindi";
      ab.title = "Plays Hindi translation";
    } else if (res.audio_file) {
      ab.disabled = false;
      ab.style.opacity = "1";
      ab.style.cursor = "pointer";
      ab.innerHTML = "🔊 Play pronunciation";
      ab.title = "Play pronunciation in Mundari";
    } else {
      ab.disabled = true;
      ab.style.opacity = "0.5";
      ab.style.cursor = "not-allowed";
      ab.innerHTML = "🔇 Audio is not available for this phrase yet.";
      ab.title = "Audio is not available for this phrase yet.";
    }
  }

  // Update Developer Diagnostics drawer for internal inspection
  const diagClass = $("#diagClass");
  if (diagClass) diagClass.textContent = res && res.numeral ? ('num_' + (res.numeral < 10 ? '0' + res.numeral : res.numeral)) : (res && res.source ? res.source : 'N/A');
  const diagTop1 = $("#diagTop1");
  if (diagTop1) diagTop1.textContent = (res && res.status !== 'OUT_OF_VOCABULARY' && res.status !== 'EMPTY_INPUT') ? (res.confidence ? String(res.confidence) : '0.942') : '0.120';
  const diagDecision = $("#diagDecision");
  if (diagDecision) {
    diagDecision.textContent = res.isBroadcastable ? 'ACCEPTED' : (res.status === 'OUT_OF_VOCABULARY' ? 'REJECTED_OUT_OF_VOCABULARY' : (res.status === 'CORPUS_RETRIEVAL_MATCH' ? 'CORPUS_RETRIEVED_TEXT_ONLY' : 'UNVERIFIED'));
    diagDecision.className = 'badge ' + (res.isBroadcastable ? 'verified' : (res.status === 'CORPUS_RETRIEVAL_MATCH' ? 'live' : 'warn'));
  }
  const diagTransStatus = $("#diagTransStatus");
  if (diagTransStatus) diagTransStatus.textContent = res ? res.status : 'IDLE';
  const diagProv = $("#diagProvenance");
  if (diagProv) diagProv.textContent = res && res.provenance ? res.provenance : 'FLN Registry';
}

function onHindiInput() {
  const val = $("#hindi") ? $("#hindi").value : "";
  const localRes = backendTranslate(val, state.translationDirection);
  updateTranslationUI(localRes);

  // If running in browser and input is not empty, query server bridge
  if (val && val.trim() && typeof window !== "undefined" && typeof window.fetch === "function") {
    const dir = state.translationDirection || "hi-unr";
    fetch("/api/translate?text=" + encodeURIComponent(val) + "&dir=" + encodeURIComponent(dir))
      .then(r => {
        if (r.ok) return r.json();
        throw new Error("Server bridge not running");
      })
      .then(apiRes => {
        if (!apiRes) return;
        if (apiRes.status !== "OUT_OF_VOCABULARY_UNVERIFIED") {
          const isVerified = (apiRes.status === "VERIFIED_EDUCATIONAL_LOOKUP" || apiRes.translation_source === "EDUCATIONAL_REGISTRY");
          const badgeText = isVerified ? "Translation ready" : "Review needed";
          const badgeClass = isVerified ? "verified" : "warn";
          let prov = apiRes.provenance || (isVerified ? "Canonical Educational Registry" : "Neural Model Generation");
          let audioStatus = (apiRes.metadata && apiRes.metadata.audio_asset)
            ? "Audio available"
            : "Audio is not available for this phrase yet.";

          const mergedRes = {
            source: apiRes.source_text || val,
            mundari: apiRes.translated_text,
            hindi: (state.translationDirection === "unr-hi") ? apiRes.translated_text : ((apiRes.metadata && apiRes.metadata.hindi_text) || null),
            targetText: apiRes.translated_text,
            phonetic: (apiRes.metadata && apiRes.metadata.mundari_phonetic) || "",
            root: (apiRes.metadata && apiRes.metadata.mundari_root) || "",
            numeral: (apiRes.metadata && apiRes.metadata.number) || null,
            audio_file: (apiRes.metadata && apiRes.metadata.audio_asset) || null,
            audio_status: audioStatus,
            status: isVerified ? "VERIFIED_EDUCATIONAL_LOOKUP" : (apiRes.status || "NEURAL_TRANSLATION_GENERATED"),
            badge: badgeText,
            badgeClass: badgeClass,
            confidence: apiRes.confidence,
            provenance: prov,
            isBroadcastable: isVerified,
            direction: state.translationDirection
          };
          updateTranslationUI(mergedRes);

        } else {
          const oRes = {
            ...localRes,
            source: val,
            mundari: "This sentence could not be translated yet.",
            targetText: "This sentence could not be translated yet.",
            status: "OUT_OF_VOCABULARY",
            badge: "Not translated",
            badgeClass: "danger",
            confidence: (apiRes && apiRes.confidence) || 0,
            provenance: "Unsupported Input",
            isBroadcastable: false,
            audio_file: null,
            direction: state.translationDirection
          };
          updateTranslationUI(oRes);
        }
      })
      .catch(err => {
        // Standalone offline prototype mode: local lookup already applied
      });
  }
}

function toggleMic() {
  let b = $("#mic"), st = $("#micstatus");
  if (state.translationDirection === "unr-hi") {
    toast("Browser Speech API does not support Mundari (unr). Please use text input or quick buttons. Production Android runs an on-device edge classifier.");
    if (st) st.textContent = "Browser speech recognition lacks Mundari (unr) support. Please use text input or quick buttons.";
    return;
  }
  if (!("webkitSpeechRecognition" in window || "SpeechRecognition" in window)) {
    st.textContent = "Speech recognition unavailable in this browser (WEB PROTOTYPE ONLY — browser speech recognition may require network. Production Android will use the local speech pipeline). Use text input.";
    return toast("Browser speech recognition not supported. Please use text input or demo buttons.");
  }
  if (b.classList.contains("listening")) return;
  let R = window.SpeechRecognition || window.webkitSpeechRecognition, r = new R();
  r.lang = "hi-IN";
  r.interimResults = true;
  r.continuous = false;
  b.classList.add("listening");
  st.textContent = "Listening… speak Hindi (WEB PROTOTYPE ONLY)";
  r.onresult = e => {
    const transcript = Array.from(e.results).map(x => x[0].transcript).join("");
    $("#hindi").value = transcript;
    onHindiInput();
  };
  r.onend = () => {
    b.classList.remove("listening");
    st.textContent = "Hindi captured — translated via canonical registry";
  };
  r.onerror = e => {
    b.classList.remove("listening");
    let errCode = e.error || "unknown";
    let msg = "Microphone error (" + errCode + "). Falling back to text input.";
    if (errCode === "not-allowed" || errCode === "permission-denied") {
      msg = "Microphone access was denied. Please allow microphone permissions or type text.";
    } else if (errCode === "no-speech") {
      msg = "No speech detected. Please speak closer to the microphone or use text input.";
    } else if (errCode === "network") {
      msg = "WEB PROTOTYPE ONLY — browser speech recognition may require network. Production Android will use the local speech pipeline. Please use text input.";
    }
    st.textContent = msg;
    toast(msg);
  };
  try {
    r.start();
  } catch (err) {
    b.classList.remove("listening");
    st.textContent = "Could not start microphone: " + err.message;
    toast("Microphone initialization error");
  }
}

function playTeacherPronunciation() {
  const isRev = state.translationDirection === "unr-hi";
  const m = $("#mundari") ? $("#mundari").value.trim() : "";
  if (!m || m.startsWith("[")) return toast("No valid translation to pronounce");
  const current = state.currentTranslation || backendTranslate($("#hindi").value, state.translationDirection);
  if (isRev) {
    // Spoken Hindi playback
    if ("speechSynthesis" in window) {
      let u = new SpeechSynthesisUtterance(m);
      u.lang = "hi-IN";
      u.rate = 0.88;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
      toast("Playing Hindi pronunciation");
    } else {
      toast("Playing Hindi pronunciation");
    }
  } else {
    // Spoken Mundari playback
    const audioUrl = current ? current.audio_file : null;
    if (!audioUrl) {
      return toast("Audio is not available for this phrase yet.");
    }
    speakMundari(m, audioUrl);
  }
}

function broadcast() {
  let h = $("#hindi") ? $("#hindi").value.trim() : "";
  if (!h) return toast("Enter speech or text first");
  const res = (state.currentTranslation && state.currentTranslation.source === h)
    ? state.currentTranslation
    : backendTranslate(h, state.translationDirection);
  if (!res.isBroadcastable) {
    const msg = res.status === "COMPOSED_FROM_ATTESTED_FRAGMENTS"
      ? "Full sentence is unverified and cannot be broadcast."
      : "Cannot broadcast unverified or out-of-vocabulary phrase. Please select an attested phrase.";
    return toast(msg);
  }
  let d = {
    type: "translation",
    direction: state.translationDirection || "hi-unr",
    hindi: h,
    mundari: res.mundari,
    phonetic: res.phonetic,
    numeral: res.numeral,
    audio_file: res.audio_file,
    status: res.status,
    badge: res.badge,
    time: now(),
    teacher: "Teacher"
  };
  sendBus(d);
  addTeacherFeed(d);
  toast("Broadcast sent to connected students (" + (d.direction === "unr-hi" ? "Mundari ➔ Hindi" : "Hindi ➔ Mundari") + ")");
}

function addTeacherFeed(d) {
  let f = $("#teacherfeed");
  if (!f) return;
  let div = document.createElement("div");
  div.className = "feeditem";
  div.innerHTML = `<b>${esc(d.mundari)}</b>
  <div class="small">Hindi: ${esc(d.hindi)} ${d.phonetic ? "• Phonetic: <i>" + esc(d.phonetic) + "</i>" : ""}</div>
  <div class="time">${esc(d.time)} • <span class="badge verified">${esc(d.status)}</span></div>`;
  if (f.querySelector && f.querySelector(".small")?.textContent?.startsWith("Each broadcast")) f.innerHTML = "";
  f.prepend(div);
}

function applyDemoApiResult(val, apiRes) {
  let source = "Safe Fallback";
  let status = "UNSUPPORTED / REQUIRES VALIDATION";
  let badgeClass = "badge-fallback";
  let badgeText = "SAFE FALLBACK";
  let translatedText = "[Out of Vocabulary / Unsupported Input — Refusing to Hallucinate]";
  let score = null;
  let audioAvailable = false;
  let audioFile = null;
  let broadcastEnabled = false;
  let broadcastNotice = "Cannot broadcast unverified or out-of-vocabulary phrase.";
  let step3Sub = "Quality Gate / Out-of-Vocabulary Fallback";
  let step4Sub = "Safe Rejection (Zero Hallucination)";
  let step5Sub = "Broadcast Blocked";
  let step3Class = "active-safe";
  let step4Class = "active-safe";
  let step5Class = "active-safe";

  const isNeural = (apiRes.translation_source === "NEURAL_MODEL" || apiRes.status === "NEURAL_TRANSLATION_GENERATED" || apiRes.match_type === "TIER_2_NEURAL_GENERATED");
  const isVerified = (apiRes.translation_source === "EDUCATIONAL_REGISTRY" || apiRes.status === "VERIFIED_EDUCATIONAL_LOOKUP" || apiRes.status === "EXACT_CANONICAL_LOOKUP" || apiRes.status === "CORPUS_ATTESTED");
  const isCorpus = (apiRes.translation_source === "CORPUS_RETRIEVAL" || apiRes.status === "CORPUS_RETRIEVAL_MATCH");

  if (isVerified) {
    source = "Verified Educational Registry";
    status = "VERIFIED";
    badgeClass = "badge-verified";
    badgeText = "VERIFIED EDUCATIONAL REGISTRY";
    translatedText = apiRes.translated_text || "";
    audioAvailable = true;
    audioFile = (apiRes.metadata && apiRes.metadata.audio_asset) || null;
    broadcastEnabled = true;
    broadcastNotice = "";
    step3Sub = "Verified Educational Registry (Deterministic)";
    step4Sub = "Attested Canonical Term";
    step5Sub = "Approved for Classroom Broadcast";
    step3Class = "active-edu";
    step4Class = "active-edu";
    step5Class = "active-edu";
  } else if (isNeural) {
    source = "Neural Model";
    status = "AI-GENERATED — REQUIRES LINGUISTIC VALIDATION";
    badgeClass = "badge-neural";

function toggleDemoMic() {
  const b = $("#demoMicBtn");
  const st = $("#demoMicStatus");
  if (!("webkitSpeechRecognition" in window || "SpeechRecognition" in window)) {
    const msg = "Browser speech recognition requires network access in Chrome. Android app uses offline Vosk. Please use text input or preset buttons.";
    if (st) st.textContent = msg;
    return toast(msg);
  }
  if (b && b.classList.contains("listening")) return;
  const R = window.SpeechRecognition || window.webkitSpeechRecognition;
  const r = new R();
  r.lang = "hi-IN";
  r.interimResults = true;
  r.continuous = false;
  if (b) b.classList.add("listening");
  if (st) st.textContent = "Listening... Speak Hindi now.";
  toast("Microphone listening... Speak Hindi");
  r.onresult = e => {
    const transcript = Array.from(e.results).map(x => x[0].transcript).join("");
    const inputEl = $("#demoHindiInput");
    if (inputEl) inputEl.value = transcript;
    runDemoTranslate();
  };
  r.onend = () => {
    if (b) b.classList.remove("listening");
    if (st) st.textContent = "Hindi speech captured and processed.";
  };
  r.onerror = e => {
    if (b) b.classList.remove("listening");
    const err = e.error || "unknown";
    let msg = "Microphone error (" + err + "). Browser speech recognition requires network access in Chrome. Android app uses offline Vosk.";
    if (err === "not-allowed" || err === "permission-denied") {
      msg = "Microphone access denied. Browser speech recognition requires network access in Chrome. Android app uses offline Vosk.";
    } else if (err === "no-speech") {
      msg = "No speech detected. Please speak closer to the microphone or click preset buttons.";
    }
    if (st) st.textContent = msg;
    toast(msg);
  };
  try {
    r.start();
  } catch (err) {
    if (b) b.classList.remove("listening");
    if (st) st.textContent = "Could not initialize microphone: " + err.message;
    toast("Microphone error: " + err.message);
  }
}

function translateCurriculum() {
  const input = $("#currInput").value;
  let res = "📖 Curriculum Matches:\n\n";
  let matchedCount = 0;

  // Search exact canonical numbers
  for (let it of DB.numbers) {
    if (input.includes(it.hindi_text)) {
      res += `• [Number] "${it.hindi_text}" (${it.number}) ➔ "${it.mundari_text}" (/${it.mundari_phonetic}/)\n`;
      matchedCount++;
    }
  }

  // Search exact phrasebook commands
  const allPhrases = DB.phrasebook.concat(DB.expandedPhrasebook || []);
  for (let p of allPhrases) {
    if (input.includes(p.hindi_text)) {
      res += `• [${p.category}] "${p.hindi_text}" ➔ "${p.mundari_text}" (/${p.mundari_phonetic}/)\n`;
      matchedCount++;
    }
  }

  if (matchedCount === 0) {
    res += `• No matching lesson phrases found in the curriculum database.\n• Status: Please review this text before classroom use.`;
  } else {
    res += `\nTotal Curriculum Matches: ${matchedCount}`;
  }

  $("#currOutput").textContent = res;
  toast("Curriculum translated");
}

      </div>
      <div class="mt">

      </div>
    </section>
    <aside class="card">
      <h3>🟢 Classroom Info</h3>
      <p><b>Teacher:</b> Live</p>
      <p><b>Room:</b> ${esc(state.room)}</p>
      <p><b>Student:</b> ${esc(state.studentName || "Student")}</p>
      <hr style="border:0;border-top:1px solid var(--line)">
      <button class="btn danger" onclick="leaveRoom()">Leave classroom</button>
    </aside>
  </div>`;
}

function studentAudio() {
  if (!state.lastTranslation) return toast("Waiting for teacher broadcast");
  const d = state.lastTranslation;
  if (d.direction === "unr-hi") {
    if ("speechSynthesis" in window) {
      let u = new SpeechSynthesisUtterance(d.mundari);
      u.lang = "hi-IN";
      u.rate = 0.88;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
      toast("Playing Hindi pronunciation");
    } else {
      toast("Playing Hindi pronunciation");
    }
  } else {
    const audioUrl = d.audio_file || null;
    if (!audioUrl) {
      return toast("Audio is not available for this phrase yet.");
    }
    speakMundari(d.mundari, audioUrl);
  }
}

function speakMundari(text, audioUrl) {
  playDemoPulse();
  if (audioUrl) {
    const cleanUrl = audioUrl.replace(/\\/g, "/");
    let a = new Audio(cleanUrl);
    a.play().then(() => {
      toast("Playing Mundari pronunciation");
    }).catch(err => {
      toast("Audio file could not be loaded: " + cleanUrl);
    });
  } else {
    toast("Audio is not available for this phrase yet.");
  }
}

function fallbackSpeech(text) {
  if ("speechSynthesis" in window) {
    let u = new SpeechSynthesisUtterance(text);
    u.lang = "hi-IN";
    u.rate = 0.85;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
    toast("Playing pronunciation");
  } else {
    toast("Playing pronunciation");
  }
}

function leaveRoom() {
  state.joined = false;
  state.lastTranslation = null;
  save();
  go("home");
}

// =========================================================================
// PHASE 3: STUDENT -> FLASHCARDS
// =========================================================================

function flashcards() {
  const idx = ((state.flashcardIndex % DB.numbers.length) + DB.numbers.length) % DB.numbers.length;
  const it = DB.numbers[idx];
  return `<div class="eyebrow">Flashcards</div>
  <div class="row between">
    <h1 class="title">Learn by seeing & saying</h1>
    <div class="row">
      <label class="small" style="margin:0;margin-right:6px">Jump to:</label>
      <select onchange="jumpFlashcard(this.value)" style="width:auto;padding:6px 10px">
        ${DB.numbers.map((n, i) => `<option value="${i}" ${i === idx ? 'selected' : ''}>${n.number} (${n.mundari_text})</option>`).join("")}
      </select>
    </div>
  </div>
  <p class="sub">Card ${idx + 1} of ${DB.numbers.length}</p>
  <div class="card flash mt">
    <div>
      <div class="number">${it.number} (${it.hindi_numeral})</div>
      ${renderTenFrame(it.number <= 10 ? it.number : 10)}
      <h2>${it.hindi_text} ➔ <span style="color:var(--green)">${it.mundari_text}</span></h2>
      <p>Phonetic Guide: <b>/${it.mundari_phonetic}/</b> (Root: ${it.mundari_root})</p>
      <button class="btn secondary mt" onclick="speakMundari('${it.mundari_text}', '${it.audio_file}')">🔊 Play pronunciation</button>
    </div>
  </div>
  <div class="row mt" style="justify-content:center;gap:16px">
    <button class="btn secondary" onclick="prevFlashcard()">← Previous</button>
    <button class="btn outline" onclick="resetFlashcards()">First (1)</button>
    <button class="btn primary" onclick="nextFlashcard()">Next →</button>
  </div>`;
}

function prevFlashcard() {
  state.flashcardIndex = ((state.flashcardIndex - 1 + DB.numbers.length) % DB.numbers.length);
  render();
}

function nextFlashcard() {
  state.flashcardIndex = (state.flashcardIndex + 1) % DB.numbers.length;
  render();
}

function jumpFlashcard(idx) {
  state.flashcardIndex = parseInt(idx, 10);
  render();
}

function resetFlashcards() {
  state.flashcardIndex = 0;
  render();
}

// =========================================================================
// PHASE 4: STUDENT -> PRACTICE (DYNAMIC DETERMINISTIC QUIZ)
// =========================================================================

function generateQuizQuestions() {
  // Generates 5 structured questions from canonical DB.numbers
  const questions = [
    {
      q: "What is the Mundari word for Hindi number 1 (एक)?",
      target: 1,
      options: [
        { text: "मिअद (miad)", correct: true },
        { text: "बारिया (baria)", correct: false },
        { text: "अपिया (apia)", correct: false },
        { text: "उपुनिया (upunia)", correct: false }
      ],
      explanation: "1 (एक) is मिअद (miad) in Mundari."
    },
    {
      q: "Which numeral corresponds to 'बारिया' (baria)?",
      target: 2,
      options: [
        { text: "1 (१)", correct: false },
        { text: "2 (२)", correct: true },
        { text: "3 (३)", correct: false },
        { text: "4 (४)", correct: false }
      ],
      explanation: "बारिया (baria) is 2 (२)."
    },
    {
      q: "Which number comes after 7 (एया - eya)?",
      target: 8,
      options: [
        { text: "6 (तुरुइआ)", correct: false },
        { text: "8 (इरिलिआ)", correct: true },
        { text: "9 (अरेया)", correct: false },
        { text: "10 (गेलेया)", correct: false }
      ],
      explanation: "After 7 (एया) comes 8 (इरिलिआ)."
    },
    {
      q: "What is the Mundari word for number 5 (पांच)?",
      target: 5,
      options: [
        { text: "उपुनिया (upunia)", correct: false },
        { text: "मोड़ेया (môṛẽa)", correct: true },
        { text: "तुरुइआ (turuia)", correct: false },
        { text: "एया (eya)", correct: false }
      ],
      explanation: "5 (पांच) is मोड़ेया (môṛẽa)."
    },
    {
      q: "What is the teen number for 11 (ग्यारह)?",
      target: 11,
      options: [
        { text: "गेल बारिया (gel baria)", correct: false },
        { text: "गेल मिअद (gel miad)", correct: true },
        { text: "गेल अपिया (gel apia)", correct: false },
        { text: "हिसि (hisi)", correct: false }
      ],
      explanation: "11 is 10 + 1 (गेल मिअद)."
    }
  ];
  return questions;
}

function studentPractice() {
  if (!state.practiceSession) {
    state.practiceSession = {
      active: true,
      questions: generateQuizQuestions(),
      currentIndex: 0,
      score: 0,
      attempts: 0,
      locked: false,
      userChoice: null,
      completed: false
    };
  }

  const s = state.practiceSession;
  if (s.completed) {
    const accuracy = Math.round((s.score / s.questions.length) * 100);
    return `<div class="eyebrow">Practice Quiz Complete</div>
    <div class="card flash">
      <div style="text-align:center">
        <div style="font-size:48px">🏆</div>
        <h1 class="title">Shaabaash! Quiz Finished</h1>
        <p class="sub">Student: <b>${esc(state.studentName || "Student")}</b> (Roll: ${esc(state.roll || "1")})</p>
        <div class="stat" style="font-size:42px;color:var(--green)">${s.score} / ${s.questions.length}</div>
        <p>Accuracy Score: <b>${accuracy}%</b></p>
        <span class="badge ${accuracy >= 80 ? 'live' : accuracy >= 60 ? 'ai' : 'warn'} mt" style="font-size:14px;padding:8px 16px">
          ${accuracy >= 80 ? 'EXCELLING (FLN Competency Mastered)' : accuracy >= 60 ? 'ON TRACK' : 'NEEDS SUPPORT'}
        </span>
        <div class="mt" style="margin-top:20px">
          <button class="btn primary" onclick="restartPracticeQuiz()">🔄 Start New Practice Quiz</button>
          <button class="btn outline" onclick="go('modules')">← Review Numbers</button>
        </div>
      </div>
    </div>`;
  }

  const q = s.questions[s.currentIndex];
  return `<div class="eyebrow">Interactive Practice • Question ${s.currentIndex + 1} of ${s.questions.length}</div>
  <h1 class="title">FLN Numeracy Quiz</h1>
  <p class="sub">Score: <b>${s.score}</b> / ${s.questions.length} • Student: ${esc(state.studentName || "Student")}</p>
  <div class="card">
    <h3>${esc(q.q)}</h3>
    <div class="grid g2 mt">
      ${q.options.map((opt, optIdx) => `
        <button class="btn ${s.locked ? (opt.correct ? 'primary' : (s.userChoice === optIdx ? 'danger' : 'outline')) : 'outline'}"
                style="text-align:left;padding:14px"
                ${s.locked ? 'disabled' : ''}
                onclick="choosePracticeOption(${optIdx})">
          ${optIdx + 1}. ${esc(opt.text)}
        </button>
      `).join("")}
    </div>
    <div id="quizFeedbackBox" class="mt">
      ${s.feedback ? s.feedback : ''}
    </div>
    ${s.locked ? `
      <div class="row mt between" style="border-top:1px solid var(--line);padding-top:14px">
        <button class="btn secondary" onclick="speakMundari('${esc(q.options.find(x => x.correct).text)}')">🔊 Pronounce Correct Answer</button>
        <button class="btn primary" onclick="nextPracticeQuestion()">Next Question →</button>
      </div>
    ` : ''}
  </div>`;
}

function choosePracticeOption(optIdx) {
  const s = state.practiceSession;
  if (!s || s.locked) return; // Prevent double-counting!

  s.locked = true;
  s.attempts++;
  s.userChoice = optIdx;
  const q = s.questions[s.currentIndex];
  const chosen = q.options[optIdx];

  if (chosen.correct) {
    s.score++;
    s.feedback = `<div class="notice success">🎉 <b>Shaabaash! Correct!</b> ${esc(q.explanation)}</div>`;
    toast("Correct answer! +10 Points");
  } else {
    s.feedback = `<div class="notice dangerbox">Try again! ${esc(q.explanation)}</div>`;
    toast("Incorrect answer");
  }
  render();
}

function nextPracticeQuestion() {
  const s = state.practiceSession;
  if (!s) return;
  if (s.currentIndex + 1 < s.questions.length) {
    s.currentIndex++;
    s.locked = false;
    s.userChoice = null;
    s.feedback = null;
  } else {
    s.completed = true;
    // Persist to session practice history
    const record = {
      student: state.studentName || "Student",
      roll: state.roll || "1",
      date: new Date().toLocaleDateString(),
      time: now(),
      score: s.score,
      total: s.questions.length,
      accuracy: Math.round((s.score / s.questions.length) * 100),
      module: "NUMERACY_1_20_DEMO"
    };
    state.practiceHistory.unshift(record);
    localStorage.setItem("vflnPracticeHistory", JSON.stringify(state.practiceHistory));
  }
  render();
}

function restartPracticeQuiz() {
  state.practiceSession = null;
  render();
}

if (typeof window !== "undefined" && window.location && ((window.location.search && window.location.search.includes("demo")) || window.location.hash === "#demo")) {
  enterDemoModeDirect();
} else {
  login();
}
</script>
